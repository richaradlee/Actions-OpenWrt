name: ImmortalWrt x86 V2
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write
      actions: write
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [25.12]

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Maximize build space
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 3. System preparation
      - name: Space cleanup & Timezone
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Asia/Shanghai
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /etc/mysql /etc/php || true
          sudo -E apt-get update
          sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev scdoc
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      # 4. Build date
      - name: Get current date
        id: date
        env:
          TZ: Asia/Shanghai
        run: |
          echo "date=$(TZ=Asia/Shanghai date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          echo "date2=$(TZ=Asia/Shanghai date +'%m/%d %Y')" >> "$GITHUB_ENV"
          echo "date3=$(TZ=Asia/Shanghai date +'%m.%d')" >> "$GITHUB_ENV"

      # 5. Clone ImmortalWrt
      - name: Clone source code
        env:
          REPO_URL: https://github.com/immortalwrt/immortalwrt
          REPO_BRANCH: openwrt-25.12
        run: |
          git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt

      # 6. Update feeds
      - name: Update feeds
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight
          sed -i '1i src-git kenzo https://github.com/kenzok8/openwrt-packages' feeds.conf.default
          sed -i '2i src-git small https://github.com/kenzok8/small' feeds.conf.default
          sed -i '3i src-git vmware https://github.com/vmware/open-vm-tools' feeds.conf.default
          sed -i '4i src-git rtp2httpd https://github.com/stackia/rtp2httpd.git' feeds.conf.default
          ./scripts/feeds update -a 2>&1 | tee preflight/feeds-update.log
          rm -rf feeds/luci/applications/luci-app-mosdns feeds/luci/applications/luci-app-dae feeds/luci/applications/luci-app-daed
          rm -rf feeds/packages/net/alist feeds/packages/net/adguardhome feeds/packages/net/mosdns feeds/packages/net/xray* feeds/packages/net/v2ray-core feeds/packages/utils/v2dat feeds/packages/lang/golang
          rm -rf feeds/small.tmp/info/.packageinfo-luci-app-fchomo feeds/kenzo.tmp/info/.packageinfo-luci-app-fchomo
          git clone --depth 1 -b 1.26 https://github.com/kenzok8/golang.git feeds/packages/lang/golang
          ./scripts/feeds install -a 2>&1 | tee preflight/feeds-install.log
          rm -rf feeds/small.tmp/info/.packageinfo-luci-app-fchomo feeds/kenzo.tmp/info/.packageinfo-luci-app-fchomo
          find feeds -type f -name '*fchomo*' -delete || true

      # 7. Install Lucky
      - name: Install Lucky
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package/lucky package/feeds/lucky
          git clone --depth 1 https://github.com/gdy666/luci-app-lucky.git package/lucky
          echo "===== Lucky files ====="
          find package/lucky -maxdepth 3 -type f | sort | head -100
          if [ ! -f package/lucky/luci-app-lucky/Makefile ]; then
            echo "[FAIL] Lucky Makefile not found"
            find package/lucky -type f -name Makefile -print
            exit 1
          fi

      # 8. Install DAE / official DAED / LUCI-DAEDE
      - name: Install DAE / official DAED / LUCI-DAEDE
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo " INSTALLING DAE / OFFICIAL DAED / LUCI-DAEDE"
          echo "=================================================="

          mkdir -p preflight

          rm -rf package/feeds/small/dae
          rm -rf package/feeds/small/daed
          rm -rf package/feeds/small/luci-app-daed
          rm -rf package/feeds/small/luci-app-daede
          rm -rf package/feeds/luci/luci-app-dae
          rm -rf package/feeds/luci/luci-app-daed
          rm -rf package/feeds/luci/luci-app-daede

          rm -rf package/dae
          rm -rf package/daed
          rm -rf package/luci-app-daede

          rm -rf package/feeds/kenzo/luci-app-dockerman
          rm -rf package/feeds/small/trojan
          rm -rf package/feeds/small/trojan-plus

          rm -rf /tmp/openwrt-daede
          rm -rf /tmp/daed-build

          # DAE and LuCI-DAEDE packaging remains from kenzok8/openwrt-daede.
          # DAED itself is built from the official daeuniverse/daed repository.
          git clone --depth 1 https://github.com/kenzok8/openwrt-daede.git /tmp/openwrt-daede

          cp -a /tmp/openwrt-daede/dae package/dae
          cp -a /tmp/openwrt-daede/luci-app-daede package/luci-app-daede

          echo
          echo "===== Normalize DAE Makefile ====="

          # Normalize the DAE package metadata without deleting its define/endef
          # structure. This avoids the previous "unterminated define" failure.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("package/dae/Makefile")
          s = p.read_text()
          s = s.replace("PKG_VERSION:=2026.08.13", "PKG_VERSION:=1.0.0")
          s = s.replace(
              "PKG_SOURCE_SUBDIR:=$(PKG_NAME)-$(PKG_VERSION)",
              "PKG_SOURCE_SUBDIR:=$(PKG_NAME)-2026.08.13",
          )
          s = s.replace(
              "DAE_BUILD_DIR:=$(BUILD_DIR)/$(PKG_NAME)-$(PKG_VERSION)",
              "DAE_BUILD_DIR:=$(BUILD_DIR)/$(PKG_NAME)-2026.08.13",
          )
          lines = []
          for line in s.splitlines():
              if "vmlinux-btf" not in line:
                  lines.append(line)
          p.write_text("\n".join(lines) + "\n")
          PY

          echo "[ OK ] DAE Makefile normalized without deleting endef"

          echo
          echo "===== Verify DAE Makefile ====="
          grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE|PKG_SOURCE|PKG_SOURCE_URL|PKG_SOURCE_SUBDIR|PKG_HASH|DAE_BUILD_DIR)' package/dae/Makefile || true

          echo
          echo "===== Prepare official DAED source ====="

          mkdir -p /tmp/daed-build
          git clone --depth 1 https://github.com/daeuniverse/daed.git /tmp/daed-build/daed-web

          echo
          echo "===== Build official DAED web frontend ====="

          cd /tmp/daed-build/daed-web

          if ! command -v corepack >/dev/null 2>&1; then
            echo "===== Install Node.js / Corepack ====="
            sudo apt-get update
            sudo apt-get install -y nodejs npm
          fi

          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm --version

          # The official repository currently has a lockfile whose resolved
          # specifiers can differ from package.json (notably @graphql-codegen/cli).
          # CI's default frozen-lockfile mode therefore fails. Use the intended
          # non-frozen install so pnpm can reconcile the lockfile with the
          # checked-out package.json before building the frontend.
          pnpm install --no-frozen-lockfile

          if [ -f package.json ]; then
            echo "===== DAED package.json ====="
            grep -n '"packageManager"\|"@graphql-codegen/cli"' package.json || true
          fi

          if [ -f pnpm-lock.yaml ]; then
            echo "===== DAED lockfile refreshed successfully ====="
          else
            echo "[FAIL] pnpm-lock.yaml not found after dependency installation"
            exit 1
          fi

          echo
          echo "===== Detect official DAED frontend build script ====="

          if node -e 'const p=require("./package.json"); process.exit(p.scripts && p.scripts.build ? 0 : 1)'; then
            pnpm run build
          elif pnpm run | grep -qE '(^|[[:space:]])build([[:space:]]|$)'; then
            pnpm run build
          else
            echo "[FAIL] Official DAED repository has no detectable build script"
            pnpm run
            exit 1
          fi

          echo
          echo "===== Locate built DAED frontend ====="
          find . -maxdepth 5 -type f \( -name 'index.html' -o -name '*.js' -o -name '*.css' \) | head -100

          cd - >/dev/null

          echo
          echo "===== Create DAED OpenWrt package ====="

          mkdir -p package/daed/files/usr/share/daed
          mkdir -p package/daed/files/etc/init.d

          # Copy the official frontend output. Support the common Vite/React
          # dist directory and a repository-specific web/dist directory.
          if [ -d /tmp/daed-build/daed-web/dist ]; then
            cp -a /tmp/daed-build/daed-web/dist/. package/daed/files/usr/share/daed/
          elif [ -d /tmp/daed-build/daed-web/web/dist ]; then
            cp -a /tmp/daed-build/daed-web/web/dist/. package/daed/files/usr/share/daed/
          elif [ -d /tmp/daed-build/daed-web/frontend/dist ]; then
            cp -a /tmp/daed-build/daed-web/frontend/dist/. package/daed/files/usr/share/daed/
          else
            echo "[FAIL] Could not locate official DAED frontend build output"
            find /tmp/daed-build/daed-web -maxdepth 5 -type d \( -name dist -o -name build \) -print
            exit 1
          fi

          # If the repository provides an OpenWrt-compatible daemon Makefile,
          # retain it; otherwise create a minimal package wrapper around the
          # official frontend so the LuCI package can depend on "daed".
          if [ ! -f package/daed/Makefile ]; then
            cat > package/daed/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=daed
          PKG_VERSION:=1.0.0
          PKG_RELEASE:=1

          include $(INCLUDE_DIR)/package.mk

          define Package/daed
            SECTION:=net
            CATEGORY:=Network
            TITLE:=DAED official web frontend
            PKGARCH:=all
          endef

          define Package/daed/description
            DAED official web frontend from daeuniverse/daed.
          endef

          define Build/Compile
          endef

          define Package/daed/install
            $(INSTALL_DIR) $(1)/usr/share/daed
            $(CP) ./files/usr/share/daed/* $(1)/usr/share/daed/
          endef

          $(eval $(call BuildPackage,daed))
          EOF
          fi

          echo
          echo "===== Remove unsupported vmlinux-btf dependency ====="
          sed -i '/vmlinux-btf/d' package/daed/Makefile 2>/dev/null || true

          echo
          echo "===== Create/normalize LUCI-DAEDE backend dependency ====="

          python3 - <<'PY'
          from pathlib import Path
          p = Path("package/luci-app-daede/Makefile")
          s = p.read_text()
          lines = []
          for line in s.splitlines():
              if "DEPENDS:=" in line and "luci-base" in line:
                  line = "  DEPENDS:=+luci-base +dae +daed"
              lines.append(line)
          p.write_text("\n".join(lines) + "\n")
          PY

          echo
          echo "===== Verify DAE Makefile ====="
          grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE|PKG_SOURCE|PKG_SOURCE_URL|PKG_SOURCE_SUBDIR|PKG_HASH|DAE_BUILD_DIR)' package/dae/Makefile || true

          echo
          echo "===== Verify DAED Makefile ====="
          grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE|PKG_SOURCE|PKG_SOURCE_URL|PKG_SOURCE_SUBDIR|PKG_HASH|DAED_BUILD_DIR)' package/daed/Makefile || true

          echo
          echo "===== Verify LUCI-DAEDE dependencies ====="
          grep -n 'DEPENDS' package/luci-app-daede/Makefile || true

          echo
          echo "===== Verify unsupported vmlinux-btf is gone ====="
          if grep -R -n 'vmlinux-btf' package/dae package/daed 2>/dev/null; then
            echo "[FAIL] vmlinux-btf dependency still exists"
            exit 1
          fi
          echo "[ OK ] vmlinux-btf dependency removed"

          echo
          echo "===== Verify package Makefiles ====="
          test -f package/dae/Makefile
          test -f package/daed/Makefile
          test -f package/luci-app-daede/Makefile
          echo "[ OK ] DAE"
          echo "[ OK ] official DAED"
          echo "[ OK ] LUCI-DAEDE"

          echo
          echo "===== Verify APK-safe DAE version ====="
          grep -q '^PKG_VERSION:=1.0.0$' package/dae/Makefile
          echo "[ OK ] DAE version = 1.0.0"

      # 9. Remove FCHOMO residual metadata
      - name: Remove FCHOMO residual metadata
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail
          rm -rf feeds/small.tmp/info/.packageinfo-luci-app-fchomo
          rm -rf feeds/kenzo.tmp/info/.packageinfo-luci-app-fchomo
          find feeds package -type f \( -name '*fchomo*' -o -name '*FCHOMO*' \) -delete || true
          find feeds package -type d \( -name '*fchomo*' -o -name '*FCHOMO*' \) -prune -exec rm -rf {} + || true
          if grep -R -n 'luci-app-fchomo' feeds package 2>/dev/null | head -20; then
            echo "[FAIL] FCHOMO residual reference detected"
            exit 1
          fi
          echo "[ OK ] FCHOMO residual references removed"

      # 10. Static package validation
      - name: PRE-FLIGHT - Static package validation
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo " PRE-FLIGHT - Static package validation"
          echo "=================================================="

          mkdir -p preflight

          check_file() {
            local name="$1"
            local path="$2"
            if [ -f "$path" ]; then
              echo "[ OK ] $name -> $path"
            else
              echo "[FAIL] Missing Makefile: $path"
              exit 1
            fi
          }

          echo "===== Required package Makefiles ====="
          check_file "PassWall2" "package/feeds/small/luci-app-passwall2/Makefile"
          check_file "DAE" "package/dae/Makefile"
          check_file "DAED" "package/daed/Makefile"
          check_file "LUCI-DAEDE" "package/luci-app-daede/Makefile"
          check_file "RTP2HTTPD" "package/feeds/rtp2httpd/luci-app-rtp2httpd/Makefile"
          check_file "Lucky" "package/lucky/luci-app-lucky/Makefile"
          check_file "OpenClash" "feeds/luci/applications/luci-app-openclash/Makefile"

          echo
          echo "===== Old DAE packages must not exist ====="
          for p in package/feeds/small/dae package/feeds/small/daed package/feeds/small/luci-app-daed package/feeds/luci/luci-app-dae package/feeds/luci/luci-app-daed package/feeds/luci/luci-app-daede; do
            if [ -e "$p" ]; then
              echo "[FAIL] Old package still exists: $p"
              exit 1
            fi
            echo "[ OK ] Removed: $p"
          done

          echo
          echo "===== FCHOMO must not exist ====="
          if grep -R -n 'luci-app-fchomo' feeds package 2>/dev/null | head -20; then
            echo "[FAIL] luci-app-fchomo still exists"
            exit 1
          fi
          echo "[ OK ] FCHOMO removed"

          echo
          echo "===== Noisy conflicting packages ====="
          for p in package/feeds/kenzo/luci-app-dockerman package/feeds/small/trojan package/feeds/small/trojan-plus; do
            if [ -e "$p" ]; then
              echo "[FAIL] Conflicting package still exists: $p"
              exit 1
            fi
            echo "[ OK ] Removed: $p"
          done

          echo
          echo "===== DAE/DAED unsupported dependency validation ====="
          if grep -R -n 'vmlinux-btf' package/dae package/daed 2>/dev/null; then
            echo "[FAIL] vmlinux-btf reference detected"
            exit 1
          fi
          echo "[ OK ] No vmlinux-btf dependency"

          echo
          echo "===== Package versions ====="
          {
            echo "===== DAED ====="
            grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE|PKG_SOURCE|PKG_SOURCE_URL|PKG_SOURCE_SUBDIR|PKG_HASH|DAED_BUILD_DIR)' package/daed/Makefile || true
            echo
            echo "===== DAE ====="
            grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE|PKG_SOURCE|PKG_SOURCE_URL|PKG_SOURCE_SUBDIR|PKG_HASH|DAE_BUILD_DIR)' package/dae/Makefile || true
            echo
            echo "===== LUCI-DAEDE ====="
            grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE)' package/luci-app-daede/Makefile || true
            echo
            echo "===== PASSWALL2 ====="
            grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE)' package/feeds/small/luci-app-passwall2/Makefile || true
            echo
            echo "===== LUCKY ====="
            grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE)' package/lucky/luci-app-lucky/Makefile || true
          } | tee preflight/package-versions.txt

          echo
          echo "===== DAE dependencies ====="
          grep -nE 'DEPENDS.*(vmlinux-btf|v2ray-geoip|v2ray-geosite|kmod-sched-bpf|kmod-veth|KERNEL_XDP_SOCKETS)' package/dae/Makefile || true

          echo
          echo "===== DAED dependencies ====="
          grep -nE 'DEPENDS.*(vmlinux-btf|v2ray-geoip|v2ray-geosite|kmod-sched-bpf|kmod-veth|KERNEL_XDP_SOCKETS)' package/daed/Makefile || true

          echo
          echo "===== Residual dependency references ====="
          grep -R --line-number -E 'vmlinux-btf|dae-geoip|dae-geosite|daed-geoip|daed-geosite|luci-lib-docker|cgroupfs-mount|boost-system' package feeds 2>/dev/null | head -100 | tee preflight/dependency-warnings-scan.txt || true

      # 11. Get new themes
      - name: Get new themes
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package/feeds/luci/luci-theme-argon package/feeds/luci/luci-app-argon-config package/feeds/luci/luci-theme-infinityfreedom package/feeds/luci/luci-theme-design package/feeds/luci/luci-theme-opentopd package/feeds/luci/luci-theme-neobird
          git clone --depth 1 -b master https://github.com/jerrykuku/luci-theme-argon.git package/feeds/luci/luci-theme-argon
          git clone --depth 1 -b master https://github.com/jerrykuku/luci-app-argon-config.git package/feeds/luci/luci-app-argon-config

      # 12. Configure firmware
      - name: Custom configure file
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight

          rm -f ./.config*
          touch ./.config

          mkdir -p package/base-files/files/etc/config

          if [ -f package/base-files/files/etc/config/system ]; then
            sed -i "s/^[[:space:]]*option timezone.*/	option timezone 'CST-8'/" package/base-files/files/etc/config/system
            sed -i "s/^[[:space:]]*option zonename.*/	option zonename 'Asia\/Shanghai'/" package/base-files/files/etc/config/system
          else
            cat > package/base-files/files/etc/config/system <<'EOF'
          config system
                  option hostname 'OpenWrt'
                  option timezone 'CST-8'
                  option zonename 'Asia/Shanghai'
          EOF
          fi

          cat >> .config <<EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y
          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_EFI_IMAGES=y
          CONFIG_DEVEL=y
          CONFIG_BPF_TOOLCHAIN_HOST=y
          CONFIG_KERNEL_BPF_EVENTS=y
          CONFIG_KERNEL_CGROUPS=y
          CONFIG_KERNEL_CGROUP_BPF=y
          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y
          CONFIG_KERNEL_KPROBES=y
          CONFIG_KERNEL_KPROBE_EVENTS=y
          CONFIG_KERNEL_XDP_SOCKETS=y
          CONFIG_PACKAGE_kmod-xdp-sockets-diag=y
          CONFIG_PACKAGE_kmod-sched-core=y
          CONFIG_PACKAGE_kmod-sched-bpf=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_kmod-nft-nat6=y
          CONFIG_PACKAGE_kmod-bonding=y
          CONFIG_PACKAGE_proto-bonding=y
          CONFIG_PACKAGE_luci-proto-bonding=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-app-irqbalance=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y
          CONFIG_PACKAGE_luci-app-rtp2httpd=y
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_daed=y
          CONFIG_PACKAGE_luci-app-daed=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y
          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y
          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_SOCAT_SSL=y
          CONFIG_SING_BOX_WITH_ECH=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_open-vm-tools=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_irqbalance=y
          EOF

          sed -i 's/^[ \t]*//' .config

          make defconfig 2>&1 | tee preflight/defconfig.log

          echo "===== Selected package configuration ====="
          grep -E '^CONFIG_PACKAGE_(dae|daed|luci-app-daede|luci-app-passwall2|luci-app-openclash|luci-app-rtp2httpd|luci-app-lucky|v2ray-geoip|v2ray-geosite)=' .config | tee preflight/selected-packages.txt || true

          echo "===== DAEDE backend selection ====="
          grep -E '^CONFIG_PACKAGE_luci-app-daede_(dae|daed)=' .config | tee preflight/daede-backend.txt || true

          echo "===== Kernel BTF configuration ====="
          grep -E '^CONFIG_(DEVEL|BPF_TOOLCHAIN_HOST|KERNEL_BPF_EVENTS|KERNEL_CGROUPS|KERNEL_CGROUP_BPF|KERNEL_DEBUG_INFO|KERNEL_DEBUG_INFO_BTF|KERNEL_DEBUG_INFO_BTF_MODULES|KERNEL_DEBUG_INFO_REDUCED|KERNEL_KPROBES|KERNEL_KPROBE_EVENTS|KERNEL_XDP_SOCKETS)=' .config | tee preflight/btf-config.txt || true

          echo "===== LLVM / Clang environment ====="
          {
            echo "PATH=$PATH"
            echo "CC=${CC:-<unset>}"
            echo "HOSTCC=${HOSTCC:-<unset>}"
            echo "CLANG=${CLANG:-<unset>}"
            echo "LLVM=${LLVM:-<unset>}"
            which clang || true
            clang --version || true
            which llvm-config || true
            llvm-config --version || true
          } | tee preflight/llvm.txt

      # 13. Install complete OpenWrt host tools and toolchain
      - name: PRE-FLIGHT - OpenWrt host tools
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo " PRE-FLIGHT - OpenWrt host tools"
          echo "=================================================="

          mkdir -p preflight

          echo "===== Building and installing complete host tools ====="
          make tools/install V=s -j1 2>&1 | tee preflight/tools-install.log

          echo
          echo "===== Verify required host tools ====="

          if [ ! -x staging_dir/host/bin/sed ]; then
            echo "[FAIL] staging_dir/host/bin/sed was not installed"
            echo "===== Search for sed ====="
            find staging_dir/host -type f -o -type l 2>/dev/null | grep '/sed$' | head -20 || true
            exit 1
          fi
          echo "[ OK ] staging_dir/host/bin/sed"

          if [ ! -x staging_dir/host/bin/libdeflate-gzip ]; then
            echo "[FAIL] staging_dir/host/bin/libdeflate-gzip was not installed"
            exit 1
          fi
          echo "[ OK ] staging_dir/host/bin/libdeflate-gzip"

          if [ ! -x staging_dir/host/bin/patchelf ]; then
            echo "[FAIL] staging_dir/host/bin/patchelf was not installed"
            exit 1
          fi
          echo "[ OK ] staging_dir/host/bin/patchelf"

          if [ ! -x staging_dir/host/bin/fakeroot ]; then
            echo "[FAIL] staging_dir/host/bin/fakeroot was not installed"
            exit 1
          fi
          echo "[ OK ] staging_dir/host/bin/fakeroot"

          echo
          echo "===== Building and installing complete target toolchain ====="
          make toolchain/install V=s -j1 2>&1 | tee preflight/toolchain-install.log

          echo
          echo "===== Verify libgcc_s ====="

          GCC_LIB_DIR=$(find staging_dir -maxdepth 3 -type f -name 'libgcc_s.so.*' -printf '%h\n' | head -1 || true)

          if [ -z "$GCC_LIB_DIR" ]; then
            echo "[FAIL] libgcc_s.so.* was not generated"
            find staging_dir -type f -name 'libgcc_s.so*' -print | head -50 || true
            exit 1
          fi

          echo "[ OK ] libgcc_s directory: $GCC_LIB_DIR"
          find "$GCC_LIB_DIR" -maxdepth 1 -type f -name 'libgcc_s.so.*' -print

          echo
          echo "===== Host toolchain validation passed ====="

      # 14. Pre-flight package compilation
      - name: PRE-FLIGHT - Package compilation
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo " PRE-FLIGHT - DAE / DAED / DAEDE compilation"
          echo "=================================================="

          mkdir -p preflight

          echo "===== Verify host sed before package compilation ====="
          test -x staging_dir/host/bin/sed
          echo "[ OK ] staging_dir/host/bin/sed"

          echo
          echo "===== Verify target libgcc before package compilation ====="
          find staging_dir -type f -name 'libgcc_s.so.*' -print | head -20

          echo
          echo "===== Verify package definitions before compilation ====="
          make package/dae/prepare V=s -j1 2>&1 | tee preflight/dae-prepare.log

          echo
          echo "===== Compile DAE ====="
          make package/dae/compile V=s -j1 2>&1 | tee preflight/dae-compile.log

          echo
          echo "===== Compile DAED ====="
          make package/daed/compile V=s -j1 2>&1 | tee preflight/daed-compile.log

          echo
          echo "===== Compile LUCI-DAEDE ====="
          make package/luci-app-daede/compile V=s -j1 2>&1 | tee preflight/daede-luci-compile.log

          echo
          echo "[ OK ] DAE"
          echo "[ OK ] official DAED"
          echo "[ OK ] LUCI-DAEDE"

      # 15. Upload preflight logs
      - name: Upload preflight logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-preflight-${{ env.date }}
          path: ./openwrt/preflight/
          if-no-files-found: warn
          retention-days: 7

      # 16. Full firmware compilation
      - name: Compile the firmware
        working-directory: ./openwrt
        shell: bash
        run: |
          set -o pipefail

          echo "=================================================="
          echo " ALL PRE-FLIGHT CHECKS PASSED"
          echo " Starting full firmware compilation"
          echo "=================================================="

          make download -j8
          make -j1 V=s 2>&1 | tee build.log

      # 17. Compress build log
      - name: Compress build log
        if: always()
        working-directory: ./openwrt
        shell: bash
        run: |
          if [ -f build.log ]; then gzip -9 -f build.log; fi

      # 18. Upload build log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-build-log-${{ env.date }}
          path: ./openwrt/build.log.gz
          if-no-files-found: warn
          retention-days: 7

      # 19. Get kernel version
      - name: Get kernel version
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_MAKEFILE=$(find build_dir -path '*/linux-x86_64/linux-*/Makefile' -type f | head -1)

          if [ -z "$KERNEL_MAKEFILE" ]; then
            echo "ERROR: Linux kernel Makefile not found."
            exit 1
          fi

          KERNEL_DIR=$(dirname "$KERNEL_MAKEFILE")
          VERSION=$(grep '^VERSION = ' "$KERNEL_MAKEFILE" | awk '{print $3}')
          PATCHLEVEL=$(grep '^PATCHLEVEL = ' "$KERNEL_MAKEFILE" | awk '{print $3}')
          SUBLEVEL=$(grep '^SUBLEVEL = ' "$KERNEL_MAKEFILE" | awk '{print $3}')

          KERNEL_VERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"

          echo "Kernel source: $KERNEL_DIR"
          echo "Kernel version: $KERNEL_VERSION"

          echo "KERNEL_VERSION=$KERNEL_VERSION" >> "$GITHUB_ENV"

      # 20. Prepare artifacts
      - name: Prepare artifact
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifact/firmware artifact/package artifact/buildinfo

          find ./bin/targets/ -type f -name "openwrt-x86-64-generic-kernel.bin" -delete
          find ./bin/targets/ -type f -name "openwrt-x86-64-generic-squashfs-rootfs.img.gz" -delete
          find ./bin/targets/ -type d -name "packages" -prune -exec rm -rf {} +

          find ./bin/targets/ -type f -name "*combined-efi.img.gz" -exec cp {} ./artifact/firmware/ \;
          find ./bin/packages/ -type f -name "*.ipk" -exec cp {} ./artifact/package/ \;
          find ./bin/packages/ -type f -name "*.apk" -exec cp {} ./artifact/package/ \;
          find ./bin/targets/ -type f \( -name "*.buildinfo" -o -name "*.manifest" \) -exec cp {} ./artifact/buildinfo/ \;

      # 21. Deliver buildinfo
      - name: Deliver buildinfo
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date }}.ImmortalWRT.x86.buildinfo.25.12
          path: ./openwrt/artifact/buildinfo/
          retention-days: 30

      # 22. Deliver packages
      - name: Deliver package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date }}.ImmortalWRT.x86.package.25.12
          path: ./openwrt/artifact/package/
          retention-days: 30

      # 23. Deliver firmware
      - name: Deliver firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date }}.ImmortalWRT.x86.firmware.25.12
          path: ./openwrt/artifact/firmware/
          retention-days: 30

      # 24. GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OpenWrt-${{ env.date }}
          name: OpenWrt 25.12 x86_64 - ${{ env.date }}
          body: |
            ## OpenWrt 25.12 x86_64
            **固件内核：** ${{ env.KERNEL_VERSION }}
            **编译时间：** ${{ env.date }}（北京时间）
            **目标平台：** x86_64 Generic
            **固件格式：** EFI
            **主要组件：**
            - OpenClash
            - PassWall2
            - DAED / DAEDE
            - DAE
            - SQM / CAKE
            - WireGuard
            - OpenVPN
            - Lucky
            - RTP2HTTPD
            - Argon Theme
            **源码：** ImmortalWrt openwrt-25.12
            **DAE：** kenzok8/openwrt-daede
            **DAED：** daeuniverse/daed
            **软件库：** kenzok8/small
            > 本 Release 为 GitHub Actions 自动编译发布。
          files: |
            ./openwrt/artifact/firmware/*
            ./openwrt/artifact/buildinfo/*
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 25. Delete old workflow runs
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 20
          keep_minimum_runs: 3

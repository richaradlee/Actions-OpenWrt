name: ImmortalWrt x86 V2

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write
      actions: write
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [25.12]

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Maximize build space
      # ============================================================
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # ============================================================
      # 3. System preparation
      # ============================================================
      - name: Space cleanup & Timezone
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Asia/Shanghai
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /etc/mysql \
            /etc/php || true

          sudo -E apt-get update

          sudo -E apt-get -y install \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
            genisoimage git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz \
            ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev scdoc

          sudo -E timedatectl set-timezone "Asia/Shanghai"

      # ============================================================
      # 4. Build date
      # ============================================================
      - name: Get current date
        env:
          TZ: Asia/Shanghai
        run: |
          echo "date=$(TZ=Asia/Shanghai date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          echo "date2=$(TZ=Asia/Shanghai date +'%m/%d %Y')" >> "$GITHUB_ENV"
          echo "date3=$(TZ=Asia/Shanghai date +'%m.%d')" >> "$GITHUB_ENV"

      # ============================================================
      # 5. Clone ImmortalWrt
      # ============================================================
      - name: Clone source code
        env:
          REPO_URL: https://github.com/immortalwrt/immortalwrt
          REPO_BRANCH: openwrt-25.12
        run: |
          git clone --depth 1 \
            "$REPO_URL" \
            -b "$REPO_BRANCH" \
            openwrt

      # ============================================================
      # 6. Update feeds
      # ============================================================
      - name: Update feeds
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight

          echo "=================================================="
          echo " Adding third-party feeds"
          echo "=================================================="

          sed -i '1i src-git kenzo https://github.com/kenzok8/openwrt-packages' feeds.conf.default
          sed -i '2i src-git small https://github.com/kenzok8/small' feeds.conf.default
          sed -i '3i src-git vmware https://github.com/vmware/open-vm-tools' feeds.conf.default
          sed -i '4i src-git rtp2httpd https://github.com/stackia/rtp2httpd.git' feeds.conf.default
          sed -i '5i src-git lucky https://github.com/gdy666/luci-app-lucky' feeds.conf.default

          echo "===== feeds.conf.default ====="
          cat feeds.conf.default | tee preflight/feeds.conf.default

          echo "===== Updating feeds ====="
          ./scripts/feeds update -a 2>&1 | tee preflight/feeds-update.log

          echo "===== Removing conflicting packages ====="

          rm -rf feeds/luci/applications/luci-app-mosdns
          rm -rf feeds/packages/net/alist
          rm -rf feeds/packages/net/adguardhome
          rm -rf feeds/packages/net/mosdns
          rm -rf feeds/packages/net/xray*
          rm -rf feeds/packages/net/v2ray*
          rm -rf feeds/packages/net/sing*
          rm -rf feeds/packages/net/smartdns
          rm -rf feeds/packages/utils/v2dat
          rm -rf feeds/packages/lang/golang

          echo "===== Installing kenzok8 golang 1.26 ====="

          git clone --depth 1 \
            -b 1.26 \
            https://github.com/kenzok8/golang.git \
            feeds/packages/lang/golang

          echo "===== Installing feeds ====="
          ./scripts/feeds install -a 2>&1 | tee preflight/feeds-install.log

          echo "===== Removing known problematic packages ====="

          find package/feeds feeds -type d \
            -name "luci-app-fchomo" \
            -print \
            -exec rm -rf {} + 2>/dev/null || true

          find package/feeds feeds -type d \
            -name "trojan-plus" \
            -print \
            -exec rm -rf {} + 2>/dev/null || true

          echo "===== Feed status ====="
          ./scripts/feeds list -s | tee preflight/feeds-status.txt

      # ============================================================
      # 7. PRE-FLIGHT - Package discovery
      # ============================================================
      - name: PRE-FLIGHT - Package discovery and validation
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight

          echo "=================================================="
          echo " PRE-FLIGHT - Package discovery / validation"
          echo "=================================================="

          find_pkg_dir() {
            local name="$1"
            find package/feeds feeds -type d -name "$name" 2>/dev/null | head -1
          }

          find_pkg_makefile() {
            local name="$1"
            find package/feeds feeds -type f \
              -path "*/$name/Makefile" \
              2>/dev/null | head -1
          }

          PASSWALL2_PATH="$(find_pkg_dir luci-app-passwall2 || true)"
          DAED_PATH="$(find_pkg_dir daed || true)"
          DAED_LUCI_PATH="$(find_pkg_dir luci-app-daed || true)"
          RTP2HTTPD_PATH="$(find_pkg_dir luci-app-rtp2httpd || true)"
          LUCKY_PATH="$(find_pkg_dir luci-app-lucky || true)"
          OPENCLASH_PATH="$(find_pkg_dir luci-app-openclash || true)"

          {
            echo "PASSWALL2_PATH=${PASSWALL2_PATH:-NOT_FOUND}"
            echo "DAED_PATH=${DAED_PATH:-NOT_FOUND}"
            echo "DAED_LUCI_PATH=${DAED_LUCI_PATH:-NOT_FOUND}"
            echo "RTP2HTTPD_PATH=${RTP2HTTPD_PATH:-NOT_FOUND}"
            echo "LUCKY_PATH=${LUCKY_PATH:-NOT_FOUND}"
            echo "OPENCLASH_PATH=${OPENCLASH_PATH:-NOT_FOUND}"
          } | tee preflight/resolved-package-paths.txt

          echo
          echo "===== Package directories ====="

          for item in \
            "luci-app-passwall2|$PASSWALL2_PATH" \
            "daed|$DAED_PATH" \
            "luci-app-daed|$DAED_LUCI_PATH" \
            "luci-app-rtp2httpd|$RTP2HTTPD_PATH" \
            "luci-app-lucky|$LUCKY_PATH" \
            "luci-app-openclash|$OPENCLASH_PATH"
          do
            name="${item%%|*}"
            path="${item#*|}"

            if [ -n "$path" ]; then
              echo "[ OK ] $name -> $path"
            else
              echo "[FAIL] $name not found"
              exit 1
            fi
          done

          echo
          echo "===== Package Makefiles ====="

          check_makefile() {
            local name="$1"
            local path
            path="$(find_pkg_makefile "$name" || true)"

            if [ -n "$path" ]; then
              echo "[ OK ] $name -> $path"
            else
              echo "[FAIL] Missing Makefile: $name"
              exit 1
            fi
          }

          check_makefile luci-app-passwall2
          check_makefile daed
          check_makefile luci-app-daed
          check_makefile luci-app-rtp2httpd
          check_makefile luci-app-lucky
          check_makefile luci-app-openclash

          echo
          echo "===== Actual package Makefile locations ====="

          {
            find package/feeds feeds -type f \
              \( \
                -path "*/luci-app-passwall2/Makefile" \
                -o -path "*/daed/Makefile" \
                -o -path "*/luci-app-daed/Makefile" \
                -o -path "*/luci-app-rtp2httpd/Makefile" \
                -o -path "*/luci-app-lucky/Makefile" \
                -o -path "*/luci-app-openclash/Makefile" \
              \) \
              2>/dev/null
          } | tee preflight/package-makefile-paths.txt

      # ============================================================
      # 8. PRE-FLIGHT - Removed package validation
      # ============================================================
      - name: PRE-FLIGHT - Removed package validation
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight

          echo "=================================================="
          echo " PRE-FLIGHT - Removed package validation"
          echo "=================================================="

          echo "===== luci-app-fchomo ====="

          FCHOMO_PATHS="$(find package/feeds feeds -type d \
            -name "luci-app-fchomo" \
            2>/dev/null || true)"

          if [ -n "$FCHOMO_PATHS" ]; then
            echo "[FAIL] luci-app-fchomo still exists:"
            echo "$FCHOMO_PATHS"
            exit 1
          else
            echo "[ OK ] luci-app-fchomo removed"
          fi

          echo
          echo "===== trojan-plus ====="

          TROJAN_PATHS="$(find package/feeds feeds -type d \
            -name "trojan-plus" \
            2>/dev/null || true)"

          if [ -n "$TROJAN_PATHS" ]; then
            echo "[FAIL] trojan-plus still exists:"
            echo "$TROJAN_PATHS"
            exit 1
          else
            echo "[ OK ] trojan-plus removed"
          fi

          {
            echo "luci-app-fchomo:"
            [ -z "$FCHOMO_PATHS" ] && echo "REMOVED" || echo "$FCHOMO_PATHS"
            echo
            echo "trojan-plus:"
            [ -z "$TROJAN_PATHS" ] && echo "REMOVED" || echo "$TROJAN_PATHS"
          } | tee preflight/removed-packages.txt

      # ============================================================
      # 9. Get new themes
      # ============================================================
      - name: Get new themes
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail

          rm -rf package/feeds/luci/luci-theme-argon
          rm -rf package/feeds/luci/luci-app-argon-config
          rm -rf package/feeds/luci/luci-theme-infinityfreedom
          rm -rf package/feeds/luci/luci-theme-design
          rm -rf package/feeds/luci/luci-theme-opentopd
          rm -rf package/feeds/luci/luci-theme-neobird

          git clone -b master \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/feeds/luci/luci-theme-argon

          git clone -b master \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/feeds/luci/luci-app-argon-config

      # ============================================================
      # 10. Generate configuration
      # ============================================================
      - name: Custom configure file
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight

          rm -f .config .config.old
          touch .config

          mkdir -p package/base-files/files/etc/config

          if [ -f package/base-files/files/etc/config/system ]; then
            sed -i "s/^[[:space:]]*option timezone.*/	option timezone 'CST-8'/" \
              package/base-files/files/etc/config/system
            sed -i "s/^[[:space:]]*option zonename.*/	option zonename 'Asia\/Shanghai'/" \
              package/base-files/files/etc/config/system
          else
            cat > package/base-files/files/etc/config/system <<'EOF'
          config system
                  option hostname 'OpenWrt'
                  option timezone 'CST-8'
                  option zonename 'Asia/Shanghai'
          EOF
          fi

          cat >> .config <<EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y
          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_EFI_IMAGES=y

          CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_kmod-nft-nat6=y

          CONFIG_PACKAGE_kmod-bonding=y
          CONFIG_PACKAGE_proto-bonding=y
          CONFIG_PACKAGE_luci-proto-bonding=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-app-filebrowser=n
          CONFIG_PACKAGE_luci-app-irqbalance=y
          CONFIG_PACKAGE_luci-app-taskplan=n
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y

          CONFIG_PACKAGE_luci-app-rtp2httpd=y

          CONFIG_PACKAGE_luci-app-ssr-plus=n
          CONFIG_PACKAGE_luci-app-passwall=n
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-mihomo=n
          CONFIG_PACKAGE_luci-app-homeproxy=n

          CONFIG_PACKAGE_daed=y
          CONFIG_PACKAGE_luci-app-daed=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_ip-full=y

          CONFIG_PACKAGE_luci-app-softethervpn=n
          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_luci-app-openvpn-server=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y
          CONFIG_PACKAGE_netbird=n
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y

          CONFIG_PACKAGE_luci-theme-argon=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_vim-fuller=n
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y
          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_SOCAT_SSL=y
          CONFIG_SING_BOX_WITH_ECH=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_open-vm-tools=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_irqbalance=y
          EOF

          sed -i 's/^[ \t]*//' .config

          echo "=================================================="
          echo " Running make defconfig"
          echo "=================================================="

          make defconfig 2>&1 | tee preflight/defconfig.log

          echo
          echo "=================================================="
          echo " Selected package configuration"
          echo "=================================================="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-daed|luci-app-lucky|luci-app-openclash|luci-app-passwall2|luci-app-rtp2httpd|daed)=' \
            .config \
            | tee preflight/selected-packages.txt || true

          echo
          echo "===== Required package config validation ====="

          REQUIRED_CONFIGS=(
            "CONFIG_PACKAGE_luci-app-passwall2=y"
            "CONFIG_PACKAGE_luci-app-openclash=y"
            "CONFIG_PACKAGE_daed=y"
            "CONFIG_PACKAGE_luci-app-daed=y"
            "CONFIG_PACKAGE_luci-app-rtp2httpd=y"
            "CONFIG_PACKAGE_luci-app-lucky=y"
          )

          for cfg in "${REQUIRED_CONFIGS[@]}"; do
            if grep -qx "$cfg" .config; then
              echo "[ OK ] $cfg"
            else
              echo "[FAIL] $cfg"
              exit 1
            fi
          done

          echo
          echo "===== Disabled problematic packages ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-fchomo|trojan-plus)=' \
            .config \
            | tee preflight/disabled-packages.txt || true

      # ============================================================
      # 11. PRE-FLIGHT - LLVM environment
      # ============================================================
      - name: PRE-FLIGHT - LLVM environment
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight

          echo "=================================================="
          echo " PRE-FLIGHT - LLVM / Clang environment"
          echo "=================================================="

          {
            echo "PATH=$PATH"
            echo "CC=${CC:-}"
            echo "HOSTCC=${HOSTCC:-}"
            echo "CLANG=${CLANG:-}"
            echo "LLVM=${LLVM:-}"

            echo
            echo "--- clang ---"
            command -v clang || true
            clang --version || true

            echo
            echo "--- llvm-config ---"
            command -v llvm-config || true
            llvm-config --version || true

            echo
            echo "--- gcc ---"
            command -v gcc || true
            gcc --version | head -1 || true
          } | tee preflight/llvm.txt

          echo
          echo "===== LLVM config ====="

          grep -E \
            'CONFIG_(LLVM|BPF|DEBUG_INFO_BTF)' \
            .config \
            | tee preflight/llvm-config.txt || true

      # ============================================================
      # 12. PRE-FLIGHT - Dependency scan
      # ============================================================
      - name: PRE-FLIGHT - Dependency scan
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight

          echo "=================================================="
          echo " PRE-FLIGHT - Dependency scan"
          echo "=================================================="

          echo "===== boost dependencies ====="

          grep -R \
            --line-number \
            -E 'boost-system|boost-program_options|boost-date_time' \
            package feeds \
            2>/dev/null \
            | tee preflight/boost-dependencies.txt || true

          echo
          echo "===== fchomo references ====="

          grep -R \
            --line-number \
            "luci-app-fchomo" \
            package feeds \
            2>/dev/null \
            | tee preflight/fchomo-references.txt || true

          echo
          echo "===== trojan-plus references ====="

          grep -R \
            --line-number \
            "trojan-plus" \
            package feeds \
            2>/dev/null \
            | tee preflight/trojan-plus-references.txt || true

      # ============================================================
      # 13. PRE-FLIGHT - Package metadata
      # ============================================================
      - name: PRE-FLIGHT - Package metadata
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight

          echo "=================================================="
          echo " PRE-FLIGHT - Package metadata"
          echo "=================================================="

          find_makefile() {
            local name="$1"
            find package/feeds feeds -type f \
              -path "*/$name/Makefile" \
              2>/dev/null | head -1
          }

          for name in \
            luci-app-passwall2 \
            daed \
            luci-app-daed \
            luci-app-rtp2httpd \
            luci-app-lucky \
            luci-app-openclash
          do
            file="$(find_makefile "$name" || true)"

            if [ -z "$file" ]; then
              echo "[FAIL] Cannot locate Makefile for $name"
              exit 1
            fi

            echo
            echo "===== $name ====="
            echo "FILE: $file"

            sed -n '1,220p' "$file"
          done | tee preflight/package-metadata.txt

      # ============================================================
      # 14. Upload PRE-FLIGHT logs
      # ============================================================
      - name: Upload preflight logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-preflight-${{ env.date }}
          path: ./openwrt/preflight/
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 15. Full firmware compilation
      # ============================================================
      - name: Compile the firmware
        working-directory: ./openwrt
        shell: bash
        run: |
          set -o pipefail

          echo "=================================================="
          echo " ALL PRE-FLIGHT CHECKS PASSED"
          echo " Starting full firmware compilation"
          echo "=================================================="

          make download -j8
          make -j1 V=s 2>&1 | tee build.log

      # ============================================================
      # 16. Compress build log
      # ============================================================
      - name: Compress build log
        if: always()
        working-directory: ./openwrt
        shell: bash
        run: |
          if [ -f build.log ]; then
            gzip -9 -f build.log
          fi

      # ============================================================
      # 17. Upload build log
      # ============================================================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-build-log-${{ env.date }}
          path: ./openwrt/build.log.gz
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 18. Get kernel version
      # ============================================================
      - name: Get kernel version
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_MAKEFILE=$(find build_dir \
            -path '*/linux-x86_64/linux-*/Makefile' \
            -type f \
            | head -1)

          if [ -z "$KERNEL_MAKEFILE" ]; then
            echo "ERROR: Linux kernel Makefile not found."
            exit 1
          fi

          KERNEL_DIR=$(dirname "$KERNEL_MAKEFILE")

          VERSION=$(grep '^VERSION = ' "$KERNEL_MAKEFILE" | awk '{print $3}')
          PATCHLEVEL=$(grep '^PATCHLEVEL = ' "$KERNEL_MAKEFILE" | awk '{print $3}')
          SUBLEVEL=$(grep '^SUBLEVEL = ' "$KERNEL_MAKEFILE" | awk '{print $3}')

          KERNEL_VERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"

          echo "Kernel source: $KERNEL_DIR"
          echo "Kernel version: $KERNEL_VERSION"
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> "$GITHUB_ENV"

      # ============================================================
      # 19. Prepare artifact
      # ============================================================
      - name: Prepare artifact
        working-directory: ./openwrt
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifact/firmware
          mkdir -p artifact/package
          mkdir -p artifact/buildinfo

          find ./bin/targets/ \
            -type f \
            -name "openwrt-x86-64-generic-kernel.bin" \
            -delete

          find ./bin/targets/ \
            -type f \
            -name "openwrt-x86-64-generic-squashfs-rootfs.img.gz" \
            -delete

          find ./bin/targets/ \
            -type d \
            -name "packages" \
            -prune \
            -exec rm -rf {} +

          cp \
            $(find ./bin/targets/ \
              -type f \
              -name "*combined-efi.img.gz") \
            ./artifact/firmware/

          cp \
            $(find ./bin/packages/ \
              -type f \
              -name "*.ipk") \
            ./artifact/package/

          cp \
            $(find ./bin/targets/ \
              -type f \
              \( -name "*.buildinfo" -o -name "*.manifest" \)) \
            ./artifact/buildinfo/

      # ============================================================
      # 20. Deliver buildinfo
      # ============================================================
      - name: Deliver buildinfo
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date }}.ImmortalWRT.x86.buildinfo.25.12
          path: ./openwrt/artifact/buildinfo/
          retention-days: 30

      # ============================================================
      # 21. Deliver packages
      # ============================================================
      - name: Deliver package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date }}.ImmortalWRT.x86.package.25.12
          path: ./openwrt/artifact/package/
          retention-days: 30

      # ============================================================
      # 22. Deliver firmware
      # ============================================================
      - name: Deliver firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date }}.ImmortalWRT.x86.firmware.25.12
          path: ./openwrt/artifact/firmware/
          retention-days: 30

      # ============================================================
      # 23. GitHub Release
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OpenWrt-${{ env.date }}
          name: OpenWrt 25.12 x86_64 - ${{ env.date }}
          body: |
            ## OpenWrt 25.12 x86_64

            **固件内核：** ${{ env.KERNEL_VERSION }}

            **编译时间：** ${{ env.date }}（北京时间）

            **目标平台：** x86_64 Generic

            **固件格式：** EFI

            **主要组件：**
            - OpenClash
            - PassWall2
            - DAED
            - SQM / CAKE
            - WireGuard
            - OpenVPN
            - Lucky
            - RTP2HTTPD
            - Argon Theme

            **源码：** ImmortalWrt openwrt-25.12
            **软件库：** kenzok8/small

            > 本 Release 为 GitHub Actions 自动编译发布。

          files: |
            ./openwrt/artifact/firmware/*
            ./openwrt/artifact/buildinfo/*
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 24. Delete old workflow runs
      # ============================================================
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 20
          keep_minimum_runs: 3

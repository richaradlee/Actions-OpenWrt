name: ImmortalWrt x86 Latest - Test #3

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    if: github.event.repository.owner.id == github.event.sender.id

    permissions:
      contents: write
      actions: write

    name: Build ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        target: [25.12]

    steps:

      # ============================================================
      # 1. Checkout workflow repository
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Maximize build space
      # ============================================================

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'


      # ============================================================
      # 3. Install build dependencies
      # ============================================================

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Asia/Shanghai

        run: |
          set -e

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /etc/mysql \
            /etc/php || true

          sudo -E apt-get update

          sudo -E apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            scdoc

          sudo -E timedatectl set-timezone "Asia/Shanghai"


      # ============================================================
      # 4. Get current date
      # ============================================================

      - name: Get current date
        id: date
        env:
          TZ: Asia/Shanghai

        run: |
          echo "date=$(TZ=Asia/Shanghai date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          echo "date2=$(TZ=Asia/Shanghai date +'%m/%d %Y')" >> "$GITHUB_ENV"
          echo "date3=$(TZ=Asia/Shanghai date +'%m.%d')" >> "$GITHUB_ENV"


      # ============================================================
      # 5. Clone ImmortalWrt source
      # ============================================================

      - name: Clone ImmortalWrt source
        env:
          REPO_URL: https://github.com/immortalwrt/immortalwrt
          REPO_BRANCH: openwrt-25.12

        run: |
          set -e

          git clone \
            --depth 1 \
            "$REPO_URL" \
            -b "$REPO_BRANCH" \
            openwrt

          cd openwrt

          echo "ImmortalWrt commit:"
          git log -1 --oneline

          echo "ImmortalWrt branch:"
          git branch --show-current


      # ============================================================
      # 6. Configure upstream third-party sources
      #
      # IMPORTANT:
      # No kenzok8/small
      # No kenzok8/openwrt-packages
      #
      # This is the main difference from Test #2.
      # ============================================================

      - name: Configure upstream feeds
        working-directory: ./openwrt

        run: |
          set -e

          echo "===== Configure upstream feeds ====="

          # RTP2HTTPD 官方 OpenWrt feed
          sed -i \
            '1i src-git rtp2httpd https://github.com/stackia/rtp2httpd.git' \
            feeds.conf.default

          # 显式打印最终 feeds
          echo
          echo "===== feeds.conf.default ====="
          cat feeds.conf.default
          echo "=============================="
          echo


      # ============================================================
      # 7. Update official feeds
      # ============================================================

      - name: Update official feeds
        working-directory: ./openwrt

        run: |
          set -e

          ./scripts/feeds update -a

          ./scripts/feeds install -a


      # ============================================================
      # 8. Install upstream third-party packages directly
      #
      # OpenClash
      # PassWall2
      # DAED
      # Lucky
      #
      # No small feed.
      # ============================================================

      - name: Install upstream third-party packages
        working-directory: ./openwrt

        run: |
          set -e

          echo "===== Installing upstream packages ====="

          # ----------------------------------------------------------
          # OpenClash
          # ----------------------------------------------------------

          rm -rf package/feeds/luci/luci-app-openclash
          rm -rf package/openclash

          git clone \
            --depth 1 \
            https://github.com/vernesong/OpenClash.git \
            package/openclash


          # ----------------------------------------------------------
          # PassWall2
          # ----------------------------------------------------------

          rm -rf package/feeds/luci/luci-app-passwall2
          rm -rf package/passwall2

          git clone \
            --depth 1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall2.git \
            package/passwall2


          # ----------------------------------------------------------
          # DAED
          #
          # IMPORTANT:
          # Do NOT use ImmortalWrt's old package/dae.
          # QiuSimons upstream package contains the current
          # DAED/OpenWrt integration.
          # ----------------------------------------------------------

          rm -rf package/dae
          rm -rf package/feeds/base/dae

          git clone \
            --depth 1 \
            https://github.com/QiuSimons/luci-app-daed.git \
            package/dae


          # ----------------------------------------------------------
          # Lucky
          # ----------------------------------------------------------

          rm -rf package/feeds/lucky/luci-app-lucky
          rm -rf package/lucky

          git clone \
            --depth 1 \
            https://github.com/gdy666/luci-app-lucky.git \
            package/lucky


          echo
          echo "===== Upstream package installation complete ====="


      # ============================================================
      # 9. Refresh feeds after adding third-party packages
      # ============================================================

      - name: Install feed packages
        working-directory: ./openwrt

        run: |
          set -e

          ./scripts/feeds install -a


      # ============================================================
      # 10. Get latest Argon theme
      # ============================================================

      - name: Get latest Argon theme
        working-directory: ./openwrt

        run: |
          set -e

          rm -rf package/feeds/luci/luci-theme-argon
          rm -rf package/feeds/luci/luci-app-argon-config

          rm -rf package/argon
          rm -rf package/argon-config

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/argon

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/argon-config


      # ============================================================
      # 11. Third-party source audit
      #
      # This step is VERY IMPORTANT.
      #
      # Before compilation we record:
      #   - repository
      #   - commit
      #   - package version
      #
      # So we no longer need to dig through huge build logs.
      # ============================================================

      - name: Third-party source audit
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "THIRD-PARTY SOURCE AUDIT"
          echo "============================================================"

          echo
          echo "===== ImmortalWrt ====="
          git log -1 --format='commit: %H%nsubject: %s'

          echo
          echo "===== OpenClash ====="
          if [ -d package/openclash/.git ]; then
            git -C package/openclash log -1 --format='commit: %H%nsubject: %s'
            grep -R -E '^(PKG_VERSION|PKG_RELEASE)[:?]?=' \
              package/openclash 2>/dev/null | head -20 || true
          fi

          echo
          echo "===== PassWall2 ====="
          if [ -d package/passwall2/.git ]; then
            git -C package/passwall2 log -1 --format='commit: %H%nsubject: %s'
            grep -R -E '^(PKG_VERSION|PKG_RELEASE)[:?]?=' \
              package/passwall2 2>/dev/null | head -20 || true
          fi

          echo
          echo "===== DAED ====="
          if [ -d package/dae/.git ]; then
            git -C package/dae log -1 --format='commit: %H%nsubject: %s'
            grep -R -E '^(PKG_VERSION|PKG_RELEASE|PKG_SOURCE_VERSION)[:?]?=' \
              package/dae 2>/dev/null | head -30 || true
          fi

          echo
          echo "===== Lucky ====="
          if [ -d package/lucky/.git ]; then
            git -C package/lucky log -1 --format='commit: %H%nsubject: %s'
            grep -R -E '^(PKG_VERSION|PKG_RELEASE)[:?]?=' \
              package/lucky 2>/dev/null | head -20 || true
          fi

          echo
          echo "===== RTP2HTTPD ====="
          if [ -d feeds/rtp2httpd/.git ]; then
            git -C feeds/rtp2httpd log -1 --format='commit: %H%nsubject: %s'
            grep -R -E '^(PKG_VERSION|PKG_RELEASE)[:?]?=' \
              feeds/rtp2httpd 2>/dev/null | head -20 || true
          fi

          echo
          echo "===== Argon ====="
          if [ -d package/argon/.git ]; then
            git -C package/argon log -1 --format='commit: %H%nsubject: %s'
            grep -R -E '^(PKG_VERSION|PKG_RELEASE)[:?]?=' \
              package/argon 2>/dev/null | head -20 || true
          fi

          echo
          echo "===== Argon Config ====="
          if [ -d package/argon-config/.git ]; then
            git -C package/argon-config log -1 --format='commit: %H%nsubject: %s'
            grep -R -E '^(PKG_VERSION|PKG_RELEASE)[:?]?=' \
              package/argon-config 2>/dev/null | head -20 || true
          fi

          echo
          echo "============================================================"
          echo "END THIRD-PARTY SOURCE AUDIT"
          echo "============================================================"


      # ============================================================
      # 12. Custom configuration
      # ============================================================

      - name: Custom configure file
        working-directory: ./openwrt

        run: |
          set -e

          rm -f ./.config*
          touch ./.config


          # ----------------------------------------------------------
          # System timezone
          # ----------------------------------------------------------

          mkdir -p package/base-files/files/etc/config

          if [ -f package/base-files/files/etc/config/system ]; then

            sed -i \
              "s/^[[:space:]]*option timezone.*/	option timezone 'CST-8'/" \
              package/base-files/files/etc/config/system

            sed -i \
              "s/^[[:space:]]*option zonename.*/	option zonename 'Asia\/Shanghai'/" \
              package/base-files/files/etc/config/system

          else

            cat > package/base-files/files/etc/config/system <<'EOF'
          config system
                  option hostname 'OpenWrt'
                  option timezone 'CST-8'
                  option zonename 'Asia/Shanghai'
          EOF

          fi


          # ----------------------------------------------------------
          # Target
          # ----------------------------------------------------------

          cat >> .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640

          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_EFI_IMAGES=y
          EOF


          # ----------------------------------------------------------
          # IPv6
          # ----------------------------------------------------------

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_kmod-nft-nat6=y
          EOF


          # ----------------------------------------------------------
          # Bonding
          # ----------------------------------------------------------

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-bonding=y
          CONFIG_PACKAGE_proto-bonding=y
          CONFIG_PACKAGE_luci-proto-bonding=y
          EOF


          # ----------------------------------------------------------
          # LuCI
          # ----------------------------------------------------------

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-app-irqbalance=y
          CONFIG_PACKAGE_luci-app-package-manager=y

          CONFIG_PACKAGE_luci-app-filebrowser=n
          CONFIG_PACKAGE_luci-app-taskplan=n
          EOF


          # ----------------------------------------------------------
          # SQM / CAKE
          # ----------------------------------------------------------

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y
          EOF


          # ----------------------------------------------------------
          # IPTV
          # ----------------------------------------------------------

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-rtp2httpd=y
          EOF


          # ----------------------------------------------------------
          # Proxy
          # ----------------------------------------------------------

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-ssr-plus=n
          CONFIG_PACKAGE_luci-app-passwall=n
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-mihomo=n
          CONFIG_PACKAGE_luci-app-homeproxy=n
          EOF


          # ----------------------------------------------------------
          # DAED / eBPF / BTF
          #
          # Based on upstream luci-app-daed requirements.
          # ----------------------------------------------------------

          cat >> .config <<'EOF'
          CONFIG_DEVEL=y

          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_REDUCED=n
          CONFIG_KERNEL_DEBUG_INFO_BTF=y

          CONFIG_KERNEL_CGROUPS=y
          CONFIG_KERNEL_CGROUP_BPF=y
          CONFIG_KERNEL_BPF_EVENTS=y

          CONFIG_BPF_TOOLCHAIN_HOST=y
          CONFIG_KERNEL_XDP_SOCKETS=y

          CONFIG_PACKAGE_kmod-xdp-sockets-diag=y

          CONFIG_PACKAGE_daed=y
          CONFIG_PACKAGE_luci-app-daed=y

          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_ip-full=y
          EOF


          # ----------------------------------------------------------
          # VPN
          # ----------------------------------------------------------

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-softethervpn=n

          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_luci-app-openvpn-server=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y

          CONFIG_PACKAGE_netbird=n

          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          EOF


          # ----------------------------------------------------------
          # Lucky
          # ----------------------------------------------------------

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-lucky=y
          EOF


          # ----------------------------------------------------------
          # Argon
          # ----------------------------------------------------------

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-theme-argon=y
          EOF


          # ----------------------------------------------------------
          # Common packages
          # ----------------------------------------------------------

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y

          CONFIG_PACKAGE_vim-fuller=n
          CONFIG_PACKAGE_wget=y

          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y

          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_SOCAT_SSL=y

          CONFIG_SING_BOX_WITH_ECH=y
          CONFIG_PACKAGE_sing-box=y

          CONFIG_PACKAGE_chinadns-ng=y

          CONFIG_PACKAGE_open-vm-tools=y

          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_irqbalance=y
          EOF


          # ----------------------------------------------------------
          # Normalize config
          # ----------------------------------------------------------

          sed -i 's/^[ \t]*//g' ./.config

          make defconfig


          echo
          echo "============================================================"
          echo "DAED KERNEL DEPENDENCY CHECK"
          echo "============================================================"

          grep -E \
            'CONFIG_(DEVEL|DEBUG_INFO|DEBUG_INFO_BTF|DEBUG_INFO_BTF_MODULES|BPF|BPF_SYSCALL|KPROBES|KALLSYMS|CGROUPS|CGROUP_BPF|BPF_EVENTS|XDP_SOCKETS)' \
            .config || true

          echo "============================================================"


          echo
          echo "============================================================"
          echo "SELECTED THIRD-PARTY PACKAGES"
          echo "============================================================"

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall2|daed|luci-app-daed|luci-app-lucky|luci-app-rtp2httpd|luci-theme-argon)=' \
            .config || true

          echo "============================================================"


      # ============================================================
      # 13. Download source packages
      # ============================================================

      - name: Download sources
        working-directory: ./openwrt

        run: |
          set -e

          make download -j8


      # ============================================================
      # 14. Compile firmware
      #
      # First attempt:
      #   parallel build
      #
      # If failed:
      #   automatically run -j1 V=sc
      #
      # This avoids losing the real error inside huge logs.
      # ============================================================

      - name: Compile firmware
        working-directory: ./openwrt
        shell: bash

        run: |
          set -o pipefail

          echo "============================================================"
          echo "START PARALLEL BUILD"
          echo "============================================================"

          set +e

          make -j$(nproc) V=s 2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          set -e

          if [ "$BUILD_STATUS" -eq 0 ]; then
            echo
            echo "============================================================"
            echo "BUILD SUCCESS"
            echo "============================================================"
            exit 0
          fi

          echo
          echo "============================================================"
          echo "PARALLEL BUILD FAILED"
          echo "Running diagnostic single-threaded build..."
          echo "============================================================"

          echo
          echo "===== Last 200 lines from failed parallel build ====="
          tail -n 200 build.log || true

          echo
          echo "===== Error lines detected ====="
          grep -n -E \
            '(^|[[:space:]])(ERROR:|Error [0-9]+|error:|fatal error:|FAILED|failed to build|build failed)' \
            build.log \
            | tail -n 100 || true

          echo
          echo "============================================================"
          echo "SINGLE-THREADED DIAGNOSTIC BUILD"
          echo "============================================================"

          set +e

          make -j1 V=sc 2>&1 | tee build-debug.log

          DEBUG_STATUS=${PIPESTATUS[0]}

          set -e

          echo
          echo "===== Last 300 lines from diagnostic build ====="
          tail -n 300 build-debug.log || true

          echo
          echo "===== Diagnostic error lines ====="
          grep -n -E \
            '(^|[[:space:]])(ERROR:|Error [0-9]+|error:|fatal error:|FAILED|failed to build|build failed)' \
            build-debug.log \
            | tail -n 150 || true

          exit "$DEBUG_STATUS"


      # ============================================================
      # 15. Compress logs
      # ============================================================

      - name: Compress build logs
        if: always()
        working-directory: ./openwrt

        shell: bash

        run: |
          set +e

          if [ -f build.log ]; then
            gzip -9 -f build.log
          fi

          if [ -f build-debug.log ]; then
            gzip -9 -f build-debug.log
          fi


      # ============================================================
      # 16. Upload complete logs
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: openwrt-build-logs-${{ env.date }}
          path: |
            ./openwrt/build.log.gz
            ./openwrt/build-debug.log.gz
          if-no-files-found: warn
          retention-days: 14


      # ============================================================
      # 17. Get kernel version
      # ============================================================

      - name: Get kernel version
        if: success()
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          KERNEL_MAKEFILE=$(find build_dir \
            -path '*/linux-x86_64/linux-*/Makefile' \
            -type f \
            | head -1)

          if [ -z "$KERNEL_MAKEFILE" ]; then
            echo "ERROR: Linux kernel Makefile not found."
            exit 1
          fi

          KERNEL_DIR=$(dirname "$KERNEL_MAKEFILE")

          VERSION=$(grep '^VERSION = ' "$KERNEL_MAKEFILE" | awk '{print $3}')
          PATCHLEVEL=$(grep '^PATCHLEVEL = ' "$KERNEL_MAKEFILE" | awk '{print $3}')
          SUBLEVEL=$(grep '^SUBLEVEL = ' "$KERNEL_MAKEFILE" | awk '{print $3}')

          KERNEL_VERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"

          echo "Kernel source:"
          echo "$KERNEL_DIR"

          echo "Kernel version:"
          echo "$KERNEL_VERSION"

          echo "KERNEL_VERSION=$KERNEL_VERSION" >> "$GITHUB_ENV"


      # ============================================================
      # 18. Prepare artifact
      # ============================================================

      - name: Prepare artifact
        if: success()
        working-directory: ./openwrt

        run: |
          set -e

          mkdir -p artifact/firmware
          mkdir -p artifact/package
          mkdir -p artifact/buildinfo

          find ./bin/targets/ \
            -type f \
            -name "openwrt-x86-64-generic-kernel.bin" \
            -delete

          find ./bin/targets/ \
            -type f \
            -name "openwrt-x86-64-generic-squashfs-rootfs.img.gz" \
            -delete

          find ./bin/targets/ \
            -type d \
            -name "packages" \
            -prune \
            -exec rm -rf {} +

          find ./bin/targets/ \
            -type f \
            -name "*combined-efi.img.gz" \
            -exec cp -f {} artifact/firmware/ \;

          find ./bin/packages/ \
            -type f \
            -name "*.ipk" \
            -exec cp -f {} artifact/package/ \;

          find ./bin/targets/ \
            -type f \
            \( -name "*.buildinfo" -o -name "*.manifest" \) \
            -exec cp -f {} artifact/buildinfo/ \;


      # ============================================================
      # 19. Deliver buildinfo
      # ============================================================

      - name: Deliver buildinfo
        if: success()
        uses: actions/upload-artifact@v4

        with:
          name: ${{ env.date }}.ImmortalWRT.x86.buildinfo.25.12
          path: ./openwrt/artifact/buildinfo/
          retention-days: 30


      # ============================================================
      # 20. Deliver packages
      # ============================================================

      - name: Deliver packages
        if: success()
        uses: actions/upload-artifact@v4

        with:
          name: ${{ env.date }}.ImmortalWRT.x86.package.25.12
          path: ./openwrt/artifact/package/
          retention-days: 30


      # ============================================================
      # 21. Deliver firmware
      # ============================================================

      - name: Deliver firmware
        if: success()
        uses: actions/upload-artifact@v4

        with:
          name: ${{ env.date }}.ImmortalWRT.x86.firmware.25.12
          path: ./openwrt/artifact/firmware/
          retention-days: 30


      # ============================================================
      # 22. Create GitHub Release
      # ============================================================

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2

        with:
          tag_name: OpenWrt-${{ env.date }}

          name: OpenWrt 25.12 x86_64 - ${{ env.date }}

          body: |
            ## ImmortalWrt 25.12 x86_64

            **固件内核：** ${{ env.KERNEL_VERSION }}

            **编译时间：** ${{ env.date }}（北京时间）

            **目标平台：** x86_64 Generic

            **固件格式：** EFI

            **主要组件：**
            - OpenClash
            - PassWall2
            - DAED
            - SQM / CAKE
            - WireGuard
            - OpenVPN
            - Lucky
            - RTP2HTTPD
            - Argon Theme


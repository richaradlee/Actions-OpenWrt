name: ImmortalWrt x86
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write
      actions: write

    name: ImmortalWrt Build
    steps:
      # 1. Maximize build space
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 2. Checkout workflow repository
      - name: Checkout
        uses: actions/checkout@v4

      # 3. Install build dependencies
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Asia/Shanghai
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /etc/mysql /etc/php || true
          sudo -E apt-get update
          sudo -E apt-get install -y ack asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gettext git gperf help2man intltool libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm make ninja-build patch pkgconf python3 python3-pyelftools python3-setuptools rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev scdoc
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      # 4. Clone ImmortalWrt 25.12
      - name: Clone ImmortalWrt source
        env:
          REPO_URL: https://github.com/immortalwrt/immortalwrt
          REPO_BRANCH: openwrt-25.12
        run: |
          set -e
          git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
          cd openwrt
          echo "============================================================"
          echo "IMMORTALWRT SOURCE"
          echo "============================================================"
          git branch --show-current
          git log -1 --format='commit: %H'
          git log -1 --format='subject: %s'
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # 5. Configure feeds
      - name: Configure upstream feeds
        working-directory: ./openwrt
        run: |
          set -e
          sed -i '1i src-git rtp2httpd https://github.com/stackia/rtp2httpd.git' feeds.conf.default
          cat feeds.conf.default

      # 6. Update and install official feeds
      - name: Update and install official feeds
        working-directory: ./openwrt
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 7. Install third-party packages
      - name: Install third-party packages
        working-directory: ./openwrt
        run: |
          set -e

          rm -rf package/feeds/luci/luci-app-openclash package/openclash
          git clone --depth 1 https://github.com/vernesong/OpenClash.git package/openclash

          rm -rf package/feeds/luci/luci-app-passwall2 package/passwall2
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git package/passwall2

          rm -rf package/dae package/feeds/base/dae
          git clone --depth 1 https://github.com/QiuSimons/luci-app-daed.git package/dae

          rm -rf package/feeds/lucky/luci-app-lucky package/lucky
          git clone --depth 1 https://github.com/gdy666/luci-app-lucky.git package/lucky

          rm -rf package/feeds/luci/luci-theme-argon package/feeds/luci/luci-app-argon-config package/argon package/argon-config
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/argon
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git package/argon-config

      # 8. Verify third-party sources
      - name: Verify third-party package sources
        working-directory: ./openwrt
        run: |
          set -e

          check_makefile() {
            NAME="$1"
            PATH_TO_MAKEFILE="$2"
            echo ">>> Checking $NAME"
            echo "Path: $PATH_TO_MAKEFILE"
            test -f "$PATH_TO_MAKEFILE" || {
              echo "ERROR: Makefile not found."
              exit 1
            }
            echo "OK: Makefile exists."
          }

          check_makefile "OpenClash" package/openclash/luci-app-openclash/Makefile
          check_makefile "PassWall2" package/passwall2/luci-app-passwall2/Makefile
          check_makefile "DAED" package/dae/luci-app-daed/Makefile
          check_makefile "Lucky" package/lucky/luci-app-lucky/Makefile
          check_makefile "Argon" package/argon/Makefile
          check_makefile "Argon Config" package/argon-config/Makefile

          echo "============================================================"
          echo "ARGON SOURCE"
          echo "============================================================"
          git -C package/argon log -1 --format='commit: %H'
          git -C package/argon log -1 --format='subject: %s'
          git -C package/argon describe --tags --always || true

          echo "============================================================"
          echo "THIRD-PARTY SOURCE CHECK PASSED"
          echo "============================================================"

      # 9. Generate V3 configuration
      - name: Generate V3 configuration
        working-directory: ./openwrt
        run: |
          set -e
          rm -f .config .config.old
          touch .config

          cat >> .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y
          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_EFI_IMAGES=y

          CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_kmod-nft-nat6=y

          CONFIG_PACKAGE_kmod-bonding=y
          CONFIG_PACKAGE_proto-bonding=y
          CONFIG_PACKAGE_luci-proto-bonding=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-app-irqbalance=y
          CONFIG_PACKAGE_luci-app-package-manager=y

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y

          CONFIG_PACKAGE_luci-app-rtp2httpd=y

          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-openclash=y

          CONFIG_DEVEL=y
          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_CGROUPS=y
          CONFIG_KERNEL_CGROUP_BPF=y
          CONFIG_KERNEL_BPF_EVENTS=y
          CONFIG_BPF_TOOLCHAIN_HOST=y
          CONFIG_KERNEL_XDP_SOCKETS=y
          CONFIG_PACKAGE_kmod-xdp-sockets-diag=y

          CONFIG_PACKAGE_daed=y
          CONFIG_PACKAGE_luci-app-daed=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_ip-full=y

          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y

          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y

          CONFIG_PACKAGE_luci-app-lucky=y

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y
          CONFIG_PACKAGE_luci-i18n-vlmcsd-zh-cn=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_wget=y

          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_SOCAT_SSL=y

          CONFIG_SING_BOX_WITH_ECH=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_chinadns-ng=y

          CONFIG_PACKAGE_open-vm-tools=y

          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y

          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_irqbalance=y
          EOF

          cp .config .config.requested

      # 10. Run make defconfig
      - name: Run make defconfig
        working-directory: ./openwrt
        run: |
          set -o pipefail
          make defconfig 2>&1 | tee defconfig.log

      # 11. Restore build caches
      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            ./openwrt/dl
            ./openwrt/build_dir
            ./openwrt/staging_dir
            ~/.ccache
          key: ${{ runner.os }}-immortalwrt-v3-${{ env.SOURCE_COMMIT }}-${{ hashFiles('openwrt/.config') }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-v3-${{ env.SOURCE_COMMIT }}-
            ${{ runner.os }}-immortalwrt-v3-

      # 12. Verify configuration and package definitions
      - name: Verify configuration
        working-directory: ./openwrt
        run: |
          set -e
          FAILED=0

          check_y() {
            SYMBOL="$1"
            VALUE="$(grep "^${SYMBOL}=" .config 2>/dev/null | cut -d= -f2 || true)"
            echo "$SYMBOL = ${VALUE:-<NOT SET>}"
            [ "$VALUE" = y ] || {
              echo "ERROR: $SYMBOL is not enabled."
              FAILED=1
            }
          }

          check_not_y() {
            SYMBOL="$1"
            VALUE="$(grep "^${SYMBOL}=" .config 2>/dev/null | cut -d= -f2 || true)"
            echo "$SYMBOL = ${VALUE:-<NOT SET>}"
            [ "$VALUE" != y ] || {
              echo "ERROR: $SYMBOL unexpectedly enabled."
              FAILED=1
            }
          }

          echo "===== Required ====="

          for P in \
            luci \
            luci-app-openclash \
            luci-app-passwall2 \
            daed \
            luci-app-daed \
            luci-app-lucky \
            luci-app-rtp2httpd \
            luci-theme-argon \
            luci-app-argon-config \
            luci-app-upnp \
            miniupnpd-nftables \
            luci-i18n-upnp-zh-cn \
            vlmcsd \
            luci-app-vlmcsd \
            luci-i18n-vlmcsd-zh-cn \
            luci-app-sqm \
            sqm-scripts \
            kmod-sched-cake \
            kmod-ifb \
            tc-full \
            sing-box \
            chinadns-ng \
            open-vm-tools \
            iperf3 \
            tcpdump \
            haproxy \
            socat \
            luci-app-openvpn \
            openvpn-easy-rsa \
            kmod-wireguard \
            wireguard-tools \
            luci-proto-wireguard
          do
            check_y CONFIG_PACKAGE_$P
          done

          echo
          echo "===== Disabled ====="

          for P in \
            luci-app-openvpn-server
          do
            check_not_y CONFIG_PACKAGE_$P
          done

          if grep -q "Not overriding core package 'luci-app-openclash'" defconfig.log; then
            echo "ERROR: OpenClash override warning."
            exit 1
          fi

          if grep -q "package/argon-config/Makefile.*depends on 'luci-theme-argon', which does not exist" defconfig.log; then
            echo "ERROR: Argon dependency warning."
            exit 1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "FINAL CONFIGURATION VERIFICATION FAILED"
            echo "============================================================"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "FINAL CONFIGURATION VERIFICATION PASSED"
          echo "============================================================"

      # 13. Audit important components
      - name: Audit important components
        working-directory: ./openwrt
        run: |
          set -e

          echo "===== ImmortalWrt ====="
          git log -1 --format='commit: %H'
          git log -1 --format='subject: %s'

          echo
          echo "===== Argon ====="
          git -C package/argon log -1 --format='commit: %H'
          git -C package/argon log -1 --format='subject: %s'
          git -C package/argon describe --tags --always || true

          echo
          echo "===== UPnP / PCP / NAT-PMP ====="
          grep -E '^CONFIG_PACKAGE_(luci-app-upnp|miniupnpd-nftables|luci-i18n-upnp-zh-cn)=' .config || true
          echo "miniupnpd provides UPnP IGD, NAT-PMP and PCP support."

          echo
          echo "===== Vlmcsd ====="
          grep -E '^CONFIG_PACKAGE_(vlmcsd|luci-app-vlmcsd|luci-i18n-vlmcsd-zh-cn)=' .config || true

          echo
          echo "===== OpenVPN ====="
          grep -E '^CONFIG_PACKAGE_(luci-app-openvpn|openvpn-easy-rsa|luci-app-openvpn-server)=' .config || true

          echo
          echo "===== WireGuard ====="
          grep -E '^CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-proto-wireguard)=' .config || true

          echo
          echo "===== DAED / BTF ====="
          grep -E '^CONFIG_(DEVEL|KERNEL_DEBUG_INFO|KERNEL_DEBUG_INFO_BTF|KERNEL_CGROUPS|KERNEL_CGROUP_BPF|KERNEL_BPF_EVENTS|BPF_TOOLCHAIN_HOST|KERNEL_XDP_SOCKETS)=' .config || true

          echo
          echo "===== Dependency warnings ====="
          grep -n -E 'WARNING:|depends on|dependency|not found|unknown symbol|invalid' defconfig.log || true

      # 14. Build firmware
      - name: Build ImmortalWrt
        working-directory: ./openwrt
        env:
          TZ: Asia/Shanghai
        run: |
          set -e
          export FORCE_UNSAFE_CONFIGURE=1
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE=5G
          ccache -M 5G || true
          ccache -s || true
          make -j"$(nproc)" download
          make -j"$(nproc)" world V=s
          ccache -s || true

      # 15. Collect EFI image and checksums
      - name: Collect release files
        working-directory: ./openwrt
        run: |
          set -e
          mkdir -p release
          DATE="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)"
          SRC="$(find bin/targets/x86/64 -maxdepth 1 -type f -name '*combined-efi.img.gz' | head -1)"
          [ -n "$SRC" ] || {
            echo "ERROR: EFI image not found."
            find bin/targets/x86/64 -maxdepth 1 -type f -print
            exit 1
          }
          FILE="ImmortalWrt-x86-64-Generic-${DATE}.img.gz"
          cp "$SRC" "release/$FILE"
          sha256sum "release/$FILE" > release/SHA256SUMS.txt
          echo "RELEASE_TAG=immortalwrt-v3-$DATE" >> "$GITHUB_ENV"
          echo "RELEASE_FILE=$FILE" >> "$GITHUB_ENV"
          ls -lh release/

      # 16. Upload firmware artifact
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-x86-64-${{ github.run_number }}
          path: |
            ./openwrt/release/*.img.gz
            ./openwrt/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      # 17. Upload diagnostics
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-diagnostics-${{ github.run_number }}
          path: |
            ./openwrt/.config
            ./openwrt/.config.requested
            ./openwrt/defconfig.log
          if-no-files-found: warn
          retention-days: 14

      # 18. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ImmortalWrt ${{ env.RELEASE_TAG }}
          body: |
            ## ImmortalWrt - 25.12 x86_64

            **固件内核：** 6.12.x
            **目标平台：** x86_64 Generic
            **固件格式：** EFI
            **固件文件：** `${{ env.RELEASE_FILE }}`

            ### 主要组件
            - OpenClash
            - PassWall2
            - DAED
            - Lucky
            - RTP2HTTPD
            - Argon Theme
            - SQM / CAKE
            - WireGuard
            - OpenVPN
            - UPnP IGD
            - NAT-PMP / PCP
            - Vlmcsd KMS

            ### 源码
            - ImmortalWrt openwrt-25.12
            - Argon official repository latest
            - OpenClash official repository
            - PassWall2 official repository
            - DAED official repository
            - Lucky official repository

            > 本 Release 为 GitHub Actions 自动编译发布。
          files: |
            ./openwrt/release/${{ env.RELEASE_FILE }}
            ./openwrt/release/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 19. Delete old workflow runs
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 20
          keep_minimum_runs: 3

      # 20. Final summary
      - name: Final summary
        if: always()
        working-directory: ./openwrt
        run: |
          echo "################################################################"
          echo "# IMMORTALWRT COMPLETED"
          echo "################################################################"
          git log -1 --format='commit: %H'
          git log -1 --format='subject: %s'
          echo "Argon commit: $(git -C package/argon rev-parse HEAD 2>/dev/null || echo unknown)"
          echo "Argon version: $(git -C package/argon describe --tags --always 2>/dev/null || echo unknown)"
          echo "ImmortalWrt commit: ${SOURCE_COMMIT:-unknown}"
          echo "Release: ${RELEASE_TAG:-not-created}"
          echo "Image: ${RELEASE_FILE:-not-created}"
          echo "################################################################"

name: ImmortalWrt V3 Test 03

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    if: github.event.repository.owner.id == github.event.sender.id

    permissions:
      contents: read

    name: Source Conflict Validation ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        target: [25.12]

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Maximize build space
      # ============================================================

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'


      # ============================================================
      # 3. Install build dependencies
      # ============================================================

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Asia/Shanghai

        run: |
          set -e

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /etc/mysql \
            /etc/php || true

          sudo -E apt-get update

          sudo -E apt-get install -y \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gettext \
            git \
            gperf \
            help2man \
            intltool \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            make \
            ninja-build \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            scdoc

          sudo -E timedatectl set-timezone "Asia/Shanghai"


      # ============================================================
      # 4. Clone ImmortalWrt
      # ============================================================

      - name: Clone ImmortalWrt source
        env:
          REPO_URL: https://github.com/immortalwrt/immortalwrt
          REPO_BRANCH: openwrt-25.12

        run: |
          set -e

          git clone \
            --depth 1 \
            "$REPO_URL" \
            -b "$REPO_BRANCH" \
            openwrt

          cd openwrt

          echo
          echo "============================================================"
          echo "IMMORTALWRT SOURCE"
          echo "============================================================"

          git branch --show-current
          git log -1 --format='commit: %H'
          git log -1 --format='subject: %s'

          echo
          echo "============================================================"


      # ============================================================
      # 5. Configure feeds
      # ============================================================

      - name: Configure upstream feeds
        working-directory: ./openwrt

        run: |
          set -e

          sed -i \
            '1i src-git rtp2httpd https://github.com/stackia/rtp2httpd.git' \
            feeds.conf.default

          echo
          echo "============================================================"
          echo "FEEDS.CONF.DEFAULT"
          echo "============================================================"

          cat feeds.conf.default

          echo
          echo "============================================================"


      # ============================================================
      # 6. Update official feeds
      # ============================================================

      - name: Update feeds
        working-directory: ./openwrt

        run: |
          set -e

          echo "============================================================"
          echo "UPDATE OFFICIAL FEEDS"
          echo "============================================================"

          ./scripts/feeds update -a

          echo
          echo "============================================================"
          echo "INSTALL OFFICIAL FEED PACKAGES"
          echo "============================================================"

          ./scripts/feeds install -a


      # ============================================================
      # 7. Remove conflicting official packages
      #
      # IMPORTANT:
      #
      # These packages will be supplied directly from upstream
      # repositories later.
      #
      # We remove their official feed copies before installing
      # upstream sources.
      # ============================================================

      - name: Remove conflicting official packages
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "REMOVE OFFICIAL PACKAGE CONFLICTS"
          echo "============================================================"

          echo
          echo "===== OpenClash ====="

          rm -rf package/feeds/luci/luci-app-openclash
          rm -rf package/feeds/luci/openclash

          echo
          echo "===== PassWall2 ====="

          rm -rf package/feeds/luci/luci-app-passwall2
          rm -rf package/feeds/luci/passwall2

          echo
          echo "===== DAED ====="

          rm -rf package/feeds/base/dae
          rm -rf package/feeds/luci/luci-app-daed

          echo
          echo "===== Lucky ====="

          rm -rf package/feeds/lucky/lucky
          rm -rf package/feeds/lucky/luci-app-lucky

          echo
          echo "===== Argon ====="

          rm -rf package/feeds/luci/luci-theme-argon
          rm -rf package/feeds/luci/luci-app-argon-config

          echo
          echo "============================================================"
          echo "OFFICIAL CONFLICTING PACKAGES REMOVED"
          echo "============================================================"


      # ============================================================
      # 8. Install upstream packages
      # ============================================================

      - name: Install upstream packages
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "INSTALL UPSTREAM PACKAGES"
          echo "============================================================"


          # ----------------------------------------------------------
          # OpenClash
          # ----------------------------------------------------------

          echo
          echo "===== OpenClash ====="

          rm -rf package/openclash

          git clone \
            --depth 1 \
            https://github.com/vernesong/OpenClash.git \
            package/openclash


          # ----------------------------------------------------------
          # PassWall2
          # ----------------------------------------------------------

          echo
          echo "===== PassWall2 ====="

          rm -rf package/passwall2

          git clone \
            --depth 1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall2.git \
            package/passwall2


          # ----------------------------------------------------------
          # DAED
          # ----------------------------------------------------------

          echo
          echo "===== DAED ====="

          rm -rf package/dae

          git clone \
            --depth 1 \
            https://github.com/QiuSimons/luci-app-daed.git \
            package/dae


          # ----------------------------------------------------------
          # Lucky
          # ----------------------------------------------------------

          echo
          echo "===== Lucky ====="

          rm -rf package/lucky

          git clone \
            --depth 1 \
            https://github.com/gdy666/luci-app-lucky.git \
            package/lucky


          # ----------------------------------------------------------
          # Argon Theme
          # ----------------------------------------------------------

          echo
          echo "===== Argon Theme ====="

          rm -rf package/argon

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/argon


          # ----------------------------------------------------------
          # Argon Config
          # ----------------------------------------------------------

          echo
          echo "===== Argon Config ====="

          rm -rf package/argon-config

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/argon-config


          echo
          echo "============================================================"
          echo "UPSTREAM PACKAGE CLONING COMPLETED"
          echo "============================================================"


      # ============================================================
      # 9. DO NOT run feeds install -a again
      #
      # This is intentional.
      #
      # Running feeds install -a here would re-introduce official
      # packages and recreate the OpenClash override warning.
      # ============================================================

      - name: Verify package tree before configuration
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "PACKAGE TREE VERIFICATION"
          echo "============================================================"


          check_path() {
            PATH_TO_CHECK="$1"

            if [ -e "$PATH_TO_CHECK" ]; then
              echo "OK: $PATH_TO_CHECK"
            else
              echo "ERROR: missing $PATH_TO_CHECK"
              exit 1
            fi
          }


          echo
          echo "===== Upstream package paths ====="

          check_path package/openclash/luci-app-openclash
          check_path package/passwall2/luci-app-passwall2
          check_path package/dae/luci-app-daed
          check_path package/lucky/luci-app-lucky
          check_path package/argon
          check_path package/argon-config


          echo
          echo "===== Official conflicting paths ====="

          for path in \
            package/feeds/luci/luci-app-openclash \
            package/feeds/luci/luci-app-passwall2 \
            package/feeds/base/dae \
            package/feeds/luci/luci-app-daed \
            package/feeds/lucky/lucky \
            package/feeds/luci/luci-theme-argon \
            package/feeds/luci/luci-app-argon-config

          do
            if [ -e "$path" ]; then
              echo "ERROR: conflicting official package still exists:"
              echo "       $path"
              exit 1
            else
              echo "OK: absent $path"
            fi
          done


          echo
          echo "============================================================"
          echo "PACKAGE TREE VERIFICATION PASSED"
          echo "============================================================"


      # ============================================================
      # 10. Package Makefile audit
      # ============================================================

      - name: Audit package Makefiles
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "PACKAGE MAKEFILE AUDIT"
          echo "============================================================"


          audit_makefile() {
            NAME="$1"
            FILE="$2"

            echo
            echo "############################################################"
            echo ">>> $NAME"
            echo "Path: $FILE"
            echo "############################################################"

            if [ ! -f "$FILE" ]; then
              echo "ERROR: Makefile not found."
              exit 1
            fi

            echo
            echo "--- Makefile header ---"

            sed -n '1,80p' "$FILE"

            echo
            echo "--- Package definitions ---"

            grep -n \
              -E \
              'define Package/|PKG_NAME|PKG_VERSION|PKG_RELEASE' \
              "$FILE" \
              | head -50 \
              || true

            echo
            echo "--- Dependencies ---"

            grep -n \
              -E \
              'DEPENDS[+:]?=|LUCI_DEPENDS[+:]?=' \
              "$FILE" \
              || true
          }


          audit_makefile \
            "OpenClash" \
            package/openclash/luci-app-openclash/Makefile

          audit_makefile \
            "PassWall2" \
            package/passwall2/luci-app-passwall2/Makefile

          audit_makefile \
            "DAED" \
            package/dae/luci-app-daed/Makefile

          audit_makefile \
            "Lucky" \
            package/lucky/luci-app-lucky/Makefile

          audit_makefile \
            "Argon Theme" \
            package/argon/Makefile

          audit_makefile \
            "Argon Config" \
            package/argon-config/Makefile


      # ============================================================
      # 11. Argon dependency verification
      #
      # Explicitly verify that Argon Theme is visible to the
      # package metadata system.
      # ============================================================

      - name: Verify Argon dependency
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "ARGON DEPENDENCY VERIFICATION"
          echo "============================================================"

          echo
          echo "===== Argon Theme Makefile ====="

          if [ ! -f package/argon/Makefile ]; then
            echo "ERROR: Argon Theme Makefile missing."
            exit 1
          fi

          grep -n \
            -E \
            'PKG_NAME|define Package/|LUCI_DEPENDS|DEPENDS' \
            package/argon/Makefile \
            || true


          echo
          echo "===== Argon Config dependency ====="

          if [ ! -f package/argon-config/Makefile ]; then
            echo "ERROR: Argon Config Makefile missing."
            exit 1
          fi

          grep -n \
            -E \
            'PKG_NAME|define Package/|LUCI_DEPENDS|DEPENDS' \
            package/argon-config/Makefile \
            || true


          echo
          echo "===== Search Argon package definitions ====="

          grep -R \
            -n \
            --include='Makefile' \
            -E \
            'luci-theme-argon|luci-app-argon-config' \
            package/argon \
            package/argon-config \
            2>/dev/null \
            || true


          echo
          echo "===== Official Argon package search ====="

          if grep -R \
            -n \
            --include='Makefile' \
            'luci-theme-argon' \
            package/feeds/luci \
            2>/dev/null \
            | head -20
          then
            echo
            echo "ERROR: Official Argon package still found."
            exit 1
          else
            echo "OK: No official Argon package found."
          fi


          echo
          echo "============================================================"
          echo "ARGON DEPENDENCY VERIFICATION PASSED"
          echo "============================================================"


      # ============================================================
      # 12. OpenClash source conflict verification
      # ============================================================

      - name: Verify OpenClash source
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "OPENCLASH SOURCE VERIFICATION"
          echo "============================================================"


          echo
          echo "===== Upstream OpenClash repository ====="

          if [ ! -d package/openclash/.git ]; then
            echo "ERROR: OpenClash upstream Git repository missing."
            exit 1
          fi

          git -C package/openclash log -1 \
            --format='commit: %H%nsubject: %s'


          echo
          echo "===== OpenClash Makefile ====="

          if [ ! -f package/openclash/luci-app-openclash/Makefile ]; then
            echo "ERROR: OpenClash Makefile missing."
            exit 1
          fi

          grep -n \
            -E \
            'PKG_NAME|PKG_VERSION|PKG_RELEASE|define Package/' \
            package/openclash/luci-app-openclash/Makefile \
            | head -50 \
            || true


          echo
          echo "===== Search all OpenClash package definitions ====="

          grep -R \
            -n \
            --include='Makefile' \
            -E \
            'luci-app-openclash|PKG_NAME.*openclash' \
            package \
            2>/dev/null \
            | head -100 \
            || true


          echo
          echo "===== Check official feed ====="

          if [ -e package/feeds/luci/luci-app-openclash ]; then
            echo "ERROR: Official OpenClash package still exists."
            exit 1
          else
            echo "OK: Official OpenClash package absent."
          fi


          echo
          echo "============================================================"
          echo "OPENCLASH SOURCE VERIFICATION PASSED"
          echo "============================================================"


      # ============================================================
      # 13. Detect duplicate package names
      #
      # This is a general source conflict check.
      # ============================================================

      - name: Detect duplicate package definitions
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "DUPLICATE PACKAGE DEFINITION CHECK"
          echo "============================================================"

          TMP_FILE=$(mktemp)

          find package feeds \
            -type f \
            -name Makefile \
            -print0 \
            2>/dev/null \
            | while IFS= read -r -d '' file
            do
              awk '
                /define Package\// {
                  line=$0
                  sub(/^.*define Package\//, "", line)
                  sub(/[[:space:]].*$/, "", line)
                  if (line != "") {
                    print line "|" FILENAME
                  }
                }
              ' "$file"
            done \
            > "$TMP_FILE"


          echo
          echo "===== Target packages ====="

          for pkg in \
            luci-app-openclash \
            luci-app-passwall2 \
            daed \
            luci-app-daed \
            lucky \
            luci-app-lucky \
            luci-theme-argon \
            luci-app-argon-config

          do
            echo
            echo ">>> $pkg"

            grep "^${pkg}|" "$TMP_FILE" \
              || echo "NOT FOUND"
          done


          echo
          echo "============================================================"
          echo "DUPLICATE CHECK COMPLETED"
          echo "============================================================"

          rm -f "$TMP_FILE"


      # ============================================================
      # 14. Generate minimal configuration
      #
      # We do NOT build.
      #
      # This verifies that the package metadata can be consumed
      # by OpenWrt's configuration system.
      # ============================================================

      - name: Generate minimal configuration
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "GENERATE MINIMAL CONFIGURATION"
          echo "============================================================"

          rm -f .config .config.old

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y

          CONFIG_EFI_IMAGES=y

          CONFIG_PACKAGE_luci=y

          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-passwall2=y

          CONFIG_PACKAGE_daed=y
          CONFIG_PACKAGE_luci-app-daed=y

          CONFIG_PACKAGE_luci-app-lucky=y

          CONFIG_PACKAGE_luci-app-rtp2httpd=y

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-app-wireguard=y

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y

          CONFIG_PACKAGE_luci-app-ssr-plus=n
          CONFIG_PACKAGE_luci-app-passwall=n
          CONFIG_PACKAGE_luci-app-mihomo=n
          CONFIG_PACKAGE_luci-app-homeproxy=n
          CONFIG_PACKAGE_netbird=n
          EOF


          echo
          echo "===== Requested minimal configuration ====="

          cat .config


      # ============================================================
      # 15. Run defconfig
      # ============================================================

      - name: Run minimal defconfig
        working-directory: ./openwrt

        shell: bash

        run: |
          set -o pipefail

          echo "============================================================"
          echo "RUN MINIMAL MAKE DECONFIG"
          echo "============================================================"

          make defconfig 2>&1 | tee defconfig.log

          echo
          echo "============================================================"
          echo "MINIMAL DEFCONFIG COMPLETED"
          echo "============================================================"


      # ============================================================
      # 16. Check defconfig warnings
      # ============================================================

      - name: Check defconfig warnings
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "CHECK DEFCONFIG WARNINGS"
          echo "============================================================"

          if [ ! -f defconfig.log ]; then
            echo "ERROR: defconfig.log not found."
            exit 1
          fi


          echo
          echo "===== Warning / dependency messages ====="

          grep -n -E \
            'WARNING:|warning:|depends on|dependency|not found|unknown symbol|invalid|Not overriding' \
            defconfig.log \
            || true


          echo
          echo "===== OpenClash override check ====="

          if grep -q \
            'Not overriding core package.*luci-app-openclash' \
            defconfig.log
          then
            echo "ERROR: OpenClash override warning detected."
            exit 1
          else
            echo "OK: No OpenClash override warning."
          fi


          echo
          echo "===== Argon dependency warning check ====="

          if grep -q \
            "dependency on 'luci-theme-argon', which does not exist" \
            defconfig.log
          then
            echo "ERROR: Argon dependency warning detected."
            exit 1
          else
            echo "OK: No Argon dependency warning."
          fi


          echo
          echo "============================================================"
          echo "DEFCONFIG WARNING CHECK PASSED"
          echo "============================================================"


      # ============================================================
      # 17. Verify final package selections
      # ============================================================

      - name: Verify final package selections
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "VERIFY FINAL PACKAGE SELECTIONS"
          echo "============================================================"

          FAILED=0


          check_y() {
            SYMBOL="$1"

            VALUE=$(grep "^${SYMBOL}=" .config 2>/dev/null \
              | cut -d= -f2 || true)

            echo "$SYMBOL = ${VALUE:-<NOT SET>}"

            if [ "$VALUE" != "y" ]; then
              echo "ERROR: $SYMBOL is not enabled."
              FAILED=1
            fi
          }


          check_n() {
            SYMBOL="$1"

            VALUE=$(grep "^${SYMBOL}=" .config 2>/dev/null \
              | cut -d= -f2 || true)

            echo "$SYMBOL = ${VALUE:-<NOT SET>}"

            if [ "$VALUE" != "n" ]; then
              echo "ERROR: $SYMBOL is not disabled."
              FAILED=1
            fi
          }


          echo
          echo "===== Required packages ====="

          check_y CONFIG_PACKAGE_luci
          check_y CONFIG_PACKAGE_luci-app-openclash
          check_y CONFIG_PACKAGE_luci-app-passwall2
          check_y CONFIG_PACKAGE_daed
          check_y CONFIG_PACKAGE_luci-app-daed
          check_y CONFIG_PACKAGE_luci-app-lucky
          check_y CONFIG_PACKAGE_luci-app-rtp2httpd
          check_y CONFIG_PACKAGE_luci-theme-argon
          check_y CONFIG_PACKAGE_luci-app-argon-config


          echo
          echo "===== WireGuard ====="

          check_y CONFIG_PACKAGE_kmod-wireguard
          check_y CONFIG_PACKAGE_wireguard-tools
          check_y CONFIG_PACKAGE_luci-app-wireguard


          echo
          echo "===== SQM ====="

          check_y CONFIG_PACKAGE_luci-app-sqm
          check_y CONFIG_PACKAGE_sqm-scripts
          check_y CONFIG_PACKAGE_kmod-sched-cake
          check_y CONFIG_PACKAGE_kmod-ifb
          check_y CONFIG_PACKAGE_tc-full


          echo
          echo "===== Disabled proxy frontends ====="

          check_n CONFIG_PACKAGE_luci-app-ssr-plus
          check_n CONFIG_PACKAGE_luci-app-passwall
          check_n CONFIG_PACKAGE_luci-app-mihomo
          check_n CONFIG_PACKAGE_luci-app-homeproxy
          check_n CONFIG_PACKAGE_netbird


          echo
          echo "===== Final result ====="

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "FINAL PACKAGE VERIFICATION FAILED"
            echo "============================================================"
            exit 1
          fi


          echo
          echo "============================================================"
          echo "FINAL PACKAGE VERIFICATION PASSED"
          echo "============================================================"


      # ============================================================
      # 18. Source audit
      # ============================================================

      - name: Final source audit
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo
          echo "################################################################"
          echo "# IMMORTALWRT V3 TEST 03 SOURCE AUDIT"
          echo "################################################################"


          audit_git() {
            NAME="$1"
            DIR="$2"

            echo
            echo "============================================================"
            echo "$NAME"
            echo "============================================================"

            if [ -d "$DIR/.git" ]; then
              git -C "$DIR" log -1 \
                --format='commit: %H%nsubject: %s'
            else
              echo "Git repository metadata not found."
            fi
          }


          audit_git "OpenClash" package/openclash
          audit_git "PassWall2" package/passwall2
          audit_git "DAED" package/dae
          audit_git "Lucky" package/lucky
          audit_git "Argon Theme" package/argon
          audit_git "Argon Config" package/argon-config
          audit_git "RTP2HTTPD" feeds/rtp2httpd


          echo
          echo "============================================================"
          echo "PACKAGE LOCATIONS"
          echo "============================================================"

          for pkg in \
            luci-app-openclash \
            luci-app-passwall2 \
            luci-app-daed \
            luci-app-lucky \
            luci-theme-argon \
            luci-app-argon-config

          do
            echo
            echo ">>> $pkg"

            find package feeds \
              -type f \
              -name Makefile \
              -print \
              2>/dev/null \
              | while read -r file
              do
                if grep -q \
                  "define Package/${pkg}" \
                  "$file" 2>/dev/null
                then
                  echo "$file"
                fi
              done
          done


          echo
          echo "################################################################"
          echo "# TEST 03 SOURCE AUDIT COMPLETED"
          echo "################################################################"


      # ============================================================
      # 19. Upload diagnostics
      # ============================================================

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: immortalwrt-v3-test03-source-${{ github.run_number }}

          path: |
            ./openwrt/.config
            ./openwrt/defconfig.log

          if-no-files-found: warn

          retention-days: 14


      # ============================================================
      # 20. Final summary
      # ============================================================

      - name: Final summary
        working-directory: ./openwrt

        run: |
          set -e

          echo
          echo "################################################################"
          echo "# IMMORTALWRT V3 TEST 03 FINAL SUMMARY"
          echo "################################################################"

          echo
          echo "===== ImmortalWrt ====="

          git log -1 --format='commit: %H'
          git log -1 --format='subject: %s'


          echo
          echo "===== Upstream packages ====="

          echo "OpenClash:"
          git -C package/openclash log -1 --format='%H %s'

          echo
          echo "PassWall2:"
          git -C package/passwall2 log -1 --format='%H %s'

          echo
          echo "DAED:"
          git -C package/dae log -1 --format='%H %s'

          echo
          echo "Lucky:"
          git -C package/lucky log -1 --format='%H %s'

          echo
          echo "Argon:"
          git -C package/argon log -1 --format='%H %s'

          echo
          echo "Argon Config:"
          git -C package/argon-config log -1 --format='%H %s'


          echo
          echo "===== Selected packages ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall2|daed|luci-app-daed|luci-app-lucky|luci-app-rtp2httpd|luci-theme-argon|luci-app-argon-config)=' \
            .config \
            || true


          echo
          echo "===== Conflict warnings ====="

          if grep -q \
            'Not overriding core package.*luci-app-openclash' \
            defconfig.log
          then
            echo "OpenClash override warning: FOUND"
          else
            echo "OpenClash override warning: NONE"
          fi


          if grep -q \
            "dependency on 'luci-theme-argon', which does not exist" \
            defconfig.log
          then
            echo "Argon dependency warning: FOUND"
          else
            echo "Argon dependency warning: NONE"
          fi


          echo
          echo "################################################################"
          echo "# IMMORTALWRT V3 TEST 03 COMPLETED"
          echo "################################################################"

name: ImmortalWrt V3 Test 01

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    if: github.event.repository.owner.id == github.event.sender.id

    permissions:
      contents: read

    name: Validate ImmortalWrt ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        target: [25.12]

    steps:

      # ============================================================
      # 1. Checkout workflow repository
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Maximize build space
      # ============================================================

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'


      # ============================================================
      # 3. Install minimum build dependencies
      # ============================================================

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Asia/Shanghai

        run: |
          set -e

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /etc/mysql \
            /etc/php || true

          sudo -E apt-get update

          sudo -E apt-get install -y \
            ack \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gettext \
            git \
            gperf \
            help2man \
            intltool \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            make \
            ninja-build \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            scdoc

          sudo -E timedatectl set-timezone "Asia/Shanghai"


      # ============================================================
      # 4. Clone ImmortalWrt source
      # ============================================================

      - name: Clone ImmortalWrt source
        env:
          REPO_URL: https://github.com/immortalwrt/immortalwrt
          REPO_BRANCH: openwrt-25.12

        run: |
          set -e

          git clone \
            --depth 1 \
            "$REPO_URL" \
            -b "$REPO_BRANCH" \
            openwrt

          cd openwrt

          echo
          echo "============================================================"
          echo "IMMORTALWRT SOURCE"
          echo "============================================================"

          echo "Repository:"
          echo "$REPO_URL"

          echo "Branch:"
          git branch --show-current

          echo "Commit:"
          git log -1 --format='%H'

          echo "Subject:"
          git log -1 --format='%s'

          echo "============================================================"


      # ============================================================
      # 5. Configure upstream feeds
      #
      # IMPORTANT:
      # No kenzok8/small
      # No kenzok8/openwrt-packages
      # ============================================================

      - name: Configure upstream feeds
        working-directory: ./openwrt

        run: |
          set -e

          echo "============================================================"
          echo "CONFIGURE UPSTREAM FEEDS"
          echo "============================================================"

          sed -i \
            '1i src-git rtp2httpd https://github.com/stackia/rtp2httpd.git' \
            feeds.conf.default

          echo
          echo "===== feeds.conf.default ====="
          cat feeds.conf.default

          echo
          echo "============================================================"


      # ============================================================
      # 6. Update official feeds
      # ============================================================

      - name: Update official feeds
        working-directory: ./openwrt

        run: |
          set -e

          echo "============================================================"
          echo "UPDATE ALL FEEDS"
          echo "============================================================"

          ./scripts/feeds update -a

          echo
          echo "===== Feed directories ====="

          find feeds \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' \
            | sort

          echo
          echo "============================================================"


      # ============================================================
      # 7. Install official feeds
      # ============================================================

      - name: Install official feeds
        working-directory: ./openwrt

        run: |
          set -e

          echo "============================================================"
          echo "INSTALL OFFICIAL FEEDS"
          echo "============================================================"

          ./scripts/feeds install -a

          echo
          echo "Official feeds installed."
          echo "============================================================"


      # ============================================================
      # 8. Install OpenClash
      # ============================================================

      - name: Install OpenClash
        working-directory: ./openwrt

        run: |
          set -e

          echo "============================================================"
          echo "INSTALL OPENCLASH"
          echo "============================================================"

          rm -rf package/feeds/luci/luci-app-openclash
          rm -rf package/openclash

          git clone \
            --depth 1 \
            https://github.com/vernesong/OpenClash.git \
            package/openclash

          echo
          echo "OpenClash commit:"
          git -C package/openclash log -1 --format='%H'

          echo "OpenClash subject:"
          git -C package/openclash log -1 --format='%s'

          echo
          echo "============================================================"


      # ============================================================
      # 9. Install PassWall2
      # ============================================================

      - name: Install PassWall2
        working-directory: ./openwrt

        run: |
          set -e

          echo "============================================================"
          echo "INSTALL PASSWALL2"
          echo "============================================================"

          rm -rf package/feeds/luci/luci-app-passwall2
          rm -rf package/passwall2

          git clone \
            --depth 1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall2.git \
            package/passwall2

          echo
          echo "PassWall2 commit:"
          git -C package/passwall2 log -1 --format='%H'

          echo "PassWall2 subject:"
          git -C package/passwall2 log -1 --format='%s'

          echo
          echo "============================================================"


      # ============================================================
      # 10. Install DAED
      #
      # IMPORTANT:
      # Use QiuSimons upstream repository.
      # Do not use ImmortalWrt's old package/dae.
      # ============================================================

      - name: Install DAED
        working-directory: ./openwrt

        run: |
          set -e

          echo "============================================================"
          echo "INSTALL DAED"
          echo "============================================================"

          rm -rf package/dae
          rm -rf package/feeds/base/dae

          git clone \
            --depth 1 \
            https://github.com/QiuSimons/luci-app-daed.git \
            package/dae

          echo
          echo "DAED commit:"
          git -C package/dae log -1 --format='%H'

          echo "DAED subject:"
          git -C package/dae log -1 --format='%s'

          echo
          echo "DAED repository structure:"
          find package/dae \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -200

          echo
          echo "============================================================"


      # ============================================================
      # 11. Install Lucky
      # ============================================================

      - name: Install Lucky
        working-directory: ./openwrt

        run: |
          set -e

          echo "============================================================"
          echo "INSTALL LUCKY"
          echo "============================================================"

          rm -rf package/feeds/lucky/luci-app-lucky
          rm -rf package/lucky

          git clone \
            --depth 1 \
            https://github.com/gdy666/luci-app-lucky.git \
            package/lucky

          echo
          echo "Lucky commit:"
          git -C package/lucky log -1 --format='%H'

          echo "Lucky subject:"
          git -C package/lucky log -1 --format='%s'

          echo
          echo "============================================================"


      # ============================================================
      # 12. Install Argon
      # ============================================================

      - name: Install Argon
        working-directory: ./openwrt

        run: |
          set -e

          echo "============================================================"
          echo "INSTALL ARGON"
          echo "============================================================"

          rm -rf package/feeds/luci/luci-theme-argon
          rm -rf package/feeds/luci/luci-app-argon-config

          rm -rf package/argon
          rm -rf package/argon-config

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/argon

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/argon-config

          echo
          echo "Argon commit:"
          git -C package/argon log -1 --format='%H'

          echo "Argon subject:"
          git -C package/argon log -1 --format='%s'

          echo
          echo "Argon Config commit:"
          git -C package/argon-config log -1 --format='%H'

          echo "Argon Config subject:"
          git -C package/argon-config log -1 --format='%s'

          echo
          echo "============================================================"


      # ============================================================
      # 13. Refresh feed package index
      #
      # This is intentionally done AFTER all upstream repositories
      # have been inserted.
      # ============================================================

      - name: Refresh feed package index
        working-directory: ./openwrt

        run: |
          set -e

          echo "============================================================"
          echo "REFRESH PACKAGE INDEX"
          echo "============================================================"

          ./scripts/feeds install -a

          echo
          echo "============================================================"


      # ============================================================
      # 14. Package inventory
      # ============================================================

      - name: Package inventory
        working-directory: ./openwrt

        run: |
          set -e

          echo "============================================================"
          echo "PACKAGE INVENTORY"
          echo "============================================================"

          echo
          echo "===== OpenClash ====="
          find package/openclash \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -100

          echo
          echo "===== PassWall2 ====="
          find package/passwall2 \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -100

          echo
          echo "===== DAED ====="
          find package/dae \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -150

          echo
          echo "===== Lucky ====="
          find package/lucky \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -100

          echo
          echo "===== Argon ====="
          find package/argon \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -100

          echo
          echo "===== Argon Config ====="
          find package/argon-config \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -100

          echo
          echo "============================================================"


      # ============================================================
      # 15. Detect duplicate package definitions
      # ============================================================

      - name: Detect duplicate package definitions
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "DUPLICATE PACKAGE DEFINITION CHECK"
          echo "============================================================"

          TMPFILE=$(mktemp)

          find package feeds \
            -type f \
            \( -name 'Makefile' -o -name '*.mk' \) \
            -print0 \
            | xargs -0 grep -H -E \
              '^[[:space:]]*define[[:space:]]+Package/' \
            > "$TMPFILE" || true

          echo
          echo "Potential package definitions:"
          cat "$TMPFILE" || true

          echo
          echo "===== Known packages ====="

          for pkg in \
            luci-app-openclash \
            luci-app-passwall2 \
            luci-app-daed \
            daed \
            luci-app-lucky \
            luci-app-rtp2httpd \
            luci-theme-argon \
            luci-app-argon-config
          do
            echo
            echo ">>> $pkg"

            grep -R -n \
              --include='Makefile' \
              --include='*.mk' \
              -E "Package/${pkg}([[:space:]]|$)" \
              package feeds \
              2>/dev/null || true
          done

          rm -f "$TMPFILE"

          echo
          echo "============================================================"

      # ============================================================
      # 16. Check selected package Makefiles
      #
      # IMPORTANT:
      # Third-party repositories may use different directory
      # layouts. Do NOT hard-code the Argon package path.
      # ============================================================

      - name: Check package Makefiles
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "PACKAGE MAKEFILE CHECK"
          echo "============================================================"

          FAILED=0

          check_makefile() {
            NAME="$1"
            FILE="$2"

            echo
            echo ">>> Checking $NAME"
            echo "Path: $FILE"

            if [ ! -f "$FILE" ]; then
              echo "ERROR: Makefile not found."
              FAILED=1
              return
            fi

            echo "OK: Makefile exists."

            echo "--- Package definitions ---"
            grep -n \
              -E '^[[:space:]]*define[[:space:]]+Package/' \
              "$FILE" \
              || true

            echo "--- Dependencies ---"
            grep -n \
              -E 'DEPENDS[+:]?=|LUCI_DEPENDS[+:]?=' \
              "$FILE" \
              || true
          }


          find_makefile() {
            ROOT="$1"
            PACKAGE="$2"

            find "$ROOT" \
              -type f \
              -name Makefile \
              -print0 \
              | xargs -0 grep -l \
                -E "^[[:space:]]*define[[:space:]]+Package/(\$\{PKG_NAME\}|\\\$\(PKG_NAME\)|${PACKAGE})([[:space:]]|/|$)" \
                2>/dev/null \
              | head -1
          }


          # ----------------------------------------------------------
          # OpenClash
          # ----------------------------------------------------------

          check_makefile \
            "OpenClash" \
            "package/openclash/luci-app-openclash/Makefile"


          # ----------------------------------------------------------
          # PassWall2
          # ----------------------------------------------------------

          check_makefile \
            "PassWall2" \
            "package/passwall2/luci-app-passwall2/Makefile"


          # ----------------------------------------------------------
          # DAED
          # ----------------------------------------------------------

          if [ -f package/dae/luci-app-daed/Makefile ]; then

            check_makefile \
              "DAED" \
              "package/dae/luci-app-daed/Makefile"

          elif [ -f package/dae/Makefile ]; then

            check_makefile \
              "DAED" \
              "package/dae/Makefile"

          else

            echo
            echo "ERROR: DAED Makefile not found."
            FAILED=1

          fi


          # ----------------------------------------------------------
          # Lucky
          # ----------------------------------------------------------

          check_makefile \
            "Lucky" \
            "package/lucky/luci-app-lucky/Makefile"


          # ----------------------------------------------------------
          # Argon
          #
          # Search automatically because upstream repository layout
          # may change.
          # ----------------------------------------------------------

          echo
          echo ">>> Checking Argon"

          ARGON_MAKEFILE=$(find package/argon \
            -type f \
            -name Makefile \
            | head -1)

          if [ -z "$ARGON_MAKEFILE" ]; then

            echo "ERROR: Argon Makefile not found."
            echo
            echo "Argon repository structure:"
            find package/argon \
              -maxdepth 4 \
              -type f \
              | sort \
              | head -200

            FAILED=1

          else

            echo "Argon Makefile:"
            echo "$ARGON_MAKEFILE"

            check_makefile \
              "Argon" \
              "$ARGON_MAKEFILE"

          fi


          # ----------------------------------------------------------
          # Argon Config
          # ----------------------------------------------------------

          ARGON_CONFIG_MAKEFILE=$(find package/argon-config \
            -type f \
            -name Makefile \
            | head -1)

          if [ -z "$ARGON_CONFIG_MAKEFILE" ]; then

            echo
            echo "ERROR: Argon Config Makefile not found."
            FAILED=1

          else

            check_makefile \
              "Argon Config" \
              "$ARGON_CONFIG_MAKEFILE"

          fi


          # ----------------------------------------------------------
          # Final result
          # ----------------------------------------------------------

          if [ "$FAILED" -ne 0 ]; then

            echo
            echo "============================================================"
            echo "PACKAGE MAKEFILE CHECK FAILED"
            echo "============================================================"

            exit 1

          fi


          echo
          echo "============================================================"
          echo "PACKAGE MAKEFILE CHECK PASSED"
          echo "============================================================"

      # ============================================================
      # 17. Dependency inspection
      # ============================================================

      - name: Dependency inspection
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "DEPENDENCY INSPECTION"
          echo "============================================================"

          echo
          echo "===== OpenClash dependencies ====="
          grep -R -n \
            --include='Makefile' \
            -E 'DEPENDS[+:]?=' \
            package/openclash \
            2>/dev/null || true

          echo
          echo "===== PassWall2 dependencies ====="
          grep -R -n \
            --include='Makefile' \
            -E 'DEPENDS[+:]?=' \
            package/passwall2 \
            2>/dev/null || true

          echo
          echo "===== DAED dependencies ====="
          grep -R -n \
            --include='Makefile' \
            -E 'DEPENDS[+:]?=' \
            package/dae \
            2>/dev/null || true

          echo
          echo "===== Lucky dependencies ====="
          grep -R -n \
            --include='Makefile' \
            -E 'DEPENDS[+:]?=' \
            package/lucky \
            2>/dev/null || true

          echo
          echo "===== RTP2HTTPD dependencies ====="
          grep -R -n \
            --include='Makefile' \
            -E 'DEPENDS[+:]?=' \
            feeds/rtp2httpd \
            2>/dev/null || true

          echo
          echo "============================================================"


      # ============================================================
      # 18. Build minimal validation configuration
      #
      # We deliberately DO NOT enable the complete V3 firmware
      # configuration here.
      #
      # This stage only tests whether the source tree and package
      # definitions can successfully pass Kconfig/defconfig.
      # ============================================================

      - name: Generate minimal validation config
        working-directory: ./openwrt

        run: |
          set -e

          echo "============================================================"
          echo "GENERATE MINIMAL VALIDATION CONFIG"
          echo "============================================================"

          rm -f .config .config.old

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y

          CONFIG_PACKAGE_luci=y

          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-daed=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-app-rtp2httpd=y
          CONFIG_PACKAGE_luci-theme-argon=y
          EOF

          sed -i 's/^[[:space:]]*//' .config

          echo
          echo "===== Initial .config ====="
          cat .config

          echo
          echo "===== Running make defconfig ====="

          make defconfig

          echo
          echo "===== Final selected packages ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall2|luci-app-daed|daed|luci-app-lucky|luci-app-rtp2httpd|luci-theme-argon|luci-app-argon-config)=' \
            .config \
            || true

          echo
          echo "============================================================"


      # ============================================================
      # 19. Check unresolved package symbols
      # ============================================================

      - name: Check unresolved package symbols
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "CHECK UNRESOLVED PACKAGE SYMBOLS"
          echo "============================================================"

          echo
          echo "===== Selected third-party packages ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall2|luci-app-daed|daed|luci-app-lucky|luci-app-rtp2httpd|luci-theme-argon|luci-app-argon-config)=' \
            .config \
            || true

          echo
          echo "===== Search for explicit =m / =y / =n states ====="

          for pkg in \
            luci-app-openclash \
            luci-app-passwall2 \
            luci-app-daed \
            daed \
            luci-app-lucky \
            luci-app-rtp2httpd \
            luci-theme-argon \
            luci-app-argon-config
          do
            SYMBOL="CONFIG_PACKAGE_${pkg}"

            if grep -q "^${SYMBOL}=" .config; then
              grep "^${SYMBOL}=" .config
            else
              echo "WARNING: $SYMBOL is not present in .config"
            fi
          done

          echo
          echo "============================================================"


      # ============================================================
      # 20. Search for known problematic dependencies
      # ============================================================

      - name: Search dependency availability
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "DEPENDENCY AVAILABILITY CHECK"
          echo "============================================================"

          check_symbol() {
            NAME="$1"

            echo
            echo ">>> $NAME"

            grep -R -n \
              --include='Config.in' \
              --include='*.in' \
              --include='Makefile' \
              "$NAME" \
              package feeds \
              2>/dev/null \
              | head -30 \
              || true
          }

          check_symbol "vmlinux-btf"
          check_symbol "BPF_TOOLCHAIN_HOST"
          check_symbol "DEBUG_INFO_BTF"
          check_symbol "kmod-nft-tproxy"
          check_symbol "kmod-nft-socket"
          check_symbol "kmod-xdp-sockets-diag"
          check_symbol "sing-box"
          check_symbol "chinadns-ng"

          echo
          echo "============================================================"


      # ============================================================
      # 21. Final source tree summary
      # ============================================================

      - name: Final validation summary
        working-directory: ./openwrt

        run: |
          set -e

          echo
          echo "################################################################"
          echo "# IMMORTALWRT V3 TEST 01 FINAL SUMMARY"
          echo "################################################################"

          echo
          echo "===== ImmortalWrt ====="
          git log -1 --format='commit: %H'
          git log -1 --format='subject: %s'

          echo
          echo "===== Third-party repositories ====="

          for repo in \
            package/openclash \
            package/passwall2 \
            package/dae \
            package/lucky \
            package/argon \
            package/argon-config \
            feeds/rtp2httpd
          do
            echo
            echo ">>> $repo"

            if [ -d "$repo/.git" ]; then
              git -C "$repo" log -1 --format='commit: %H'
              git -C "$repo" log -1 --format='subject: %s'
            else
              echo "WARNING: Git repository metadata not found."
            fi
          done

          echo
          echo "===== Selected packages ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall2|luci-app-daed|daed|luci-app-lucky|luci-app-rtp2httpd|luci-theme-argon|luci-app-argon-config)=' \
            .config \
            || true

          echo
          echo "===== Source tree size ====="
          du -sh . || true

          echo
          echo "################################################################"
          echo "# TEST 01 COMPLETED"
          echo "################################################################"


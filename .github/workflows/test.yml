name: ImmortalWrt V3 Test 07

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: read
    name: ImmortalWrt V3 Build ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        target: [25.12]

    steps:

      # 1. Maximize build space - MUST run before checkout
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 2. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 3. Install build dependencies
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Asia/Shanghai
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /etc/mysql /etc/php || true
          sudo -E apt-get update
          sudo -E apt-get install -y \
            ack asciidoc autoconf automake autopoint binutils bison build-essential bzip2 \
            ccache clang cmake cpio curl device-tree-compiler flex gawk gettext git gperf \
            help2man intltool libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool llvm make ninja-build patch pkgconf python3 python3-pyelftools \
            python3-setuptools rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            unzip wget xmlto xxd zlib1g-dev scdoc
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      # 4. Clone ImmortalWrt
      - name: Clone ImmortalWrt source
        env:
          REPO_URL: https://github.com/immortalwrt/immortalwrt
          REPO_BRANCH: openwrt-25.12
        run: |
          set -e
          git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
          cd openwrt
          echo "============================================================"
          echo "IMMORTALWRT SOURCE"
          echo "============================================================"
          git branch --show-current
          git log -1 --format='commit: %H'
          git log -1 --format='subject: %s'

      # 5. Configure feeds
      - name: Configure upstream feeds
        working-directory: ./openwrt
        run: |
          set -e
          sed -i '1i src-git rtp2httpd https://github.com/stackia/rtp2httpd.git' feeds.conf.default
          cat feeds.conf.default

      # 6. Update feeds
      - name: Update feeds
        working-directory: ./openwrt
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 7. Install third-party packages
      - name: Install third-party packages
        working-directory: ./openwrt
        run: |
          set -e

          rm -rf package/feeds/luci/luci-app-openclash package/openclash
          git clone --depth 1 https://github.com/vernesong/OpenClash.git package/openclash

          rm -rf package/feeds/luci/luci-app-passwall2 package/passwall2
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git package/passwall2

          rm -rf package/dae package/feeds/base/dae
          git clone --depth 1 https://github.com/QiuSimons/luci-app-daed.git package/dae

          rm -rf package/feeds/lucky/luci-app-lucky package/lucky
          git clone --depth 1 https://github.com/gdy666/luci-app-lucky.git package/lucky

          rm -rf package/feeds/luci/luci-theme-argon package/feeds/luci/luci-app-argon-config package/argon package/argon-config
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/argon
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git package/argon-config

      # 8. Refresh package index
      - name: Refresh feed packages
        working-directory: ./openwrt
        run: |
          set -e
          ./scripts/feeds install -a

      # 9. Check third-party package Makefiles
      - name: Check package Makefiles
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          check_makefile() {
            NAME="$1"
            FILE="$2"
            echo
            echo ">>> Checking $NAME"
            echo "Path: $FILE"
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Makefile not found."
              exit 1
            fi
            echo "OK: Makefile exists."
            grep -n -E 'define Package/|DEPENDS[+:]?=|LUCI_DEPENDS[+:]?=' "$FILE" 2>/dev/null || true
          }

          check_makefile "OpenClash" package/openclash/luci-app-openclash/Makefile
          check_makefile "PassWall2" package/passwall2/luci-app-passwall2/Makefile
          check_makefile "DAED" package/dae/luci-app-daed/Makefile
          check_makefile "Lucky" package/lucky/luci-app-lucky/Makefile
          check_makefile "Argon" package/argon/Makefile
          check_makefile "Argon Config" package/argon-config/Makefile

          echo
          echo "============================================================"
          echo "PACKAGE MAKEFILE CHECK PASSED"
          echo "============================================================"

      # 10. Generate V3 configuration
      - name: Generate V3 configuration
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          rm -f .config .config.old
          touch .config

          cat >> .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y
          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_EFI_IMAGES=y

          CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_kmod-nft-nat6=y

          CONFIG_PACKAGE_kmod-bonding=y
          CONFIG_PACKAGE_proto-bonding=y
          CONFIG_PACKAGE_luci-proto-bonding=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-app-irqbalance=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-filebrowser=n
          CONFIG_PACKAGE_luci-app-taskplan=n

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y

          CONFIG_PACKAGE_luci-app-rtp2httpd=y

          CONFIG_PACKAGE_luci-app-ssr-plus=n
          CONFIG_PACKAGE_luci-app-passwall=n
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-mihomo=n
          CONFIG_PACKAGE_luci-app-homeproxy=n

          CONFIG_DEVEL=y
          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_REDUCED=n
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_CGROUPS=y
          CONFIG_KERNEL_CGROUP_BPF=y
          CONFIG_KERNEL_BPF_EVENTS=y
          CONFIG_BPF_TOOLCHAIN_HOST=y
          CONFIG_KERNEL_XDP_SOCKETS=y
          CONFIG_PACKAGE_kmod-xdp-sockets-diag=y
          CONFIG_PACKAGE_daed=y
          CONFIG_PACKAGE_luci-app-daed=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_ip-full=y

          CONFIG_PACKAGE_luci-app-softethervpn=n
          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_luci-app-openvpn-server=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y
          CONFIG_PACKAGE_netbird=n
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y

          CONFIG_PACKAGE_luci-app-lucky=y

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_vim-fuller=n
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_SOCAT_SSL=y
          CONFIG_SING_BOX_WITH_ECH=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_open-vm-tools=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_irqbalance=y
          EOF

          cp .config .config.requested

          echo "============================================================"
          echo "REQUESTED CONFIGURATION"
          echo "============================================================"
          cat .config

      # 11. Run defconfig
      - name: Run make defconfig
        working-directory: ./openwrt
        shell: bash
        run: |
          set -o pipefail
          echo "============================================================"
          echo "RUN MAKE DEFCONFIG"
          echo "============================================================"
          make defconfig 2>&1 | tee defconfig.log
          echo "============================================================"
          echo "DEFCONFIG COMPLETED"
          echo "============================================================"

      # 12. Audit defconfig
      - name: Audit defconfig changes
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e
          echo "============================================================"
          echo "DEFCONFIG AUDIT"
          echo "============================================================"
          echo "===== Changed configuration ====="
          diff -u .config.requested .config || true
          echo
          echo "===== Selected packages ====="
          grep -E '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall2|daed|luci-app-daed|luci-app-lucky|luci-app-rtp2httpd|luci-theme-argon|luci-app-argon-config|sing-box)=' .config || true

      # 13. Verify package selections
      - name: Verify package selections
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          FAILED=0

          check_y() {
            SYMBOL="$1"
            VALUE=$(grep "^${SYMBOL}=" .config 2>/dev/null | cut -d= -f2 || true)
            echo "$SYMBOL = ${VALUE:-<NOT SET>}"
            if [ "$VALUE" != "y" ]; then
              echo "ERROR: $SYMBOL is not enabled."
              FAILED=1
            fi
          }

          check_not_y() {
            SYMBOL="$1"
            VALUE=$(grep "^${SYMBOL}=" .config 2>/dev/null | cut -d= -f2 || true)
            echo "$SYMBOL = ${VALUE:-<NOT SET>}"
            if [ "$VALUE" = "y" ]; then
              echo "ERROR: $SYMBOL unexpectedly enabled."
              FAILED=1
            fi
          }

          echo "===== Required ====="
          check_y CONFIG_PACKAGE_luci
          check_y CONFIG_PACKAGE_luci-app-openclash
          check_y CONFIG_PACKAGE_luci-app-passwall2
          check_y CONFIG_PACKAGE_daed
          check_y CONFIG_PACKAGE_luci-app-daed
          check_y CONFIG_PACKAGE_luci-app-lucky
          check_y CONFIG_PACKAGE_luci-app-rtp2httpd
          check_y CONFIG_PACKAGE_luci-app-argon-config

          echo
          echo "===== WireGuard ====="
          check_y CONFIG_PACKAGE_kmod-wireguard
          check_y CONFIG_PACKAGE_wireguard-tools
          check_y CONFIG_PACKAGE_luci-proto-wireguard

          echo
          echo "===== OpenVPN ====="
          check_y CONFIG_PACKAGE_luci-app-openvpn
          check_y CONFIG_PACKAGE_luci-app-openvpn-server
          check_y CONFIG_PACKAGE_openvpn-easy-rsa

          echo
          echo "===== SQM ====="
          check_y CONFIG_PACKAGE_luci-app-sqm
          check_y CONFIG_PACKAGE_sqm-scripts
          check_y CONFIG_PACKAGE_kmod-sched-cake
          check_y CONFIG_PACKAGE_kmod-ifb
          check_y CONFIG_PACKAGE_tc-full

          echo
          echo "===== Other ====="
          check_y CONFIG_PACKAGE_sing-box
          check_y CONFIG_PACKAGE_chinadns-ng
          check_y CONFIG_PACKAGE_open-vm-tools
          check_y CONFIG_PACKAGE_iperf3
          check_y CONFIG_PACKAGE_tcpdump
          check_y CONFIG_PACKAGE_haproxy
          check_y CONFIG_PACKAGE_socat

          echo
          echo "===== Disabled ====="
          check_not_y CONFIG_PACKAGE_luci-app-ssr-plus
          check_not_y CONFIG_PACKAGE_luci-app-passwall
          check_not_y CONFIG_PACKAGE_luci-app-mihomo
          check_not_y CONFIG_PACKAGE_luci-app-homeproxy
          check_not_y CONFIG_PACKAGE_netbird

          if [ "$FAILED" -ne 0 ]; then
            echo "============================================================"
            echo "FINAL CONFIGURATION VERIFICATION FAILED"
            echo "============================================================"
            exit 1
          fi

          echo "============================================================"
          echo "FINAL CONFIGURATION VERIFICATION PASSED"
          echo "============================================================"

      # 14. DAED / BTF audit
      - name: Audit DAED BTF configuration
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e
          echo "============================================================"
          echo "DAED / BTF CONFIGURATION AUDIT"
          echo "============================================================"
          grep -E '^CONFIG_(DEVEL|KERNEL_DEBUG_INFO|KERNEL_DEBUG_INFO_REDUCED|KERNEL_DEBUG_INFO_BTF|KERNEL_CGROUPS|KERNEL_CGROUP_BPF|KERNEL_BPF_EVENTS|BPF_TOOLCHAIN_HOST|KERNEL_XDP_SOCKETS|PACKAGE_kmod-xdp-sockets-diag|PACKAGE_daed|PACKAGE_luci-app-daed)=' .config || true
          echo
          echo "===== Kernel symbols ====="
          for symbol in CONFIG_DEBUG_INFO CONFIG_DEBUG_INFO_BTF CONFIG_DEBUG_INFO_BTF_MODULES CONFIG_BPF CONFIG_BPF_SYSCALL CONFIG_CGROUPS CONFIG_CGROUP_BPF CONFIG_BPF_EVENTS CONFIG_XDP_SOCKETS; do
            echo ">>> $symbol"
            grep -R -n --include='Config.in*' --include='*.in' "$symbol" target package 2>/dev/null | head -20 || true
          done

      # 15. Check defconfig warnings
      - name: Check defconfig warnings
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e
          echo "============================================================"
          echo "CHECK DEFCONFIG WARNINGS"
          echo "============================================================"

          if [ ! -f defconfig.log ]; then
            echo "ERROR: defconfig.log not found."
            exit 1
          fi

          echo "===== Warning / dependency messages ====="
          grep -n -E 'WARNING:|warning:|depends on|dependency|not found|unknown symbol|invalid' defconfig.log || true

          echo
          echo "===== OpenClash override check ====="
          if grep -q "Not overriding core package 'luci-app-openclash'" defconfig.log; then
            echo "ERROR: OpenClash override warning detected."
            exit 1
          else
            echo "OK: No OpenClash override warning."
          fi

          echo
          echo "===== Argon dependency check ====="
          if grep -q "package/argon-config/Makefile.*depends on 'luci-theme-argon', which does not exist" defconfig.log; then
            echo "ERROR: Argon dependency warning detected."
            exit 1
          else
            echo "OK: No Argon dependency warning."
          fi

          echo
          echo "===== Complete defconfig log ====="
          cat defconfig.log

      # 16. Package dependency check
      - name: Package dependency check
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e
          echo "============================================================"
          echo "PACKAGE DEPENDENCY CHECK"
          echo "============================================================"

          for dir in package/openclash package/passwall2 package/dae package/lucky package/argon package/argon-config feeds/rtp2httpd; do
            if [ -d "$dir" ]; then
              echo
              echo "############################################################"
              echo "# $dir"
              echo "############################################################"
              grep -R -n --include='Makefile' -E 'DEPENDS[+:]?=|LUCI_DEPENDS[+:]?=' "$dir" 2>/dev/null || true
            fi
          done

      # 17. Search known dependency problems
      - name: Search known dependency problems
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e
          echo "============================================================"
          echo "KNOWN DEPENDENCY SEARCH"
          echo "============================================================"

          check_dependency() {
            NAME="$1"
            echo
            echo "############################################################"
            echo "# SEARCH: $NAME"
            echo "############################################################"
            grep -R -n --include='Makefile' --include='Config.in' --include='*.in' "$NAME" package feeds target 2>/dev/null | head -50 || true
          }

          check_dependency "vmlinux-btf"
          check_dependency "BPF_TOOLCHAIN_HOST"
          check_dependency "DEBUG_INFO_BTF"
          check_dependency "kmod-nft-tproxy"
          check_dependency "kmod-nft-socket"
          check_dependency "kmod-xdp-sockets-diag"
          check_dependency "sing-box"
          check_dependency "chinadns-ng"
          check_dependency "proto-bonding"

      # 18. Download sources
      - name: Download package sources
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e
          echo "============================================================"
          echo "DOWNLOAD PACKAGE SOURCES"
          echo "============================================================"
          make download -j$(nproc) V=s 2>&1 | tee download.log

      # 19. Compile firmware
      - name: Compile ImmortalWrt
        working-directory: ./openwrt
        shell: bash
        run: |
          set -o pipefail
          echo "============================================================"
          echo "START IMMORTALWRT V3 TEST 07 BUILD"
          echo "============================================================"
          echo "CPU threads: $(nproc)"
          echo "Start time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo
          make -j$(nproc) V=s 2>&1 | tee build.log
          echo
          echo "============================================================"
          echo "BUILD COMPLETED"
          echo "============================================================"
          echo "End time: $(date '+%Y-%m-%d %H:%M:%S')"

      # 20. Inspect build output
      - name: Inspect build output
        if: always()
        working-directory: ./openwrt
        shell: bash
        run: |
          set +e
          echo "============================================================"
          echo "BUILD OUTPUT"
          echo "============================================================"
          find bin/targets/x86/64 -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null | sort
          echo
          echo "===== EFI images ====="
          find bin/targets/x86/64 -maxdepth 1 -type f \( -name '*efi*.img' -o -name '*efi*.img.gz' -o -name '*.img.gz' \) -printf '%f\n' 2>/dev/null | sort
          echo
          echo "===== Packages ====="
          find bin/packages -type f 2>/dev/null | wc -l
          echo
          echo "===== Build disk ====="
          df -h .
          echo
          echo "===== Build log tail ====="
          tail -100 build.log 2>/dev/null || true

      # 21. Verify EFI image
      - name: Verify EFI image
        if: success()
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e
          echo "============================================================"
          echo "VERIFY EFI IMAGE"
          echo "============================================================"

          IMAGE_COUNT=$(find bin/targets/x86/64 -maxdepth 1 -type f \( -name '*efi*.img' -o -name '*efi*.img.gz' \) | wc -l)

          echo "EFI image count: $IMAGE_COUNT"

          if [ "$IMAGE_COUNT" -lt 1 ]; then
            echo "ERROR: EFI image not found."
            exit 1
          fi

          find bin/targets/x86/64 -maxdepth 1 -type f \( -name '*efi*.img' -o -name '*efi*.img.gz' \) -printf '%f %s bytes\n'

          echo
          echo "EFI IMAGE VERIFICATION PASSED"

      # 22. Generate build summary
      - name: Generate build summary
        if: always()
        working-directory: ./openwrt
        shell: bash
        run: |
          set +e
          {
            echo "IMMORTALWRT V3 TEST 07"
            echo "======================"
            echo
            echo "Source:"
            git log -1 --format='commit: %H'
            git log -1 --format='subject: %s'
            echo
            echo "Target:"
            grep -E '^CONFIG_TARGET_(x86|x86_64|x86_64_Generic)=' .config || true
            echo
            echo "Image:"
            grep -E '^CONFIG_(TARGET_KERNEL_PARTSIZE|TARGET_ROOTFS_PARTSIZE|TARGET_IMAGES_GZIP|EFI_IMAGES)=' .config || true
            echo
            echo "Proxy:"
            grep -E '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall2|daed|luci-app-daed|sing-box)=' .config || true
            echo
            echo "VPN:"
            grep -E '^CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-proto-wireguard|luci-app-openvpn|luci-app-openvpn-server|openvpn-easy-rsa)=' .config || true
            echo
            echo "SQM:"
            grep -E '^CONFIG_PACKAGE_(luci-app-sqm|sqm-scripts|kmod-sched-cake|kmod-ifb|tc-full)=' .config || true
            echo
            echo "DAED/BTF:"
            grep -E '^CONFIG_(KERNEL_DEBUG_INFO|KERNEL_DEBUG_INFO_REDUCED|KERNEL_DEBUG_INFO_BTF|KERNEL_CGROUPS|KERNEL_CGROUP_BPF|KERNEL_BPF_EVENTS|BPF_TOOLCHAIN_HOST|KERNEL_XDP_SOCKETS)=' .config || true
            echo
            echo "Argon:"
            grep -E '^CONFIG_PACKAGE_(luci-theme-argon|luci-app-argon-config)=' .config || true
            echo
            echo "EFI images:"
            find bin/targets/x86/64 -maxdepth 1 -type f \( -name '*efi*.img' -o -name '*efi*.img.gz' \) -printf '%f %s bytes\n' 2>/dev/null || true
            echo
            echo "Build finished: $(date '+%Y-%m-%d %H:%M:%S')"
          } | tee build-summary.txt

      # 23. Upload firmware
      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-v3-test07-firmware-${{ github.run_number }}
          path: |
            ./openwrt/bin/targets/x86/64/*efi*.img
            ./openwrt/bin/targets/x86/64/*efi*.img.gz
          if-no-files-found: error
          retention-days: 14

      # 24. Upload diagnostics
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-v3-test07-diagnostics-${{ github.run_number }}
          path: |
            ./openwrt/.config
            ./openwrt/.config.requested
            ./openwrt/defconfig.log
            ./openwrt/download.log
            ./openwrt/build.log
            ./openwrt/build-summary.txt
          if-no-files-found: warn
          retention-days: 14

      # 25. Final summary
      - name: Final summary
        if: always()
        working-directory: ./openwrt
        shell: bash
        run: |
          echo
          echo "################################################################"
          echo "# IMMORTALWRT V3 TEST 07"
          echo "################################################################"
          echo
          echo "Source:"
          git log -1 --format='commit: %H'
          git log -1 --format='subject: %s'
          echo
          echo "Firmware directory:"
          ls -lah bin/targets/x86/64 2>/dev/null || true
          echo
          echo "EFI images:"
          find bin/targets/x86/64 -maxdepth 1 -type f \( -name '*efi*.img' -o -name '*efi*.img.gz' \) -printf '%f\n' 2>/dev/null || true
          echo
          echo "################################################################"
          echo "# TEST 07 COMPLETED"
          echo "################################################################"

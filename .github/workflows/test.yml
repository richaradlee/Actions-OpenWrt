name: ImmortalWrt V3 Test 03

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    if: github.event.repository.owner.id == github.event.sender.id

    permissions:
      contents: read

    name: Config Validation ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        target: [25.12]

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Maximize build space
      # ============================================================

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'


      # ============================================================
      # 3. Install build dependencies
      # ============================================================

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Asia/Shanghai

        run: |
          set -e

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /etc/mysql \
            /etc/php || true

          sudo -E apt-get update

          sudo -E apt-get install -y \
            ack \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gettext \
            git \
            gperf \
            help2man \
            intltool \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            make \
            ninja-build \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            scdoc

          sudo -E timedatectl set-timezone "Asia/Shanghai"


      # ============================================================
      # 4. Clone ImmortalWrt
      # ============================================================

      - name: Clone ImmortalWrt source
        env:
          REPO_URL: https://github.com/immortalwrt/immortalwrt
          REPO_BRANCH: openwrt-25.12

        run: |
          set -e

          git clone \
            --depth 1 \
            "$REPO_URL" \
            -b "$REPO_BRANCH" \
            openwrt

          cd openwrt

          echo
          echo "============================================================"
          echo "IMMORTALWRT SOURCE"
          echo "============================================================"

          git branch --show-current
          git log -1 --format='commit: %H'
          git log -1 --format='subject: %s'

          echo
          echo "============================================================"


      # ============================================================
      # 5. Configure feeds
      # ============================================================

      - name: Configure upstream feeds
        working-directory: ./openwrt

        run: |
          set -e

          sed -i \
            '1i src-git rtp2httpd https://github.com/stackia/rtp2httpd.git' \
            feeds.conf.default

          echo
          echo "============================================================"
          echo "FEEDS CONFIGURATION"
          echo "============================================================"

          cat feeds.conf.default

          echo
          echo "============================================================"


      # ============================================================
      # 6. Update official feeds
      # ============================================================

      - name: Update feeds
        working-directory: ./openwrt

        run: |
          set -e

          ./scripts/feeds update -a


      # ============================================================
      # 7. Install official feed packages
      #
      # IMPORTANT:
      # Third-party packages are installed later.
      # ============================================================

      - name: Install official feed packages
        working-directory: ./openwrt

        run: |
          set -e

          ./scripts/feeds install -a


      # ============================================================
      # 8. Install OpenClash
      # ============================================================

      - name: Install OpenClash
        working-directory: ./openwrt

        run: |
          set -e

          echo
          echo "============================================================"
          echo "INSTALL OPENCLASH"
          echo "============================================================"

          rm -rf package/feeds/luci/luci-app-openclash
          rm -rf package/openclash

          git clone \
            --depth 1 \
            https://github.com/vernesong/OpenClash.git \
            package/openclash

          echo
          echo "OpenClash repository:"
          git -C package/openclash log -1 --format='commit: %H'
          git -C package/openclash log -1 --format='subject: %s'

          echo
          echo "============================================================"


      # ============================================================
      # 9. Install PassWall2
      # ============================================================

      - name: Install PassWall2
        working-directory: ./openwrt

        run: |
          set -e

          echo
          echo "============================================================"
          echo "INSTALL PASSWALL2"
          echo "============================================================"

          rm -rf package/feeds/luci/luci-app-passwall2
          rm -rf package/passwall2

          git clone \
            --depth 1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall2.git \
            package/passwall2

          echo
          echo "PassWall2 repository:"
          git -C package/passwall2 log -1 --format='commit: %H'
          git -C package/passwall2 log -1 --format='subject: %s'

          echo
          echo "============================================================"


      # ============================================================
      # 10. Install DAED
      # ============================================================

      - name: Install DAED
        working-directory: ./openwrt

        run: |
          set -e

          echo
          echo "============================================================"
          echo "INSTALL DAED"
          echo "============================================================"

          rm -rf package/dae
          rm -rf package/feeds/base/dae

          git clone \
            --depth 1 \
            https://github.com/QiuSimons/luci-app-daed.git \
            package/dae

          echo
          echo "DAED repository:"
          git -C package/dae log -1 --format='commit: %H'
          git -C package/dae log -1 --format='subject: %s'

          echo
          echo "============================================================"


      # ============================================================
      # 11. Install Lucky
      # ============================================================

      - name: Install Lucky
        working-directory: ./openwrt

        run: |
          set -e

          echo
          echo "============================================================"
          echo "INSTALL LUCKY"
          echo "============================================================"

          rm -rf package/feeds/lucky/luci-app-lucky
          rm -rf package/lucky

          git clone \
            --depth 1 \
            https://github.com/gdy666/luci-app-lucky.git \
            package/lucky

          echo
          echo "Lucky repository:"
          git -C package/lucky log -1 --format='commit: %H'
          git -C package/lucky log -1 --format='subject: %s'

          echo
          echo "============================================================"


      # ============================================================
      # 12. Install Argon Theme FIRST
      #
      # IMPORTANT:
      # Argon Config depends on luci-theme-argon.
      #
      # Therefore the Theme must exist before Argon Config is
      # introduced into the package tree.
      # ============================================================

      - name: Install Argon Theme
        working-directory: ./openwrt

        run: |
          set -e

          echo
          echo "============================================================"
          echo "INSTALL ARGON THEME"
          echo "============================================================"

          rm -rf package/feeds/luci/luci-theme-argon
          rm -rf package/argon

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/argon

          echo
          echo "Argon Theme repository:"
          git -C package/argon log -1 --format='commit: %H'
          git -C package/argon log -1 --format='subject: %s'

          echo
          echo "===== Argon Theme Makefile ====="

          if [ ! -f package/argon/Makefile ]; then
            echo "ERROR: Argon Theme Makefile not found."
            exit 1
          fi

          sed -n '1,160p' package/argon/Makefile

          echo
          echo "===== Detect package definition ====="

          grep -n \
            -E \
            'Package/(luci-theme-argon|.*argon)|PKG_NAME|LUCI_TITLE|LUCI_DEPENDS' \
            package/argon/Makefile \
            || true

          echo
          echo "============================================================"


      # ============================================================
      # 13. Register Argon Theme
      #
      # This is the key V3.03 change.
      #
      # Install the Theme into the feed/package index BEFORE
      # installing Argon Config.
      # ============================================================

      - name: Register Argon Theme package
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo
          echo "============================================================"
          echo "REGISTER ARGON THEME PACKAGE"
          echo "============================================================"

          echo
          echo "===== Current package directory ====="

          ls -la package/argon

          echo
          echo "===== Search Argon package definition ====="

          grep -R -n \
            -E \
            'PKG_NAME.*argon|Package/luci-theme-argon|LUCI_TITLE.*Argon' \
            package/argon \
            2>/dev/null \
            | head -50 \
            || true

          echo
          echo "===== Install Argon Theme ====="

          ./scripts/feeds install -p luci luci-theme-argon \
            2>&1 | tee argon-theme-install.log || true

          echo
          echo "===== Search installed Argon Theme ====="

          find package/feeds package \
            -maxdepth 4 \
            -type f \
            -name Makefile \
            -print \
            2>/dev/null \
            | grep -E 'argon|luci-theme' \
            | head -100 \
            || true

          echo
          echo "===== Verify package definition ====="

          if grep -R \
            -q \
            'Package/luci-theme-argon' \
            package \
            2>/dev/null
          then
            echo "OK: luci-theme-argon package definition detected."
          else
            echo "WARNING: luci-theme-argon package definition was not found by direct search."
          fi

          echo
          echo "============================================================"


      # ============================================================
      # 14. Install Argon Config SECOND
      # ============================================================

      - name: Install Argon Config
        working-directory: ./openwrt

        run: |
          set -e

          echo
          echo "============================================================"
          echo "INSTALL ARGON CONFIG"
          echo "============================================================"

          rm -rf package/feeds/luci/luci-app-argon-config
          rm -rf package/argon-config

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/argon-config

          echo
          echo "Argon Config repository:"
          git -C package/argon-config log -1 --format='commit: %H'
          git -C package/argon-config log -1 --format='subject: %s'

          echo
          echo "===== Argon Config Makefile ====="

          if [ ! -f package/argon-config/Makefile ]; then
            echo "ERROR: Argon Config Makefile not found."
            exit 1
          fi

          sed -n '1,160p' package/argon-config/Makefile

          echo
          echo "============================================================"


      # ============================================================
      # 15. Install RTP2HTTPD feed
      # ============================================================

      - name: Install RTP2HTTPD
        working-directory: ./openwrt

        run: |
          set -e

          echo
          echo "============================================================"
          echo "INSTALL RTP2HTTPD"
          echo "============================================================"

          ./scripts/feeds install -a

          echo
          echo "============================================================"


      # ============================================================
      # 16. Package Makefile Audit
      # ============================================================

      - name: Package Makefile Audit
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo
          echo "============================================================"
          echo "PACKAGE MAKEFILE AUDIT"
          echo "============================================================"

          FAILED=0

          check_makefile() {
            NAME="$1"
            PATH="$2"

            echo
            echo ">>> Checking $NAME"
            echo "Path: $PATH"

            if [ ! -f "$PATH" ]; then
              echo "ERROR: Makefile not found."
              FAILED=1
              return
            fi

            echo "OK: Makefile exists."

            echo "--- Package definitions ---"

            grep -n \
              -E \
              'define Package/|PKG_NAME|LUCI_TITLE' \
              "$PATH" \
              2>/dev/null \
              | head -30 \
              || true

            echo "--- Dependencies ---"

            grep -n \
              -E \
              'DEPENDS[+:]?=|LUCI_DEPENDS[+:]?=' \
              "$PATH" \
              2>/dev/null \
              | head -30 \
              || true
          }

          check_makefile \
            "OpenClash" \
            "package/openclash/luci-app-openclash/Makefile"

          check_makefile \
            "PassWall2" \
            "package/passwall2/luci-app-passwall2/Makefile"

          check_makefile \
            "DAED" \
            "package/dae/luci-app-daed/Makefile"

          check_makefile \
            "Lucky" \
            "package/lucky/luci-app-lucky/Makefile"

          check_makefile \
            "Argon" \
            "package/argon/Makefile"

          check_makefile \
            "Argon Config" \
            "package/argon-config/Makefile"

          echo
          echo "============================================================"

          if [ "$FAILED" -ne 0 ]; then
            echo "PACKAGE MAKEFILE AUDIT FAILED"
            exit 1
          fi

          echo "PACKAGE MAKEFILE AUDIT PASSED"

          echo "============================================================"


      # ============================================================
      # 17. Explicit Argon dependency validation
      # ============================================================

      - name: Validate Argon dependency
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo
          echo "============================================================"
          echo "ARGON DEPENDENCY VALIDATION"
          echo "============================================================"

          echo
          echo "===== Argon Theme package name ====="

          grep -R \
            -n \
            -E \
            'PKG_NAME|Package/luci-theme-argon|LUCI_TITLE' \
            package/argon \
            2>/dev/null \
            | head -50 \
            || true

          echo
          echo "===== Argon Config dependency ====="

          grep -n \
            -E \
            'LUCI_DEPENDS|luci-theme-argon' \
            package/argon-config/Makefile \
            || true

          echo
          echo "===== Search complete source tree ====="

          grep -R \
            -n \
            --include='Makefile' \
            'Package/luci-theme-argon' \
            package \
            feeds \
            2>/dev/null \
            | head -50 \
            || true

          echo
          echo "===== Check dependency target ====="

          if grep -R \
            -q \
            --include='Makefile' \
            'Package/luci-theme-argon' \
            package \
            feeds \
            2>/dev/null
          then
            echo "OK: luci-theme-argon package definition exists."
          else
            echo "ERROR: luci-theme-argon package definition does not exist."
            exit 1
          fi

          echo
          echo "============================================================"


      # ============================================================
      # 18. Create V3 configuration
      # ============================================================

      - name: Generate V3 configuration
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo
          echo "============================================================"
          echo "GENERATE IMMORTALWRT V3 CONFIGURATION"
          echo "============================================================"

          rm -f .config .config.old

          touch .config


          # ==========================================================
          # Target
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640

          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_EFI_IMAGES=y
          EOF


          # ==========================================================
          # IPv6
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_kmod-nft-nat6=y
          EOF


          # ==========================================================
          # Bonding
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-bonding=y
          CONFIG_PACKAGE_proto-bonding=y
          CONFIG_PACKAGE_luci-proto-bonding=y
          EOF


          # ==========================================================
          # LuCI
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-app-irqbalance=y
          CONFIG_PACKAGE_luci-app-package-manager=y

          CONFIG_PACKAGE_luci-app-filebrowser=n
          CONFIG_PACKAGE_luci-app-taskplan=n
          EOF


          # ==========================================================
          # SQM / CAKE
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y
          EOF


          # ==========================================================
          # IPTV
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-rtp2httpd=y
          EOF


          # ==========================================================
          # Proxy
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-ssr-plus=n
          CONFIG_PACKAGE_luci-app-passwall=n
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-mihomo=n
          CONFIG_PACKAGE_luci-app-homeproxy=n
          EOF


          # ==========================================================
          # DAED / eBPF / BTF
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_DEVEL=y

          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_REDUCED=n
          CONFIG_KERNEL_DEBUG_INFO_BTF=y

          CONFIG_KERNEL_CGROUPS=y
          CONFIG_KERNEL_CGROUP_BPF=y
          CONFIG_KERNEL_BPF_EVENTS=y

          CONFIG_BPF_TOOLCHAIN_HOST=y
          CONFIG_KERNEL_XDP_SOCKETS=y

          CONFIG_PACKAGE_kmod-xdp-sockets-diag=y

          CONFIG_PACKAGE_daed=y
          CONFIG_PACKAGE_luci-app-daed=y

          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_ip-full=y
          EOF


          # ==========================================================
          # VPN
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-softethervpn=n

          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_luci-app-openvpn-server=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y

          CONFIG_PACKAGE_netbird=n

          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          EOF


          # ==========================================================
          # Lucky
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-lucky=y
          EOF


          # ==========================================================
          # Argon
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          EOF


          # ==========================================================
          # Common packages
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y

          CONFIG_PACKAGE_vim-fuller=n
          CONFIG_PACKAGE_wget=y

          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y

          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_SOCAT_SSL=y

          CONFIG_SING_BOX_WITH_ECH=y
          CONFIG_PACKAGE_sing-box=y

          CONFIG_PACKAGE_chinadns-ng=y

          CONFIG_PACKAGE_open-vm-tools=y

          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_irqbalance=y
          EOF


          cp .config .config.requested

          echo
          echo "============================================================"
          echo "REQUESTED CONFIGURATION"
          echo "============================================================"

          cat .config


      # ============================================================
      # 19. Run defconfig
      # ============================================================

      - name: Run make defconfig
        working-directory: ./openwrt

        shell: bash

        run: |
          set -o pipefail

          echo
          echo "============================================================"
          echo "RUN MAKE DEFCONFIG"
          echo "============================================================"

          make defconfig 2>&1 | tee defconfig.log

          echo
          echo "============================================================"
          echo "DEFCONFIG COMPLETED"
          echo "============================================================"


      # ============================================================
      # 20. Audit defconfig changes
      # ============================================================

      - name: Audit defconfig changes
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo
          echo "============================================================"
          echo "DEFCONFIG AUDIT"
          echo "============================================================"

          echo
          echo "===== Changed configuration ====="

          diff -u \
            .config.requested \
            .config \
            || true

          echo
          echo "============================================================"
          echo "IMPORTANT CONFIGURATION"
          echo "============================================================"

          grep -E \
            '^CONFIG_(TARGET_|DEVEL|KERNEL_DEBUG_INFO|KERNEL_DEBUG_INFO_REDUCED|KERNEL_DEBUG_INFO_BTF|KERNEL_CGROUPS|KERNEL_CGROUP_BPF|KERNEL_BPF_EVENTS|BPF_TOOLCHAIN_HOST|KERNEL_XDP_SOCKETS)' \
            .config \
            || true

          echo
          echo "============================================================"
          echo "SELECTED THIRD-PARTY PACKAGES"
          echo "============================================================"

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall2|daed|luci-app-daed|luci-app-lucky|luci-app-rtp2httpd|luci-theme-argon|luci-app-argon-config|sing-box)=' \
            .config \
            || true


      # ============================================================
      # 21. Verify package selections
      # ============================================================

      - name: Verify package selections
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo
          echo "============================================================"
          echo "VERIFY PACKAGE SELECTIONS"
          echo "============================================================"

          FAILED=0

          check_y() {
            SYMBOL="$1"

            VALUE=$(grep "^${SYMBOL}=" .config 2>/dev/null \
              | cut -d= -f2 || true)

            echo "$SYMBOL = ${VALUE:-<NOT SET>}"

            if [ "$VALUE" != "y" ]; then
              echo "ERROR: $SYMBOL is not enabled."
              FAILED=1
            fi
          }

          check_n() {
            SYMBOL="$1"

            VALUE=$(grep "^${SYMBOL}=" .config 2>/dev/null \
              | cut -d= -f2 || true)

            echo "$SYMBOL = ${VALUE:-<NOT SET>}"

            if [ "$VALUE" != "n" ]; then
              echo "ERROR: $SYMBOL is not disabled."
              FAILED=1
            fi
          }


          echo
          echo "===== Required packages ====="

          check_y CONFIG_PACKAGE_luci
          check_y CONFIG_PACKAGE_luci-app-openclash
          check_y CONFIG_PACKAGE_luci-app-passwall2
          check_y CONFIG_PACKAGE_luci-app-daed
          check_y CONFIG_PACKAGE_daed
          check_y CONFIG_PACKAGE_luci-app-lucky
          check_y CONFIG_PACKAGE_luci-app-rtp2httpd
          check_y CONFIG_PACKAGE_luci-theme-argon
          check_y CONFIG_PACKAGE_luci-app-argon-config

          echo
          echo "===== VPN ====="

          check_y CONFIG_PACKAGE_kmod-wireguard
          check_y CONFIG_PACKAGE_wireguard-tools
          check_y CONFIG_PACKAGE_luci-app-wireguard

          echo
          echo "===== SQM ====="

          check_y CONFIG_PACKAGE_luci-app-sqm
          check_y CONFIG_PACKAGE_sqm-scripts
          check_y CONFIG_PACKAGE_kmod-sched-cake
          check_y CONFIG_PACKAGE_kmod-ifb
          check_y CONFIG_PACKAGE_tc-full

          echo
          echo "===== Disabled proxy frontends ====="

          check_n CONFIG_PACKAGE_luci-app-ssr-plus
          check_n CONFIG_PACKAGE_luci-app-passwall
          check_n CONFIG_PACKAGE_luci-app-mihomo
          check_n CONFIG_PACKAGE_luci-app-homeproxy
          check_n CONFIG_PACKAGE_netbird

          echo
          echo "===== Final result ====="

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "PACKAGE SELECTION VERIFICATION FAILED"
            echo "============================================================"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "PACKAGE SELECTION VERIFICATION PASSED"
          echo "============================================================"


      # ============================================================
      # 22. DAED / BTF configuration audit
      # ============================================================

      - name: Audit DAED BTF configuration
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo
          echo "============================================================"
          echo "DAED / BTF CONFIGURATION AUDIT"
          echo "============================================================"

          echo
          echo "===== Final DAED configuration ====="

          grep -E \
            '^CONFIG_(DEVEL|KERNEL_DEBUG_INFO|KERNEL_DEBUG_INFO_REDUCED|KERNEL_DEBUG_INFO_BTF|KERNEL_CGROUPS|KERNEL_CGROUP_BPF|KERNEL_BPF_EVENTS|BPF_TOOLCHAIN_HOST|KERNEL_XDP_SOCKETS|PACKAGE_kmod-xdp-sockets-diag|PACKAGE_daed|PACKAGE_luci-app-daed)=' \
            .config \
            || true

          echo
          echo "===== Search kernel configuration symbols ====="

          for symbol in \
            CONFIG_DEBUG_INFO \
            CONFIG_DEBUG_INFO_BTF \
            CONFIG_DEBUG_INFO_BTF_MODULES \
            CONFIG_BPF \
            CONFIG_BPF_SYSCALL \
            CONFIG_CGROUPS \
            CONFIG_CGROUP_BPF \
            CONFIG_BPF_EVENTS \
            CONFIG_XDP_SOCKETS

          do
            echo
            echo ">>> $symbol"

            grep -R \
              -n \
              --include='Config.in*' \
              --include='*.in' \
              "$symbol" \
              target \
              package \
              2>/dev/null \
              | head -20 \
              || true
          done

          echo
          echo "============================================================"


      # ============================================================
      # 23. Check defconfig warnings
      # ============================================================

      - name: Check defconfig warnings
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo
          echo "============================================================"
          echo "CHECK DEFCONFIG WARNINGS"
          echo "============================================================"

          if [ ! -f defconfig.log ]; then
            echo "ERROR: defconfig.log not found."
            exit 1
          fi

          echo
          echo "===== Warning / dependency messages ====="

          grep -n -E \
            'WARNING:|warning:|depends on|dependency|not found|unknown symbol|invalid' \
            defconfig.log \
            || true

          echo
          echo "===== OpenClash override check ====="

          if grep -q \
            'Not overriding core package .luci-app-openclash.' \
            defconfig.log
          then
            echo "ERROR: OpenClash override warning detected."
            exit 1
          fi

          echo "OK: No OpenClash override warning."

          echo
          echo "===== Argon dependency warning check ====="

          if grep -q \
            "dependency on 'luci-theme-argon', which does not exist" \
            defconfig.log
          then
            echo "ERROR: Argon dependency warning detected."
            exit 1
          fi

          echo "OK: No Argon dependency warning."

          echo
          echo "===== Complete defconfig log ====="

          cat defconfig.log

          echo
          echo "============================================================"


      # ============================================================
      # 24. Package dependency check
      # ============================================================

      - name: Package dependency check
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo
          echo "============================================================"
          echo "PACKAGE DEPENDENCY CHECK"
          echo "============================================================"

          echo
          echo "===== Third-party package dependencies ====="

          for dir in \
            package/openclash \
            package/passwall2 \
            package/dae \
            package/lucky \
            package/argon \
            package/argon-config \
            feeds/rtp2httpd

          do
            if [ -d "$dir" ]; then

              echo
              echo "############################################################"
              echo "# $dir"
              echo "############################################################"

              grep -R -n \
                --include='Makefile' \
                -E 'DEPENDS[+:]?=|LUCI_DEPENDS[+:]?=' \
                "$dir" \
                2>/dev/null \
                || true

            fi
          done

          echo
          echo "============================================================"


      # ============================================================
      # 25. Search known dependency problems
      # ============================================================

      - name: Search known dependency problems
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo
          echo "============================================================"
          echo "KNOWN DEPENDENCY SEARCH"
          echo "============================================================"

          check_dependency() {
            NAME="$1"

            echo
            echo "############################################################"
            echo "# SEARCH: $NAME"
            echo "############################################################"

            grep -R -n \
              --include='Makefile' \
              --include='Config.in' \
              --include='*.in' \
              "$NAME" \
              package \
              feeds \
              target \
              2>/dev/null \
              | head -50 \
              || true
          }

          check_dependency "vmlinux-btf"
          check_dependency "BPF_TOOLCHAIN_HOST"
          check_dependency "DEBUG_INFO_BTF"
          check_dependency "kmod-nft-tproxy"
          check_dependency "kmod-nft-socket"
          check_dependency "kmod-xdp-sockets-diag"
          check_dependency "sing-box"
          check_dependency "chinadns-ng"
          check_dependency "proto-bonding"
          check_dependency "luci-theme-argon"

          echo
          echo "============================================================"


      # ============================================================
      # 26. Save diagnostic artifacts
      # ============================================================

      - name: Upload config diagnostics
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: immortalwrt-v3-test03-config-${{ github.run_number }}
          path: |
            ./openwrt/.config
            ./openwrt/.config.requested
            ./openwrt/defconfig.log
            ./openwrt/argon-theme-install.log
          if-no-files-found: warn
          retention-days: 14


      # ============================================================
      # 27. Final summary
      # ============================================================

      - name: Final summary
        working-directory: ./openwrt

        run: |
          set -e

          echo
          echo "################################################################"
          echo "# IMMORTALWRT V3 TEST 03 FINAL SUMMARY"
          echo "################################################################"

          echo
          echo "===== ImmortalWrt ====="

          git log -1 --format='commit: %H'
          git log -1 --format='subject: %s'

          echo
          echo "===== Target ====="

          grep -E \
            '^CONFIG_TARGET_(x86|x86_64|x86_64_Generic)=' \
            .config \
            || true

          echo
          echo "===== Image configuration ====="

          grep -E \
            '^CONFIG_(TARGET_KERNEL_PARTSIZE|TARGET_ROOTFS_PARTSIZE|TARGET_IMAGES_GZIP|EFI_IMAGES)=' \
            .config \
            || true

          echo
          echo "===== Proxy ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall2|daed|luci-app-daed|sing-box)=' \
            .config \
            || true

          echo
          echo "===== VPN ====="

          grep -E \
            '^CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-app-wireguard|luci-app-openvpn|luci-app-openvpn-server|openvpn-easy-rsa)=' \
            .config \
            || true

          echo
          echo "===== SQM ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-sqm|sqm-scripts|kmod-sched-cake|kmod-ifb|tc-full)=' \
            .config \
            || true

          echo
          echo "===== DAED / BTF ====="

          grep -E \
            '^CONFIG_(KERNEL_DEBUG_INFO|KERNEL_DEBUG_INFO_REDUCED|KERNEL_DEBUG_INFO_BTF|KERNEL_CGROUPS|KERNEL_CGROUP_BPF|KERNEL_BPF_EVENTS|BPF_TOOLCHAIN_HOST|KERNEL_XDP_SOCKETS)=' \
            .config \
            || true

          echo
          echo "===== Argon ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-theme-argon|luci-app-argon-config)=' \
            .config \
            || true

          echo
          echo "===== Other ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-lucky|luci-app-rtp2httpd|luci-app-diskman|luci-app-irqbalance|luci-app-package-manager|open-vm-tools|iperf3|tcpdump|haproxy|socat|acme|chinadns-ng)=' \
            .config \
            || true

          echo
          echo "################################################################"
          echo "# TEST 03 COMPLETED"
          echo "################################################################"

name: ImmortalWrt V3 Test 06

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    if: github.event.repository.owner.id == github.event.sender.id

    permissions:
      contents: read

    name: ImmortalWrt Build ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        target: [25.12]

    steps:

      # ============================================================
      # 1. Maximize build space
      #
      # IMPORTANT:
      # Must run BEFORE checkout.
      # ============================================================

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'


      # ============================================================
      # 2. Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 3. Show runner information
      # ============================================================

      - name: Show runner information
        run: |
          set -e

          echo "============================================================"
          echo "RUNNER INFORMATION"
          echo "============================================================"

          echo
          echo "===== CPU ====="
          nproc
          lscpu | grep -E \
            'Model name|CPU\(s\)|Thread|Core|Socket' \
            || true

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== DISK ====="
          df -h

          echo
          echo "============================================================"


      # ============================================================
      # 4. Install build dependencies
      # ============================================================

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Asia/Shanghai

        run: |
          set -e

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /etc/mysql \
            /etc/php || true

          sudo -E apt-get update

          sudo -E apt-get install -y \
            ack \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gettext \
            git \
            gperf \
            help2man \
            intltool \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            make \
            ninja-build \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            scdoc

          sudo -E timedatectl set-timezone "Asia/Shanghai"


      # ============================================================
      # 5. Configure ccache
      # ============================================================

      - name: Configure ccache
        run: |
          set -e

          echo "============================================================"
          echo "CONFIGURE CCACHE"
          echo "============================================================"

          mkdir -p "$HOME/.ccache"

          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          ccache --zero-stats

          echo
          echo "===== ccache configuration ====="

          ccache --show-config

          echo
          echo "============================================================"


      # ============================================================
      # 6. Clone ImmortalWrt
      # ============================================================

      - name: Clone ImmortalWrt source
        env:
          REPO_URL: https://github.com/immortalwrt/immortalwrt
          REPO_BRANCH: openwrt-25.12

        run: |
          set -e

          git clone \
            --depth 1 \
            "$REPO_URL" \
            -b "$REPO_BRANCH" \
            openwrt

          cd openwrt

          echo
          echo "============================================================"
          echo "IMMORTALWRT SOURCE"
          echo "============================================================"

          git branch --show-current
          git log -1 --format='commit: %H'
          git log -1 --format='subject: %s'

          echo
          echo "============================================================"


      # ============================================================
      # 7. Configure feeds
      # ============================================================

      - name: Configure upstream feeds
        working-directory: ./openwrt

        run: |
          set -e

          sed -i \
            '1i src-git rtp2httpd https://github.com/stackia/rtp2httpd.git' \
            feeds.conf.default

          echo "===== feeds.conf.default ====="
          cat feeds.conf.default


      # ============================================================
      # 8. Update feeds
      # ============================================================

      - name: Update feeds
        working-directory: ./openwrt

        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ============================================================
      # 9. Install third-party packages
      # ============================================================

      - name: Install third-party packages
        working-directory: ./openwrt

        run: |
          set -e

          # ----------------------------------------------------------
          # OpenClash
          # ----------------------------------------------------------

          rm -rf package/feeds/luci/luci-app-openclash
          rm -rf package/openclash

          git clone \
            --depth 1 \
            https://github.com/vernesong/OpenClash.git \
            package/openclash


          # ----------------------------------------------------------
          # PassWall2
          # ----------------------------------------------------------

          rm -rf package/feeds/luci/luci-app-passwall2
          rm -rf package/passwall2

          git clone \
            --depth 1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall2.git \
            package/passwall2


          # ----------------------------------------------------------
          # DAED
          # ----------------------------------------------------------

          rm -rf package/dae
          rm -rf package/feeds/base/dae

          git clone \
            --depth 1 \
            https://github.com/QiuSimons/luci-app-daed.git \
            package/dae


          # ----------------------------------------------------------
          # Lucky
          # ----------------------------------------------------------

          rm -rf package/feeds/lucky/luci-app-lucky
          rm -rf package/lucky

          git clone \
            --depth 1 \
            https://github.com/gdy666/luci-app-lucky.git \
            package/lucky


          # ----------------------------------------------------------
          # Argon
          # ----------------------------------------------------------

          rm -rf package/feeds/luci/luci-theme-argon
          rm -rf package/feeds/luci/luci-app-argon-config

          rm -rf package/argon
          rm -rf package/argon-config

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/argon

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/argon-config


      # ============================================================
      # 10. Refresh feed packages
      # ============================================================

      - name: Refresh feed packages
        working-directory: ./openwrt

        run: |
          set -e

          ./scripts/feeds install -a


      # ============================================================
      # 11. Generate V3 configuration
      # ============================================================

      - name: Generate V3 configuration
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "GENERATE IMMORTALWRT V3 CONFIGURATION"
          echo "============================================================"

          rm -f .config .config.old

          touch .config


          # ==========================================================
          # Target
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640

          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_EFI_IMAGES=y
          EOF


          # ==========================================================
          # IPv6
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_kmod-nft-nat6=y
          EOF


          # ==========================================================
          # Bonding
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-bonding=y
          CONFIG_PACKAGE_proto-bonding=y
          CONFIG_PACKAGE_luci-proto-bonding=y
          EOF


          # ==========================================================
          # LuCI
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-app-irqbalance=y
          CONFIG_PACKAGE_luci-app-package-manager=y

          CONFIG_PACKAGE_luci-app-filebrowser=n
          CONFIG_PACKAGE_luci-app-taskplan=n
          EOF


          # ==========================================================
          # SQM / CAKE
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y
          EOF


          # ==========================================================
          # IPTV
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-rtp2httpd=y
          EOF


          # ==========================================================
          # Proxy
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-ssr-plus=n
          CONFIG_PACKAGE_luci-app-passwall=n
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-mihomo=n
          CONFIG_PACKAGE_luci-app-homeproxy=n
          EOF


          # ==========================================================
          # DAED / eBPF / BTF
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_DEVEL=y

          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_REDUCED=n
          CONFIG_KERNEL_DEBUG_INFO_BTF=y

          CONFIG_KERNEL_CGROUPS=y
          CONFIG_KERNEL_CGROUP_BPF=y
          CONFIG_KERNEL_BPF_EVENTS=y

          CONFIG_BPF_TOOLCHAIN_HOST=y
          CONFIG_KERNEL_XDP_SOCKETS=y

          CONFIG_PACKAGE_kmod-xdp-sockets-diag=y

          CONFIG_PACKAGE_daed=y
          CONFIG_PACKAGE_luci-app-daed=y

          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_ip-full=y
          EOF


          # ==========================================================
          # VPN
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-softethervpn=n

          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_luci-app-openvpn-server=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y

          CONFIG_PACKAGE_netbird=n

          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          EOF


          # ==========================================================
          # Lucky
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-lucky=y
          EOF


          # ==========================================================
          # Argon
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          EOF


          # ==========================================================
          # Common packages
          # ==========================================================

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y

          CONFIG_PACKAGE_vim-fuller=n
          CONFIG_PACKAGE_wget=y

          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y

          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_SOCAT_SSL=y

          CONFIG_SING_BOX_WITH_ECH=y
          CONFIG_PACKAGE_sing-box=y

          CONFIG_PACKAGE_chinadns-ng=y

          CONFIG_PACKAGE_open-vm-tools=y

          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_irqbalance=y

          CONFIG_CCACHE=y
          EOF


          # ==========================================================
          # Save requested configuration
          # ==========================================================

          cp .config .config.requested

          echo
          echo "============================================================"
          echo "REQUESTED CONFIGURATION"
          echo "============================================================"

          cat .config


      # ============================================================
      # 12. Run defconfig
      # ============================================================

      - name: Run make defconfig
        working-directory: ./openwrt

        shell: bash

        run: |
          set -o pipefail

          echo "============================================================"
          echo "RUN MAKE DEFCONFIG"
          echo "============================================================"

          make defconfig 2>&1 | tee defconfig.log

          echo
          echo "============================================================"
          echo "DEFCONFIG COMPLETED"
          echo "============================================================"


      # ============================================================
      # 13. Verify final configuration
      # ============================================================

      - name: Verify final configuration
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "VERIFY FINAL CONFIGURATION"
          echo "============================================================"

          FAILED=0

          check_y() {
            SYMBOL="$1"

            VALUE=$(grep "^${SYMBOL}=" .config 2>/dev/null \
              | cut -d= -f2 || true)

            echo "$SYMBOL = ${VALUE:-<NOT SET>}"

            if [ "$VALUE" != "y" ]; then
              echo "ERROR: $SYMBOL is not enabled."
              FAILED=1
            fi
          }

          check_not_y() {
            SYMBOL="$1"

            VALUE=$(grep "^${SYMBOL}=" .config 2>/dev/null \
              | cut -d= -f2 || true)

            echo "$SYMBOL = ${VALUE:-<NOT SET>}"

            if [ "$VALUE" = "y" ]; then
              echo "ERROR: $SYMBOL is unexpectedly enabled."
              FAILED=1
            fi
          }


          echo
          echo "===== Target ====="

          check_y CONFIG_TARGET_x86
          check_y CONFIG_TARGET_x86_64
          check_y CONFIG_TARGET_x86_64_Generic
          check_y CONFIG_EFI_IMAGES


          echo
          echo "===== Required packages ====="

          check_y CONFIG_PACKAGE_luci
          check_y CONFIG_PACKAGE_luci-app-openclash
          check_y CONFIG_PACKAGE_luci-app-passwall2
          check_y CONFIG_PACKAGE_luci-app-daed
          check_y CONFIG_PACKAGE_daed
          check_y CONFIG_PACKAGE_luci-app-lucky
          check_y CONFIG_PACKAGE_luci-app-rtp2httpd
          check_y CONFIG_PACKAGE_luci-theme-argon
          check_y CONFIG_PACKAGE_luci-app-argon-config


          echo
          echo "===== VPN ====="

          check_y CONFIG_PACKAGE_kmod-wireguard
          check_y CONFIG_PACKAGE_wireguard-tools
          check_y CONFIG_PACKAGE_luci-proto-wireguard


          echo
          echo "===== OpenVPN ====="

          check_y CONFIG_PACKAGE_luci-app-openvpn
          check_y CONFIG_PACKAGE_luci-app-openvpn-server
          check_y CONFIG_PACKAGE_openvpn-easy-rsa


          echo
          echo "===== SQM ====="

          check_y CONFIG_PACKAGE_luci-app-sqm
          check_y CONFIG_PACKAGE_sqm-scripts
          check_y CONFIG_PACKAGE_kmod-sched-cake
          check_y CONFIG_PACKAGE_kmod-ifb
          check_y CONFIG_PACKAGE_tc-full


          echo
          echo "===== DAED / BTF ====="

          check_y CONFIG_DEVEL
          check_y CONFIG_KERNEL_DEBUG_INFO
          check_y CONFIG_KERNEL_DEBUG_INFO_BTF
          check_y CONFIG_KERNEL_CGROUPS
          check_y CONFIG_KERNEL_CGROUP_BPF
          check_y CONFIG_KERNEL_BPF_EVENTS
          check_y CONFIG_BPF_TOOLCHAIN_HOST
          check_y CONFIG_KERNEL_XDP_SOCKETS
          check_y CONFIG_PACKAGE_kmod-xdp-sockets-diag


          echo
          echo "===== Other ====="

          check_y CONFIG_PACKAGE_sing-box
          check_y CONFIG_PACKAGE_chinadns-ng
          check_y CONFIG_PACKAGE_open-vm-tools
          check_y CONFIG_PACKAGE_iperf3
          check_y CONFIG_PACKAGE_tcpdump
          check_y CONFIG_PACKAGE_haproxy
          check_y CONFIG_PACKAGE_socat
          check_y CONFIG_PACKAGE_acme


          echo
          echo "===== Disabled proxy frontends ====="

          check_not_y CONFIG_PACKAGE_luci-app-ssr-plus
          check_not_y CONFIG_PACKAGE_luci-app-passwall
          check_not_y CONFIG_PACKAGE_luci-app-mihomo
          check_not_y CONFIG_PACKAGE_luci-app-homeproxy
          check_not_y CONFIG_PACKAGE_netbird


          echo
          echo "===== Final result ====="

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "FINAL CONFIGURATION VERIFICATION FAILED"
            echo "============================================================"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "FINAL CONFIGURATION VERIFICATION PASSED"
          echo "============================================================"


      # ============================================================
      # 14. Check important warnings before compilation
      # ============================================================

      - name: Check pre-build warnings
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "CHECK PRE-BUILD WARNINGS"
          echo "============================================================"

          echo
          echo "===== OpenClash override ====="

          if grep -q \
            "Not overriding core package 'luci-app-openclash'" \
            defconfig.log; then

            echo "ERROR: OpenClash override warning detected."
            exit 1

          else

            echo "OK: No OpenClash override warning."

          fi


          echo
          echo "===== Argon dependency ====="

          if grep -q \
            "package/argon-config/Makefile.*depends on 'luci-theme-argon', which does not exist" \
            defconfig.log; then

            echo "ERROR: Argon dependency warning detected."
            exit 1

          else

            echo "OK: No Argon dependency warning."

          fi


          echo
          echo "===== Defconfig warnings ====="

          grep -n -E \
            'WARNING:|warning:|depends on|dependency|not found|unknown symbol|invalid' \
            defconfig.log \
            || true

          echo
          echo "============================================================"


      # ============================================================
      # 15. Show selected configuration
      # ============================================================

      - name: Show selected configuration
        working-directory: ./openwrt

        run: |
          set -e

          echo "============================================================"
          echo "SELECTED BUILD CONFIGURATION"
          echo "============================================================"

          echo
          echo "===== Target ====="

          grep -E \
            '^CONFIG_TARGET_(x86|x86_64|x86_64_Generic)=' \
            .config \
            || true

          echo
          echo "===== Image ====="

          grep -E \
            '^CONFIG_(TARGET_KERNEL_PARTSIZE|TARGET_ROOTFS_PARTSIZE|TARGET_IMAGES_GZIP|EFI_IMAGES)=' \
            .config \
            || true

          echo
          echo "===== Proxy ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall2|daed|luci-app-daed|sing-box)=' \
            .config \
            || true

          echo
          echo "===== VPN ====="

          grep -E \
            '^CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-proto-wireguard|luci-app-openvpn|luci-app-openvpn-server|openvpn-easy-rsa)=' \
            .config \
            || true

          echo
          echo "===== SQM ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-sqm|sqm-scripts|kmod-sched-cake|kmod-ifb|tc-full)=' \
            .config \
            || true

          echo
          echo "===== DAED / BTF ====="

          grep -E \
            '^CONFIG_(DEVEL|KERNEL_DEBUG_INFO|KERNEL_DEBUG_INFO_REDUCED|KERNEL_DEBUG_INFO_BTF|KERNEL_CGROUPS|KERNEL_CGROUP_BPF|KERNEL_BPF_EVENTS|BPF_TOOLCHAIN_HOST|KERNEL_XDP_SOCKETS)=' \
            .config \
            || true

          echo
          echo "===== Argon ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-theme-argon|luci-app-argon-config)=' \
            .config \
            || true

          echo
          echo "============================================================"


      # ============================================================
      # 16. Compile
      #
      # First build:
      #   make -j$(nproc) download
      #   make -j$(nproc) world
      #
      # If compilation fails, the complete build log is preserved.
      # ============================================================

      - name: Download source packages
        working-directory: ./openwrt

        shell: bash

        run: |
          set -o pipefail

          echo "============================================================"
          echo "DOWNLOAD SOURCE PACKAGES"
          echo "============================================================"

          make download \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee download.log

          echo
          echo "============================================================"
          echo "DOWNLOAD COMPLETED"
          echo "============================================================"


      # ============================================================
      # 17. Compile ImmortalWrt
      # ============================================================

      - name: Build ImmortalWrt
        working-directory: ./openwrt

        shell: bash

        run: |
          set -o pipefail

          echo "============================================================"
          echo "START IMMORTALWRT BUILD"
          echo "============================================================"

          echo
          echo "Start time:"
          date '+%Y-%m-%d %H:%M:%S %Z'

          echo
          echo "CPU threads:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h .

          echo
          echo "============================================================"

          make world \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee build.log

          echo
          echo "============================================================"
          echo "BUILD COMPLETED"
          echo "============================================================"

          echo
          echo "End time:"
          date '+%Y-%m-%d %H:%M:%S %Z'


      # ============================================================
      # 18. Show build result
      # ============================================================

      - name: Inspect build result
        if: always()
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "BUILD RESULT"
          echo "============================================================"

          echo
          echo "===== Bin directory ====="

          if [ -d bin ]; then
            find bin \
              -maxdepth 3 \
              -type f \
              -printf '%p\t%k KB\n' \
              | sort \
              || true
          else
            echo "bin directory does not exist."
          fi


          echo
          echo "===== EFI / x86 image candidates ====="

          find bin \
            -type f \
            \( \
              -name '*efi*' \
              -o -name '*combined*' \
              -o -name '*.img.gz' \
              -o -name '*.img' \
            \) \
            -print \
            2>/dev/null \
            || true


          echo
          echo "============================================================"


      # ============================================================
      # 19. Prepare final firmware
      #
      # Goal:
      # Keep only EFI x86_64 image.
      #
      # The output name contains build date/time.
      # ============================================================

      - name: Prepare final firmware
        if: success()
        working-directory: ./openwrt

        shell: bash

        run: |
          set -e

          echo "============================================================"
          echo "PREPARE FINAL FIRMWARE"
          echo "============================================================"

          BUILD_TIME="$(date '+%Y%m%d-%H%M%S')"

          TARGET_DIR="bin/targets/x86/64"

          if [ ! -d "$TARGET_DIR" ]; then
            echo "ERROR: Target directory not found:"
            echo "$TARGET_DIR"
            exit 1
          fi


          echo
          echo "===== Target directory ====="

          ls -lah "$TARGET_DIR"


          echo
          echo "===== Search EFI images ====="

          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*efi*' \
              -o -name '*.img.gz' \
              -o -name '*.img' \
            \) \
            -print \
            || true


          # ----------------------------------------------------------
          # Find EFI image.
          #
          # Prefer .img.gz because ImmortalWrt normally generates
          # compressed x86 EFI images.
          # ----------------------------------------------------------

          EFI_IMAGE=""

          EFI_IMAGE="$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*combined-efi*.img.gz' \
            | head -1 || true)"


          if [ -z "$EFI_IMAGE" ]; then

            EFI_IMAGE="$(find "$TARGET_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*efi*.img.gz' \
              | head -1 || true)"

          fi


          if [ -z "$EFI_IMAGE" ]; then

            EFI_IMAGE="$(find "$TARGET_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*efi*.img' \
              | head -1 || true)"

          fi


          if [ -z "$EFI_IMAGE" ]; then
            echo
            echo "ERROR: EFI image not found."
            echo
            echo "Available files:"
            find "$TARGET_DIR" -maxdepth 1 -type f -print
            exit 1
          fi


          echo
          echo "Selected EFI image:"
          echo "$EFI_IMAGE"


          # ----------------------------------------------------------
          # Create release directory
          # ----------------------------------------------------------

          rm -rf final-firmware
          mkdir -p final-firmware


          # ----------------------------------------------------------
          # Copy image with timestamp
          # ----------------------------------------------------------

          if [[ "$EFI_IMAGE" == *.img.gz ]]; then

            FINAL_NAME="ImmortalWrt-V3-x86_64-efi-${BUILD_TIME}.img.gz"

          else

            FINAL_NAME="ImmortalWrt-V3-x86_64-efi-${BUILD_TIME}.img"

          fi


          cp \
            "$EFI_IMAGE" \
            "final-firmware/$FINAL_NAME"


          echo
          echo "============================================================"
          echo "FINAL FIRMWARE"
          echo "============================================================"

          ls -lh final-firmware


          echo
          echo "Firmware:"
          echo "final-firmware/$FINAL_NAME"


          # ----------------------------------------------------------
          # Generate SHA256
          # ----------------------------------------------------------

          cd final-firmware

          sha256sum \
            "$FINAL_NAME" \
            | tee SHA256SUMS


          echo
          echo "============================================================"


      # ============================================================
      # 20. Upload final firmware
      # ============================================================

      - name: Upload final firmware
        if: success()
        uses: actions/upload-artifact@v4

        with:
          name: immortalwrt-v3-x86_64-efi-${{ github.run_number }}

          path: |
            ./openwrt/final-firmware/*

          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 21. Upload build diagnostics
      # ============================================================

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: immortalwrt-v3-test06-diagnostics-${{ github.run_number }}

          path: |
            ./openwrt/.config
            ./openwrt/.config.requested
            ./openwrt/defconfig.log
            ./openwrt/download.log
            ./openwrt/build.log

          if-no-files-found: warn
          retention-days: 14


      # ============================================================
      # 22. ccache statistics
      # ============================================================

      - name: Show ccache statistics
        if: always()
        run: |
          set +e

          echo "============================================================"
          echo "CCACHE STATISTICS"
          echo "============================================================"

          ccache --show-stats || true

          echo
          echo "============================================================"


      # ============================================================
      # 23. Final summary
      # ============================================================

      - name: Final summary
        if: always()
        working-directory: ./openwrt

        run: |
          set +e

          echo
          echo "################################################################"
          echo "# IMMORTALWRT V3 TEST 06 FINAL SUMMARY"
          echo "################################################################"

          echo
          echo "===== ImmortalWrt ====="

          git log -1 --format='commit: %H'
          git log -1 --format='subject: %s'


          echo
          echo "===== Target ====="

          grep -E \
            '^CONFIG_TARGET_(x86|x86_64|x86_64_Generic)=' \
            .config \
            || true


          echo
          echo "===== Image configuration ====="

          grep -E \
            '^CONFIG_(TARGET_KERNEL_PARTSIZE|TARGET_ROOTFS_PARTSIZE|TARGET_IMAGES_GZIP|EFI_IMAGES)=' \
            .config \
            || true


          echo
          echo "===== Proxy ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall2|daed|luci-app-daed|sing-box)=' \
            .config \
            || true


          echo
          echo "===== VPN ====="

          grep -E \
            '^CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-proto-wireguard|luci-app-openvpn|luci-app-openvpn-server|openvpn-easy-rsa)=' \
            .config \
            || true


          echo
          echo "===== SQM ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-sqm|sqm-scripts|kmod-sched-cake|kmod-ifb|tc-full)=' \
            .config \
            || true


          echo
          echo "===== DAED / BTF ====="

          grep -E \
            '^CONFIG_(DEVEL|KERNEL_DEBUG_INFO|KERNEL_DEBUG_INFO_REDUCED|KERNEL_DEBUG_INFO_BTF|KERNEL_CGROUPS|KERNEL_CGROUP_BPF|KERNEL_BPF_EVENTS|BPF_TOOLCHAIN_HOST|KERNEL_XDP_SOCKETS)=' \
            .config \
            || true


          echo
          echo "===== Argon ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-theme-argon|luci-app-argon-config)=' \
            .config \
            || true


          echo
          echo "===== Firmware ====="

          if [ -d final-firmware ]; then
            ls -lah final-firmware
          else
            echo "No final firmware generated."
          fi


          echo
          echo "===== Disk ====="

          df -h .


          echo
          echo "################################################################"
          echo "# TEST 06 COMPLETED"
          echo "################################################################"

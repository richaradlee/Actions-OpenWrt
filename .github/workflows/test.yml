name: Test immortalwrt

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  OPENWRT_REPO: immortalwrt/immortalwrt
  OPENWRT_BRANCH: v25.12.1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout ImmortalWrt
      # ============================================================
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPENWRT_REPO }}
          ref: ${{ env.OPENWRT_BRANCH }}
          path: openwrt
          fetch-depth: 1

      # ============================================================
      # 2. Free disk space
      # ============================================================
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune -af || true
          df -h

      # ============================================================
      # 3. Install build dependencies
      # ============================================================
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Asia/Shanghai
        run: |
          sudo -E apt-get update
          sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lld lrzsz ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev zstd scdoc
          sudo -E timedatectl set-timezone "Asia/Shanghai"
      # ============================================================
      # 4. Get Beijing time
      # ============================================================
      - name: Get current date
        id: date
        env:
          TZ: Asia/Shanghai
        run: |
          echo "DATE=$(TZ=Asia/Shanghai date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
          echo "DATE_HUMAN=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      # ============================================================
      # 5. Update official ImmortalWrt feeds
      # ============================================================
      - name: Update official feeds
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 6. Fetch third-party sources
      #
      # 不再使用 small。
      #
      # 所有第三方软件放入 package/custom，
      # 避免与官方 feeds 发生 feed 覆盖。
      # ============================================================
      - name: Fetch third-party sources
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          mkdir -p package/custom

          # --------------------------------------------------------
          # OpenClash
          # --------------------------------------------------------
          rm -rf package/custom/luci-app-openclash
          git clone --depth 1 \
            https://github.com/vernesong/OpenClash.git \
            package/custom/openclash-src

          cp -a \
            package/custom/openclash-src/luci-app-openclash \
            package/custom/luci-app-openclash

          # --------------------------------------------------------
          # Argon
          # --------------------------------------------------------
          rm -rf package/custom/luci-theme-argon
          git clone --depth 1 -b master \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/custom/luci-theme-argon

          # --------------------------------------------------------
          # Argon Config
          # --------------------------------------------------------
          rm -rf package/custom/luci-app-argon-config
          git clone --depth 1 -b master \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/custom/luci-app-argon-config

          # --------------------------------------------------------
          # Lucky
          # --------------------------------------------------------
          rm -rf package/custom/lucky
          git clone --depth 1 \
            https://github.com/gdy666/luci-app-lucky.git \
            package/custom/lucky

          # --------------------------------------------------------
          # RTP2HTTPD
          # --------------------------------------------------------
          rm -rf package/custom/rtp2httpd
          git clone --depth 1 \
            https://github.com/stackia/rtp2httpd.git \
            package/custom/rtp2httpd

          RTP_MAKEFILE=$(find package/custom/rtp2httpd \
            -maxdepth 5 \
            -name Makefile \
            -type f | head -1)

          if [ -z "$RTP_MAKEFILE" ]; then
            echo "ERROR: RTP2HTTPD Makefile not found."
            exit 1
          fi

          RTP_DIR=$(dirname "$RTP_MAKEFILE")

          rm -rf package/custom/rtp2httpd-package
          mkdir -p package/custom/rtp2httpd-package

          cp -a \
            "$RTP_DIR"/. \
            package/custom/rtp2httpd-package/

      # ============================================================
      # 7. Fetch DAED / PassWall2 package source
      #
      # sbwml/openwrt_helloworld 同时提供：
      # daed
      # dae
      # luci-app-daed
      # luci-app-dae
      # luci-app-passwall2
      # 以及相关代理依赖。
      # ============================================================
      - name: Fetch DAED and PassWall2 sources
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          rm -rf package/custom/helloworld

          git clone --depth 1 \
            https://github.com/sbwml/openwrt_helloworld.git \
            package/custom/helloworld

          echo
          echo "============================================================"
          echo "HELLoworld SOURCE"
          echo "============================================================"

          git -C package/custom/helloworld log -1 \
            --format='%H %cd' --date=iso

      # ============================================================
      # 8. Remove duplicate packages
      #
      # 官方 feeds 如果存在同名包，
      # 删除后只使用 package/custom 中指定版本。
      # ============================================================
      - name: Remove duplicate packages
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          # LuCI
          rm -rf package/feeds/luci/luci-app-openclash
          rm -rf package/feeds/luci/luci-theme-argon
          rm -rf package/feeds/luci/luci-app-argon-config
          rm -rf package/feeds/luci/luci-app-lucky
          rm -rf package/feeds/luci/luci-app-passwall2
          rm -rf package/feeds/luci/luci-app-daed
          rm -rf package/feeds/luci/luci-app-dae

          # packages
          rm -rf package/feeds/packages/daed
          rm -rf package/feeds/packages/dae
          rm -rf package/feeds/packages/lucky

      # ============================================================
      # 9. Link selected third-party packages
      # ============================================================
      - name: Link selected third-party packages
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          link_package() {
            SRC="$1"
            DST="$2"

            if [ ! -d "$SRC" ]; then
              echo "ERROR: Package source not found: $SRC"
              exit 1
            fi

            rm -rf "$DST"

            ln -s \
              "$(pwd)/$SRC" \
              "$DST"

            echo "Linked: $DST -> $SRC"
          }

          # --------------------------------------------------------
          # DAED
          # --------------------------------------------------------
          link_package \
            package/custom/helloworld/daed \
            package/custom/daed

          link_package \
            package/custom/helloworld/luci-app-daed \
            package/custom/luci-app-daed

          # --------------------------------------------------------
          # PassWall2
          # --------------------------------------------------------
          link_package \
            package/custom/helloworld/luci-app-passwall2 \
            package/custom/luci-app-passwall2

          # --------------------------------------------------------
          # OpenClash
          # --------------------------------------------------------
          # 已经复制到 package/custom/luci-app-openclash

          # --------------------------------------------------------
          # Argon
          # --------------------------------------------------------
          # 已经 clone 到 package/custom

          # --------------------------------------------------------
          # Lucky
          # --------------------------------------------------------
          # 已经 clone 到 package/custom

          # --------------------------------------------------------
          # RTP2HTTPD
          # --------------------------------------------------------
          # 已经复制到 package/custom/rtp2httpd-package

          echo
          echo "============================================================"
          echo "SELECTED THIRD-PARTY PACKAGES"
          echo "============================================================"

          find package/custom \
            -maxdepth 2 \
            -type f \
            -name Makefile \
            -print

      # ============================================================
      # 10. Configure timezone
      # ============================================================
      - name: Configure system timezone
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          mkdir -p package/base-files/files/etc/config

          if [ -f package/base-files/files/etc/config/system ]; then

            if grep -q "option timezone" \
              package/base-files/files/etc/config/system; then

              sed -i \
                "s/^[[:space:]]*option timezone.*/	option timezone 'CST-8'/" \
                package/base-files/files/etc/config/system

            else

              sed -i \
                "/config system/a\\	option timezone 'CST-8'" \
                package/base-files/files/etc/config/system

            fi

            if grep -q "option zonename" \
              package/base-files/files/etc/config/system; then

              sed -i \
                "s/^[[:space:]]*option zonename.*/	option zonename 'Asia\\/Shanghai'/" \
                package/base-files/files/etc/config/system

            else

              sed -i \
                "/config system/a\\	option zonename 'Asia/Shanghai'" \
                package/base-files/files/etc/config/system

            fi

          else

            cat > package/base-files/files/etc/config/system <<'EOF'
          config system
                  option hostname 'OpenWrt'
                  option timezone 'CST-8'
                  option zonename 'Asia/Shanghai'
          EOF

          fi

          echo
          echo "============================================================"
          echo "SYSTEM TIMEZONE"
          echo "============================================================"

          cat package/base-files/files/etc/config/system

      # ============================================================
      # 11. Configure kernel + packages
      # ============================================================
      - name: Configure kernel and packages
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          rm -f .config
          touch .config

          cat >> .config <<'EOF'

          # ========================================================
          # x86_64 EFI
          # ========================================================
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_GRUB_IMAGES=y
          CONFIG_GRUB_EFI_IMAGES=y
          CONFIG_EFI_IMAGES=y

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=640
          CONFIG_TARGET_IMAGES_GZIP=y

          # ========================================================
          # eBPF / BTF / FTRACE
          # ========================================================
          CONFIG_KERNEL_BPF=y
          CONFIG_KERNEL_BPF_SYSCALL=y
          CONFIG_KERNEL_BPF_JIT=y
          CONFIG_KERNEL_FTRACE=y
          CONFIG_KERNEL_FUNCTION_TRACER=y
          CONFIG_KERNEL_DYNAMIC_FTRACE=y
          CONFIG_KERNEL_DYNAMIC_FTRACE_WITH_REGS=y
          CONFIG_KERNEL_FUNCTION_GRAPH_TRACER=y
          CONFIG_KERNEL_KPROBES=y
          CONFIG_KERNEL_KPROBE_EVENTS=y
          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y
          CONFIG_KERNEL_NET_INGRESS=y
          CONFIG_KERNEL_NET_EGRESS=y
          CONFIG_KERNEL_NETKIT=y

          # ========================================================
          # LuCI
          # ========================================================
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          # ========================================================
          # OpenClash
          # ========================================================
          CONFIG_PACKAGE_luci-app-openclash=y

          # ========================================================
          # PassWall2
          # ========================================================
          CONFIG_PACKAGE_luci-app-passwall2=y

          # ========================================================
          # DAED
          # ========================================================
          CONFIG_PACKAGE_daed=y
          CONFIG_PACKAGE_luci-app-daed=y

          # ========================================================
          # OpenClash / DAED firewall dependencies
          # ========================================================
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_ip-full=y

          # ========================================================
          # SQM
          # ========================================================
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_tc-full=y

          # ========================================================
          # WireGuard
          # ========================================================
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y

          # ========================================================
          # OpenVPN
          # ========================================================
          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_luci-app-openvpn-server=y
          CONFIG_PACKAGE_openvpn-easy-rsa=y

          # ========================================================
          # Lucky
          # ========================================================
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_lucky=y

          # ========================================================
          # RTP2HTTPD
          # ========================================================
          CONFIG_PACKAGE_rtp2httpd=y
          CONFIG_PACKAGE_luci-app-rtp2httpd=y

          # ========================================================
          # Argon
          # ========================================================
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          # ========================================================
          # IPv6
          # ========================================================
          CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_kmod-nft-nat6=y

          # ========================================================
          # Common tools
          # ========================================================
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_vim-fuller=n
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_acme=y
          CONFIG_PACKAGE_acme-dnsapi=y
          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_socat=y
          CONFIG_SOCAT_SSL=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_SING_BOX_WITH_ECH=y
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pv=y
          CONFIG_PACKAGE_bind-host=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_irqbalance=y

          # ========================================================
          # ccache
          # ========================================================
          CONFIG_CCACHE=y

          EOF

          make defconfig

      # ============================================================
      # 12. Verify final configuration
      # ============================================================
      - name: Verify final configuration
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          echo
          echo "============================================================"
          echo "FINAL PACKAGE CONFIGURATION"
          echo "============================================================"

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall2|daed|luci-app-daed|luci-app-sqm|sqm-scripts|luci-app-wireguard|wireguard-tools|kmod-wireguard|luci-app-openvpn|luci-app-openvpn-server|openvpn-easy-rsa|luci-app-lucky|lucky|rtp2httpd|luci-app-rtp2httpd|luci-theme-argon|luci-app-argon-config)=' \
            .config

          echo
          echo "============================================================"
          echo "FINAL KERNEL CONFIGURATION"
          echo "============================================================"

          grep -E \
            '^CONFIG_KERNEL_(BPF|BPF_SYSCALL|BPF_JIT|FTRACE|FUNCTION_TRACER|DYNAMIC_FTRACE|DYNAMIC_FTRACE_WITH_REGS|FUNCTION_GRAPH_TRACER|KPROBES|KPROBE_EVENTS|DEBUG_INFO|DEBUG_INFO_BTF|DEBUG_INFO_BTF_MODULES|NET_INGRESS|NET_EGRESS|NETKIT)=' \
            .config

      # ============================================================
      # 13. Get kernel version
      # ============================================================
      - name: Get kernel version
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          KERNEL_VERSION=$(make -s kernelversion)

          echo "KERNEL_VERSION=$KERNEL_VERSION" >> "$GITHUB_ENV"

          echo "Kernel version: $KERNEL_VERSION"

      # ============================================================
      # 14. Download sources
      # ============================================================
      - name: Download sources
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          make download -j$(nproc) V=s

      # ============================================================
      # 15. Compile
      # ============================================================
      - name: Compile
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          export CCACHE_DIR="$HOME/.ccache"
          export PATH="/usr/lib/ccache:$PATH"

          make -j$(nproc) V=s

      # ============================================================
      # 16. Verify generated packages
      # ============================================================
      - name: Verify generated packages
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          echo
          echo "============================================================"
          echo "GENERATED PACKAGES"
          echo "============================================================"

          find bin/packages \
            -type f \
            \( \
              -iname '*daed*.apk' \
              -o -iname '*passwall2*.apk' \
              -o -iname '*openclash*.apk' \
              -o -iname '*argon*.apk' \
              -o -iname '*lucky*.apk' \
              -o -iname '*rtp2httpd*.apk' \
            \) \
            -print | sort

          echo
          echo "DAED:"
          find bin/packages \
            -type f \
            -iname 'daed*.apk' \
            -print | sort

          echo
          echo "LuCI DAED:"
          find bin/packages \
            -type f \
            -iname 'luci-app-daed*.apk' \
            -print | sort

          test -n "$(find bin/packages \
            -type f \
            -iname 'daed*.apk' \
            -print -quit)"

          test -n "$(find bin/packages \
            -type f \
            -iname 'luci-app-daed*.apk' \
            -print -quit)"

      # ============================================================
      # 17. Verify final Linux kernel configuration
      # ============================================================
      - name: Verify final Linux kernel configuration
        working-directory: ./openwrt
        shell: bash
        run: |
          set -e

          KERNEL_CONFIG=$(find build_dir \
            -path '*/linux-x86_64/linux-*/.config' \
            -type f \
            | head -1)

          if [ -z "$KERNEL_CONFIG" ]; then
            echo "ERROR: Linux kernel .config not found."
            exit 1
          fi

          echo "Kernel config:"
          echo "$KERNEL_CONFIG"

          echo
          echo "============================================================"
          echo "MANDATORY DAED eBPF CONFIG"
          echo "============================================================"

          REQUIRED_CONFIGS="
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_FTRACE=y
          CONFIG_FUNCTION_TRACER=y
          CONFIG_DYNAMIC_FTRACE=y
          CONFIG_DYNAMIC_FTRACE_WITH_REGS=y
          CONFIG_KPROBES=y
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_NETKIT=y
          "

          while IFS= read -r config; do

            [ -z "$config" ] && continue

            if ! grep -qx "$config" "$KERNEL_CONFIG"; then
              echo "ERROR: Missing kernel config: $config"
              exit 1
            fi

            echo "OK: $config"

          done <<EOF
          $REQUIRED_CONFIGS
          EOF

      # ============================================================
      # 18. Prepare release
      # ============================================================
      - name: Prepare release
        working-directory: ./openwrt
        shell: bash
        env:
          TZ: Asia/Shanghai
        run: |
          set -e

          mkdir -p release

          DATE=$(TZ=Asia/Shanghai date +%Y.%m.%d-%H%M)
          DATE_HUMAN=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')

          VERSION="${OPENWRT_BRANCH#v}"

          IMAGE=$(find bin/targets/x86/64 \
            -maxdepth 1 \
            -type f \
            -name '*combined-efi.img.gz' \
            | head -1)

          if [ -z "$IMAGE" ]; then
            echo "ERROR: EFI image not found."
            exit 1
          fi

          IMAGE_NAME="ImmortalWrt-${VERSION}-x86_64-efi-${DATE}.img.gz"

          cp "$IMAGE" \
            "release/$IMAGE_NAME"

          # --------------------------------------------------------
          # SHA256
          # --------------------------------------------------------
          cd release

          sha256sum "$IMAGE_NAME" \
            > "${IMAGE_NAME}.sha256"

          cd ..

          # --------------------------------------------------------
          # Final OpenWrt config
          # --------------------------------------------------------
          cp .config \
            "release/ImmortalWrt-${VERSION}-x86_64-${DATE}.config"

          # --------------------------------------------------------
          # Build information
          # --------------------------------------------------------
          find bin/targets/x86/64 \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.buildinfo' \
              -o -name '*.manifest' \
            \) \
            -exec cp {} release/ \;

          # --------------------------------------------------------
          # Third-party source audit
          # --------------------------------------------------------
          {
            echo "ImmortalWrt=${OPENWRT_REPO}"
            echo "Branch=${OPENWRT_BRANCH}"
            echo "BuildTime=${DATE_HUMAN}"
            echo "Kernel=${KERNEL_VERSION}"

            echo
            echo "OpenClash:"
            git -C package/custom/openclash-src rev-parse HEAD

            echo
            echo "Argon:"
            git -C package/custom/luci-theme-argon rev-parse HEAD

            echo
            echo "ArgonConfig:"
            git -C package/custom/luci-app-argon-config rev-parse HEAD

            echo
            echo "Lucky:"
            git -C package/custom/lucky rev-parse HEAD

            echo
            echo "RTP2HTTPD:"
            git -C package/custom/rtp2httpd rev-parse HEAD

            echo
            echo "DAED / PassWall2:"
            git -C package/custom/helloworld rev-parse HEAD

          } > release/third-party-commits.txt

          echo
          echo "============================================================"
          echo "RELEASE FILES"
          echo "============================================================"

          ls -lh release/

      # ============================================================
      # 19. Upload artifact
      # ============================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-${{ env.OPENWRT_BRANCH }}-x86_64-${{ env.DATE }}
          path: openwrt/release/
          retention-days: 30

      # ============================================================
      # 20. Create GitHub Release
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ImmortalWrt-${{ env.DATE }}
          name: ImmortalWrt ${{ env.OPENWRT_BRANCH }} x86_64 - ${{ env.DATE }}
          body: |
            ## ImmortalWrt ${{ env.OPENWRT_BRANCH }} x86_64

            **固件内核：** ${{ env.KERNEL_VERSION }}

            **编译时间：** ${{ env.DATE_HUMAN }}（北京时间）

            **目标平台：** x86_64 Generic

            **固件格式：** EFI

            **主要组件：**
            - OpenClash
            - PassWall2
            - DAED
            - SQM / CAKE
            - WireGuard
            - OpenVPN
            - Lucky
            - RTP2HTTPD
            - Argon Theme

            **源码：** ImmortalWrt ${{ env.OPENWRT_BRANCH }}

            **第三方软件：**
            - OpenClash：vernesong/OpenClash
            - DAED / PassWall2：sbwml/openwrt_helloworld
            - Argon：jerrykuku
            - Lucky：gdy666
            - RTP2HTTPD：stackia

            **架构：** x86_64

            **镜像：** squashfs + EFI

            **SHA256：** 见 `.sha256` 文件

            > 本 Release 由 GitHub Actions 自动编译发布。
          files: |
            ./openwrt/release/*
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # ============================================================
      # 21. Delete old workflow runs
      # ============================================================
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 20
          keep_minimum_runs: 3
